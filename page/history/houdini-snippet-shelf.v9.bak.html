<title>Houdini Snippet Shelf</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap">
<style>
/* One deliberate look: black, like a network editor with the lights off. */
:root{
  color-scheme:dark;
  --bg:#000000; --dots:#20262C; --panel:#07090B; --raise:#0F1215; --field:#0B0E11;
  --line:#1C2127; --line-2:#2A3139; --ink:#E6EAEE; --ink-2:#9AA5B0; --ink-3:#6C7784;
  --accent:#6EA6EC; --accent-2:#4F86CF; --accent-soft:rgba(110,166,236,.14);
  --warn:#E3806D; --ok:#6CC08F; --code-bg:#101418; --code-ink:#D9E0E7;
  --f-ui:"Sora","IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-code:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.55 var(--f-ui);padding-inline:16px;padding-block:14px 0}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-bottom:12px;border-bottom:1px solid var(--line)}
.top h1{font:600 16px/1.2 var(--f-ui);margin:0;letter-spacing:-.005em}
.crumb{color:var(--ink-3);font-size:13px}
.crumb b{color:var(--ink-2);font-weight:500}
.top .grow{flex:1}
.search{width:240px;max-width:100%;height:32px;border-radius:16px;background:var(--raise);border:1px solid var(--line-2);color:var(--ink);padding:0 14px;font:13px var(--f-ui)}
.search::placeholder{color:var(--ink-3)}
.count{color:var(--ink-3);font-size:12.5px;font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--line-2);background:var(--raise);border-radius:8px;padding:6px 12px;font:500 13px var(--f-ui);display:inline-flex;gap:6px;align-items:center}
.btn:hover{border-color:var(--ink-3)}
.btn[disabled]{opacity:.5;cursor:default}
.btn.primary{background:var(--accent-2);border-color:var(--accent-2);color:#fff}
.btn.primary:hover{background:var(--accent)}
.btn.danger{color:var(--warn)}
.btn.small{padding:4px 9px;font-size:12px}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.app{display:grid;grid-template-columns:220px minmax(0,1fr) 430px;height:calc(100vh - 62px);min-height:520px}
@media (max-width:1180px){.app{grid-template-columns:200px minmax(0,1fr) 380px}}
@media (max-width:900px){.app{grid-template-columns:minmax(0,1fr);height:auto}}
/* pane A - categories */
.cats{border-right:1px solid var(--line);padding:12px 8px;display:flex;flex-direction:column;gap:2px;overflow-y:auto;min-width:0}
@media (max-width:900px){.cats{flex-direction:row;flex-wrap:wrap;border-right:0;border-bottom:1px solid var(--line)}}
.cat{position:relative;display:flex;align-items:center;gap:10px;padding:8px 10px 8px 12px;border:0;border-radius:8px;background:transparent;color:var(--ink-2);font:500 13px var(--f-ui);text-align:left}
.cat:hover{background:rgba(255,255,255,.04);color:var(--ink)}
.cat[aria-current="true"]{background:rgba(110,166,236,.10);color:#fff}
.cat[aria-current="true"]::before{content:"";position:absolute;left:0;top:50%;transform:translateY(-50%);height:20px;width:2px;border-radius:0 2px 2px 0;background:var(--accent)}
.cat .ic{width:18px;height:18px;flex:none;border-radius:5px;display:grid;place-items:center;font:600 10px var(--f-ui);color:#fff;background:#2A3139}
.cat[aria-current="true"] .ic{background:var(--accent-2)}
.cat .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cat .n{font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}
/* pane B - cards */
.cards-pane{display:flex;flex-direction:column;min-width:0;min-height:0}
.bbar{display:flex;align-items:center;gap:10px;padding:12px 16px 10px;border-bottom:1px solid var(--line)}
.bbar h2{margin:0;font:600 14px var(--f-ui)}
.bbar .n{color:var(--ink-3);font-size:12px}
.seg{margin-left:auto;display:inline-flex;border:1px solid var(--line-2);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;padding:4px 12px;font:500 12px var(--f-ui);color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--raise);color:#fff}
.bscroll{overflow-y:auto;min-height:0;flex:1}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;padding:16px;align-items:start}
.card{position:relative;display:block;width:100%;aspect-ratio:3/4;border-radius:16px;overflow:hidden;border:0;padding:0;background:#0C0F12;box-shadow:0 0 0 1px var(--line-2);text-align:left;transition:box-shadow .12s}
.card:hover{box-shadow:0 0 0 2px #3C4652}
.card[aria-current="true"]{box-shadow:0 0 0 2px var(--accent)}
.card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.card .ph{position:absolute;inset:0;display:grid;place-items:center;font:700 26px var(--f-ui);color:rgba(255,255,255,.9);letter-spacing:.04em;
  background-image:radial-gradient(rgba(255,255,255,.08) 1px,transparent 1.2px),linear-gradient(145deg,var(--tc) -40%,#0C0F12 75%);background-size:14px 14px,100% 100%}
.card .cap{position:absolute;left:0;right:0;bottom:0;padding:28px 12px 11px;background:linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.86) 55%);display:flex;flex-direction:column;gap:5px}
.card .cap b{font:600 13px/1.3 var(--f-ui);color:#fff;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .cap span{display:flex;gap:6px;align-items:center;font:500 11px var(--f-ui);color:#AEB8C2}
.card .cap i{width:8px;height:8px;border-radius:50%;background:var(--tc);flex:none}
.bscroll .canvas{min-height:100%}
.canvas{position:relative;background-color:var(--bg);background-image:radial-gradient(var(--dots) 1.1px,transparent 1.2px);background-size:22px 22px;padding:22px 22px 60px 6px;display:flex;flex-wrap:wrap;gap:22px;align-content:flex-start;min-width:0}
.netbox{border:1px solid var(--line);background:rgba(255,255,255,.022);border-radius:12px;padding:10px 16px 16px;min-width:260px;max-width:100%;display:flex;flex-direction:column;gap:10px}
.netbox h2{margin:0;font:500 12.5px var(--f-ui);color:var(--ink-3);display:flex;gap:8px;align-items:baseline}
.netbox h2 span{color:#48525C;font-size:11.5px}
.nrow{display:flex;align-items:center;gap:0;flex-wrap:wrap;row-gap:8px}
.node{height:36px;border-radius:18px;background:var(--raise);border:1px solid var(--line-2);display:inline-flex;align-items:center;gap:10px;padding:0 16px 0 6px;font:500 13.5px var(--f-ui);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;transition:border-color .12s}
.node:hover{border-color:#3C4652}
.node i{width:24px;height:24px;flex:none;border-radius:50%;display:grid;place-items:center;color:#fff;font:600 9px var(--f-ui);font-style:normal;letter-spacing:.02em;background:var(--tc,#4F86CF)}
.node small{color:var(--ink-3);font:500 11.5px var(--f-ui)}
.node[aria-current="true"]{border:1.5px solid var(--accent);box-shadow:0 0 0 4px rgba(110,166,236,.16)}
.vers{display:flex;align-items:center;gap:6px;position:relative;padding-left:30px}
.vers::before{content:"";position:absolute;left:0;top:50%;width:24px;border-top:1.5px solid #39434E}
.ver{height:26px;border-radius:13px;min-width:48px;padding:0 10px;background:var(--raise);border:1px solid var(--line-2);font:500 11.5px var(--f-ui);color:var(--ink-2)}
.ver:hover{border-color:#3C4652}
.ver[aria-pressed="true"]{background:var(--accent-2);border-color:var(--accent-2);color:#fff}
.legend{position:absolute;left:6px;bottom:18px;display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-3)}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend i{width:10px;height:10px;border-radius:50%;background:var(--tc)}
.empty{color:var(--ink-3);padding:24px 8px}

.panel{background:var(--panel);border-left:1px solid var(--line);padding:18px 18px 40px;display:flex;flex-direction:column;gap:16px;overflow-y:auto;min-width:0;min-height:0}
@media (max-width:900px){.panel{border-left:0;border-top:1px solid var(--line)}}
.panel h2{margin:0;font:600 19px/1.3 var(--f-ui);text-wrap:balance}
.meta{color:var(--ink-3);font-size:12.5px;margin-top:4px}
.preview{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#05070A}
.preview img{display:block;width:100%;height:auto;max-height:340px;object-fit:contain}
.preview .visual{border:0;background:transparent;padding:10px}
.phold{padding:26px 14px;text-align:center;color:var(--ink-3);font-size:12.5px}
.notes{font-size:13px;line-height:1.6;color:#B7C0C9;white-space:pre-wrap;margin:0}
.section-label{font:500 12px var(--f-ui);color:var(--ink-3);margin:0}
.files{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.file{display:flex;justify-content:space-between;gap:10px;padding:8px 2px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;font:13px var(--f-ui);color:#D5DBE1}
.file em{font-style:normal;color:var(--ink-3);font-size:11.5px;flex:none}
.file[aria-selected="true"]{color:#8DBBF2;font-weight:600}
.file:hover{color:#fff}
.fdetail{display:flex;flex-direction:column;gap:10px}
.fmeta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink-3)}
.fmeta b{color:var(--ink-2);font-weight:500}
.fdesc{margin:0;font-size:13px;color:#C3CBD3;white-space:pre-wrap}
.fnotes{margin:0;font-size:12.5px;color:var(--ink-2);white-space:pre-wrap;border-left:2px solid var(--line-2);padding-left:10px}
.codebox{background:var(--code-bg);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.codebar{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 8px 7px 12px;border-bottom:1px solid var(--line);font:12px var(--f-code);color:var(--ink-3)}
.codebar .btn{padding:4px 10px;font-size:12px}
.codebar .btn.done{color:var(--ok);border-color:#2C5A40}
pre{margin:0;overflow:auto;padding:12px 14px;max-height:56vh}
pre code{font:12.5px/1.6 var(--f-code);color:var(--code-ink);white-space:pre;tab-size:4}
.hljs-comment{color:#667380;font-style:italic}.hljs-keyword,.hljs-built_in{color:#E3A06A}.hljs-string{color:#A8C98A}
.hljs-number,.hljs-literal{color:#D6A2D8}.hljs-title,.hljs-title.function_{color:#8DBBF2}.hljs-type{color:#E6CB7A}.hljs-meta{color:#94A1AD}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:rgba(227,128,109,.08);border:1px solid rgba(227,128,109,.35);border-radius:10px;padding:10px 12px;font-size:13px}

/* diagrams */
.visual{margin:0;display:flex;flex-direction:column;gap:8px}
.visual .scroll{overflow-x:auto}
.visual svg{display:block;width:100%;height:auto}
.fdetail .visual{border:1px solid var(--line);border-radius:10px;padding:10px}
.fdetail .visual svg{min-width:520px}
.visual figcaption{font-size:12px;color:var(--ink-3)}
.visual svg text{font-family:var(--f-code);fill:var(--ink)}
.visual svg .sub{fill:var(--ink-3);font-size:10px}
.visual svg .lbl{fill:var(--ink-2);font-size:11px}
.visual svg .node rect{fill:var(--raise);stroke:var(--line-2);stroke-width:1.2}
.visual svg .node.key rect{fill:rgba(110,166,236,.14);stroke:var(--accent);stroke-width:1.6}
.visual svg .node.io rect{fill:rgba(146,119,196,.14);stroke:#9277C4}
.visual svg .node .flag{fill:var(--ink-3)}
.visual svg .node.key .flag{fill:var(--accent)}
.visual svg .wire{fill:none;stroke:#3A444F;stroke-width:1.4}
.visual svg .port{fill:var(--panel);stroke:var(--ink-3);stroke-width:1.2}
.visual svg .born{fill:var(--ink-2)}
.visual svg .unborn{fill:var(--panel);stroke:var(--ink-3);stroke-width:1.3}
.visual svg .hot{fill:var(--accent)}
.visual svg .target{fill:var(--panel);stroke:#F5D76E;stroke-width:2.2}
.visual svg .radius{fill:rgba(110,166,236,.08);stroke:var(--accent);stroke-dasharray:4 4;stroke-width:1.2}
.visual svg .pull{stroke:#F5D76E;stroke-width:1.3;stroke-dasharray:3 3;fill:none}
.visual svg .frame{fill:none;stroke:var(--line-2)}
.visual svg .emit{fill:rgba(146,119,196,.2);stroke:#9277C4}
.mask{border-collapse:collapse;font:12px var(--f-code);font-variant-numeric:tabular-nums;min-width:480px}
.mask th{font-weight:500;color:var(--ink-3);text-align:left;padding:5px 12px 5px 0;white-space:nowrap}
.mask td{text-align:center;padding:5px 0;width:40px;border-left:1px solid var(--line)}
.mask td.y{color:var(--ok)}.mask td.n{color:var(--ink-3)}
.mask td.gone{color:var(--warn);text-decoration:line-through}
.mask tr.hl td,.mask tr.hl th{background:var(--accent-soft)}

/* editor */
#main{padding:18px 0 40px}
form.editor{display:flex;flex-direction:column;gap:14px;max-width:1100px}
form.editor .dhead h2{margin:0;font:600 20px var(--f-ui)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:12px}
.card h3{margin:0;font:600 14px var(--f-ui)}
.fhead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
label{display:flex;flex-direction:column;gap:5px;font:500 12px var(--f-ui);color:var(--ink-2)}
input,select,textarea{font:13.5px var(--f-ui);color:var(--ink);background:var(--field);border:1px solid var(--line-2);border-radius:8px;padding:8px 10px;width:100%}
textarea{resize:vertical}
textarea.code{font:12.5px/1.55 var(--f-code);min-height:220px;white-space:pre;tab-size:4}
.drop{border:1px dashed var(--line-2);border-radius:8px;padding:12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2)}
.drop img{max-height:120px;width:auto;border-radius:6px}
.formbar{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;align-items:center;position:sticky;bottom:0;background:var(--bg);padding-block:10px;border-top:1px solid var(--line)}
.status{font-size:12px;color:var(--ink-3)}
.status.err{color:var(--warn)}
@media (prefers-reduced-motion:reduce){.node{transition:none}}
</style>

<header class="top">
  <h1>Houdini Snippet Shelf</h1>
  <span class="crumb">shelf / <b id="crumb">All techniques</b></span>
  <span class="grow"></span>
  <input class="search" id="q" type="search" placeholder="Search name, notes, code…" aria-label="Search techniques">
  <span class="count" id="count"></span>
  <button class="btn primary" id="newTech" type="button" hidden>+ New technique</button>
</header>
<div class="app" id="app">
  <nav class="cats" id="cats" aria-label="Categories"></nav>
  <section class="cards-pane">
    <div class="bbar"><h2 id="bTitle">All techniques</h2><span class="n" id="bCount"></span>
      <div class="seg" role="group" aria-label="View"><button type="button" id="viewCards" aria-pressed="true">Cards</button><button type="button" id="viewGraph" aria-pressed="false">Graph</button></div></div>
    <div class="bscroll"><div class="cards" id="cards"></div><section class="canvas" id="graph" hidden aria-label="Techniques, grouped by category"></section></div>
  </section>
  <aside class="panel" id="panel" aria-live="polite"></aside>
</div>
<section id="main" hidden></section>

<script id="lib-data" type="application/json">{"techniques": [{"id": "unborn-follow-live", "name": "Unborn particles → follow live", "category": "Particles", "type": "Sop", "author": "Plug", "versions": [{"v": "v001", "date": "2026-09-25", "notes": "ปัญหา: เอาเฟรมสุดท้ายของ POP sim มาเป็นพอยต์ชุดคงที่ แล้ว copy P จากซิมตาม id ตัวที่ยังไม่เกิดหา id ตัวเองไม่เจอ เลยลอยค้างอยู่กลางอากาศ\n\nวิธีแก้: ให้ตัวที่ยังไม่เกิดไปเอาตำแหน่งปัจจุบันของเพื่อนที่เกิดแล้วซึ่งอยู่ใกล้ในท่า rest (เฉลี่ยแบบ Gaussian + emitter เป็นตัวถ่วง) แล้ว blend เข้าซิมจริงตอนเกิด ใช้ขับ Point Deform ได้\n\nเริ่มจาก build_follow_live_v2.py (BUILD_DEMO = True ใช้กับ geo ว่างได้เลย)\nทดสอบกับ H21.0.671 · ยังไม่ได้ลองกับ 20.5", "previewImage": "", "previewVisual": "follow-concept", "files": [{"id": "follow-rig", "title": "Follow-live rig builder (unborn particles)", "lang": "python", "context": "Python Shell", "tested": "Houdini 21.0.671", "filename": "build_follow_live_v2.py", "description": "สร้าง rig ทั้งชุดให้พอยต์ที่ยังไม่เกิด (ยังไม่มี id ในซิม) ไปเอาตำแหน่งปัจจุบันของพาร์ติเคิลที่มีชีวิตซึ่งอยู่ใกล้มันที่สุดในเลย์เอาต์ของเฟรม rest แล้วค่อยๆ blend เข้าตำแหน่งซิมจริงตอนเกิด ใช้ขับ Point Deform ได้โดยไม่กระตุก\n\nBUILD_DEMO = True จะสร้าง grid → anim → POP sim ให้ใน geo ว่างๆ ถ้าตั้งเป็น False จะ rig scene ของพี่เอง (ตั้ง path ใน CONFIG หรือเลือก sim node ก่อนรัน)", "notes": "รัน paste ทั้งก้อนใน Windows → Python Shell · ผลลัพธ์อยู่ที่ OUT_follow_live (lattice) และ OUT_follow_deform · Max Neighbours: 256 นิ่งกว่า, 64 = default, 32 เร็วกว่า (วัดที่ 200k พาร์ติเคิล: ~470 / ~145 / ~95 ms ต่อเฟรม) · ทดสอบกับ H21 เท่านั้น ยังไม่ได้ลองกับ 20.5", "code": "# ============================================================================\n# Unborn-particle \"follow live neighbours\" rig  (paste into Houdini Python Shell)\n#\n# Problem: you take the LAST frame of a POP sim as a fixed point set and copy P\n# from the live sim by id. Points whose id is not born yet have nothing to copy\n# and hang in space. This rig moves every not-yet-born point to a smooth\n# weighted average of the CURRENT positions of live particles that sit closest\n# to it in the rest layout, so the lattice is deform-safe (Point Deform).\n#\n# HOW TO USE\n#   1. Set BUILD_DEMO / the paths in CONFIG below.\n#   2. Paste the whole thing into Windows > Python Shell and press Enter.\n#   It creates new nodes next to SIM_NODE; it never edits your existing nodes.\n# ============================================================================\n\nimport hou\n\n# ----------------------------- CONFIG ---------------------------------------\n# BUILD_DEMO = True  -> builds a test scene (grid -> anim -> POP sim) inside\n#                       DEMO_PARENT and rigs it. Good for an empty geo node.\n# BUILD_DEMO = False -> rigs YOUR scene: set the paths below. If SIM_NODE is\n#                       left \"\" the first SELECTED node is used.\nBUILD_DEMO   = True\nDEMO_PARENT  = \"/obj/geo1\"\n\nSIM_NODE     = \"\"   # live sim particles, every frame (needs i@id, f@age)\nEMITTER_NODE = \"\"   # emitter in the SAME space as SIM_NODE (\"\" = none)\nDEFORM_NODE  = \"\"   # geometry to deform, in REST pose (\"\" = auto scatter demo / skip)\nREST_FRAME   = 240  # frame whose particle layout is the rest shape\n# ----------------------------------------------------------------------------\n\n\ndef build_demo(parent_path):\n    \"\"\"grid -> anim (rises, tiny) -> popnet (source + wind). Returns (sim, emitter).\"\"\"\n    geo = hou.node(parent_path)\n    if geo is None:\n        geo = hou.node(\"/obj\").createNode(\"geo\", parent_path.rsplit(\"/\", 1)[-1])\n    grid = geo.createNode(\"grid\", \"demo_grid\")\n    anim = geo.createNode(\"xform\", \"demo_anim\")\n    anim.setInput(0, grid)\n    anim.parm(\"scale\").set(0.03)\n    ty = anim.parm(\"ty\")\n    for fr, v in ((1, 0.0), (240, 3.3)):\n        k = hou.Keyframe(); k.setFrame(fr); k.setValue(v); k.setExpression(\"linear()\")\n        ty.setKeyframe(k)\n    dop = geo.createNode(\"dopnet\", \"demo_popnet\")\n    dop.setInput(0, anim)\n    dop.parm(\"objname1\").set(\"*\") if dop.parm(\"objname1\") else None\n    obj = dop.createNode(\"popobject\", \"popobject\")\n    src = dop.createNode(\"popsource\", \"source_first_input\")\n    src.parm(\"usecontextgeo\").set(2)          # first context geometry (the anim input)\n    src.parm(\"constantrate\").set(50)\n    wind = dop.createNode(\"popwind\", \"popwind1\")\n    wind.setInput(0, src)\n    wind.parm(\"windy\").set(1); wind.parm(\"amp\").set(1); wind.parm(\"swirlsize\").set(0.67)\n    merge = dop.createNode(\"merge\", \"wire_pops_into_here\")\n    merge.setInput(0, wind)\n    solver = dop.createNode(\"popsolver\", \"popsolver\")\n    solver.setInput(0, obj); solver.setInput(2, merge)\n    out = dop.createNode(\"output\", \"output\")\n    out.setInput(0, solver)\n    out.setDisplayFlag(True)\n    dop.layoutChildren()\n    geo.layoutChildren()\n    return dop, anim\n\n\nif BUILD_DEMO:\n    sim, emitter = build_demo(DEMO_PARENT)\n    deform_src = None          # a scatter of the rest shape is built below\nelse:\n    sim = hou.node(SIM_NODE) if SIM_NODE else (hou.selectedNodes() or [None])[0]\n    if sim is None:\n        raise hou.Error(\"Set SIM_NODE (or select the sim node) - not found: %r\" % SIM_NODE)\n    emitter = hou.node(EMITTER_NODE) if EMITTER_NODE else None\n    deform_src = hou.node(DEFORM_NODE) if DEFORM_NODE else None\nnet = sim.parent()\nbase = sim.position()\n\n\ndef mk(type_name, name, dx, dy):\n    n = net.createNode(type_name, name)\n    n.setPosition(base + hou.Vector2(dx, dy))\n    return n\n\n\ndef add_float(node, name, label, default, lo, hi):\n    ptg = node.parmTemplateGroup()\n    ptg.append(hou.FloatParmTemplate(name, label, 1, default_value=(default,), min=lo, max=hi))\n    node.setParmTemplateGroup(ptg)\n\n\ndef add_int(node, name, label, default, lo, hi):\n    ptg = node.parmTemplateGroup()\n    ptg.append(hou.IntParmTemplate(name, label, 1, default_value=(default,), min=lo, max=hi))\n    node.setParmTemplateGroup(ptg)\n\n\n# 1) rest layout = sim held at REST_FRAME ------------------------------------\nrest = mk(\"timeshift\", \"follow_rest\", 3, -1)\nrest.setInput(0, sim)\nrest.parm(\"frame\").deleteAllKeyframes()   # default is a $F expression; clear it\nrest.parm(\"frame\").set(REST_FRAME)\n\n# 2) per-frame info on the live sim: where the emitter is right now ----------\ninfo = mk(\"attribwrangle\", \"follow_sim_info\", 6, -1)\ninfo.setInput(0, sim)\nif emitter is not None:\n    info.setInput(1, emitter)\ninfo.parm(\"class\").set(0)  # detail\ninfo.parm(\"snippet\").set(r'''\n// anchor position: emitter centre if one is wired, else the live cloud centre\nv@emitpos = npoints(1) > 0 ? getbbox_center(1) : getbbox_center(0);\n''')\n\n# 3) mark which rest points exist in the live sim this frame -----------------\nmark = mk(\"attribwrangle\", \"follow_mark_born\", 3, -2.5)\nmark.setInput(0, rest)\nmark.setInput(1, sim)\nmark.parm(\"snippet\").set(r'''\nint src = idtopoint(1, i@id);\ni@born  = src >= 0;\ni@srcpt = src;\n''')\n\n# 4) live-only point cloud (rest-layout P) for fast neighbour search ---------\nborn = mk(\"attribwrangle\", \"follow_born_only\", 6, -3.5)\nborn.setInput(0, mark)\nborn.parm(\"snippet\").set('if (!i@born) removepoint(0, @ptnum);')   # no group parsing -> works in any version\n\n# 5) the follow itself --------------------------------------------------------\nfol = mk(\"attribwrangle\", \"follow_live\", 3, -5)\nfol.setInput(0, mark)\nfol.setInput(1, info)   # live sim P / age + detail emitpos\nfol.setInput(2, born)   # live-only cloud\nadd_float(fol, \"blend_time\", \"Blend Time (s)\", 0.5, 0, 5)\nadd_float(fol, \"radius\", \"Closest Radius\", 0.2, 0.001, 3)\nadd_float(fol, \"anchor_weight\", \"Emitter Anchor Weight\", 1.0, 0, 50)\nadd_int(fol, \"max_neighbours\", \"Max Neighbours\", 64, 8, 2048)   # 256 = smoother, 32 = faster\nadd_float(fol, \"rest_frame\", \"Rest Frame\", REST_FRAME, 1, 1000)\nfol.parm(\"rest_frame\").setExpression('ch(\"../%s/frame\")' % rest.name())\nfol.parm(\"snippet\").set(r'''\n// Weighted CURRENT position of live neighbours; closest in the rest layout wins.\n// Gaussian weight (radius = Closest Radius) is \u003c 1e-4 beyond 3*radius, so only\n// that radius is searched: cost ~ N * neighbours, not N * N.\n// A newborn's vote fades in over Blend Time, so nothing jumps.\nfunction vector neighbourPos(vector rest; int selfid; float radius; float fade;\n                             float wa; int maxn; vector anchor) {\n    float h = max(radius, 1e-4);\n    int near[] = pcfind(2, \"P\", rest, 3 * h, maxn);\n    vector sum = 0; float wsum = 0;\n    foreach (int n; near) {\n        if (point(2, \"id\", n) == selfid) continue;\n        int s = point(2, \"srcpt\", n);\n        vector nRest = point(2, \"P\", n);\n        vector nNow  = point(1, \"P\", s);\n        float d = distance(rest, nRest) / h;\n        float w = exp(-d * d);\n        if (fade > 0) w *= smooth(0, 1, point(1, \"age\", s) / fade);\n        sum += nNow * w; wsum += w;\n    }\n    // emitter = constant-vote anchor: dominates while few particles are alive,\n    // gets outvoted naturally as the sim fills up (keeps early frames steady)\n    sum += anchor * wa; wsum += wa;\n    return wsum > 0 ? sum / wsum : rest;\n}\n\nfloat blend   = chf(\"blend_time\");\nvector anchor = detail(1, \"emitpos\");\nvector rest   = v@P;\nvector taken  = neighbourPos(rest, i@id, chf(\"radius\"), blend,\n                             chf(\"anchor_weight\"), chi(\"max_neighbours\"), anchor);\n\nif (i@born) {\n    // ease from the borrowed pose into the real sim so birth never pops ...\n    vector real = point(1, \"P\", i@srcpt);\n    float age = point(1, \"age\", i@srcpt);\n    float t = blend > 0 ? smooth(0, 1, age / blend) : 1;\n    // ... and be fully on the sim by the rest frame, so the deform matches rest\n    float restT = (chf(\"rest_frame\") - 1) * @TimeInc;   // time = (frame-1)/fps\n    if (blend > 0) t = max(t, smooth(restT - blend, restT, @Time));\n    v@P = lerp(taken, real, t);\n} else {\n    v@P = taken;\n}\n''')\n\nout = mk(\"null\", \"OUT_follow_live\", 3, -6.2)\nout.setInput(0, fol)\ncreated = [rest, info, mark, born, fol, out]\n\nif BUILD_DEMO:\n    con = mk(\"connectadjacentpieces\", \"demo_connect\", -3, -2.5)\n    con.setInput(0, rest)\n    con.parm(\"connecttype\").set(2); con.parm(\"maxsearchpoints\").set(28)\n    sc = mk(\"scatter\", \"demo_scatter\", -3, -3.7)\n    sc.setInput(0, con)\n    sc.parm(\"npts\").set(100000)\n    deform_src = mk(\"null\", \"demo_rest_geo\", -3, -4.9)\n    deform_src.setInput(0, sc)\n    created += [con, sc, deform_src]\n\n# 6) optional: Point Deform the rest geometry with the lattice ----------------\nif deform_src is not None:\n    pd = mk(\"pointdeform\", \"follow_pointdeform\", 0, -7.4)\n    pd.setInput(0, deform_src)\n    pd.setInput(1, rest)\n    pd.setInput(2, out)\n    out_d = mk(\"null\", \"OUT_follow_deform\", 0, -8.6)\n    out_d.setInput(0, pd)\n    out_d.setDisplayFlag(True)\n    out_d.setRenderFlag(True)\n    created += [pd, out_d]\nelse:\n    out.setDisplayFlag(True)\n    out.setRenderFlag(True)\n\nprint(\"follow rig built: \" + \", \".join(n.name() for n in created))\n", "visual": "rig-graph"}, {"id": "follow-live-vex", "title": "follow_live — closest live position", "lang": "vex", "context": "Attribute Wrangle · Points", "tested": "Houdini 21.0.671", "filename": "follow_live.vfl", "description": "หัวใจของ rig: ตำแหน่งปัจจุบันเฉลี่ยแบบ Gaussian ของพาร์ติเคิลที่มีชีวิตใกล้ๆ ในเลย์เอาต์ rest + emitter เป็นตัวถ่วงช่วงต้นซีน + blend เข้าซิมจริงหลังเกิด และบังคับให้ blend ครบภายในเฟรม rest", "notes": "Inputs: 0 = rest points ที่มี i@born, i@srcpt · 1 = live sim ที่มี detail v@emitpos · 2 = live-only cloud\nSpare parms ที่ต้องสร้าง: blend_time, radius, anchor_weight, max_neighbours (int), rest_frame\nอย่าใช้ ch(\"../node/parm\") ใน VEX เพื่ออ่านค่าจาก node อื่น เพราะ path จะหาไม่เจอแล้วได้ 0 ให้ link ผ่าน spare parm แทน", "code": "// Weighted CURRENT position of live neighbours; closest in the rest layout wins.\n// Gaussian weight (radius = Closest Radius) is \u003c 1e-4 beyond 3*radius, so only\n// that radius is searched: cost ~ N * neighbours, not N * N.\n// A newborn's vote fades in over Blend Time, so nothing jumps.\nfunction vector neighbourPos(vector rest; int selfid; float radius; float fade;\n                             float wa; int maxn; vector anchor) {\n    float h = max(radius, 1e-4);\n    int near[] = pcfind(2, \"P\", rest, 3 * h, maxn);\n    vector sum = 0; float wsum = 0;\n    foreach (int n; near) {\n        if (point(2, \"id\", n) == selfid) continue;\n        int s = point(2, \"srcpt\", n);\n        vector nRest = point(2, \"P\", n);\n        vector nNow  = point(1, \"P\", s);\n        float d = distance(rest, nRest) / h;\n        float w = exp(-d * d);\n        if (fade > 0) w *= smooth(0, 1, point(1, \"age\", s) / fade);\n        sum += nNow * w; wsum += w;\n    }\n    // emitter = constant-vote anchor: dominates while few particles are alive,\n    // gets outvoted naturally as the sim fills up (keeps early frames steady)\n    sum += anchor * wa; wsum += wa;\n    return wsum > 0 ? sum / wsum : rest;\n}\n\nfloat blend   = chf(\"blend_time\");\nvector anchor = detail(1, \"emitpos\");\nvector rest   = v@P;\nvector taken  = neighbourPos(rest, i@id, chf(\"radius\"), blend,\n                             chf(\"anchor_weight\"), chi(\"max_neighbours\"), anchor);\n\nif (i@born) {\n    // ease from the borrowed pose into the real sim so birth never pops ...\n    vector real = point(1, \"P\", i@srcpt);\n    float age = point(1, \"age\", i@srcpt);\n    float t = blend > 0 ? smooth(0, 1, age / blend) : 1;\n    // ... and be fully on the sim by the rest frame, so the deform matches rest\n    float restT = (chf(\"rest_frame\") - 1) * @TimeInc;   // time = (frame-1)/fps\n    if (blend > 0) t = max(t, smooth(restT - blend, restT, @Time));\n    v@P = lerp(taken, real, t);\n} else {\n    v@P = taken;\n}\n", "visual": "follow-concept"}, {"id": "mark-born-vex", "title": "mark_born — does this id exist yet?", "lang": "vex", "context": "Attribute Wrangle · Points", "tested": "Houdini 21.0.671", "filename": "mark_born.vfl", "description": "ต่อ input 0 = ท่า rest (timeshift ไปที่เฟรมสุดท้าย) และ input 1 = live sim แล้วจะเขียน i@born กับ i@srcpt (index ของพอยต์นั้นในซิมตอนนี้ ถ้ายังไม่เกิดจะเป็น -1)", "notes": "idtopoint() ต้องใช้ i@id ที่ไม่ซ้ำกัน ซึ่ง POP สร้างให้อยู่แล้ว", "code": "int src = idtopoint(1, i@id);\ni@born  = src >= 0;\ni@srcpt = src;\n", "visual": "born-mask"}, {"id": "born-only-vex", "title": "born_only — keep live points only", "lang": "vex", "context": "Attribute Wrangle · Points", "tested": "Houdini 21.0.671", "filename": "born_only.vfl", "description": "ลบพอยต์ที่ยังไม่เกิดทิ้ง ใช้แทน Blast @born==0 เพราะไม่ต้องพึ่งการอ่าน group จึงใช้ได้ทุกเวอร์ชัน", "notes": "", "code": "if (!i@born) removepoint(0, @ptnum);\n", "visual": "born-only"}, {"id": "patch-born-only", "title": "Patch: follow_born_only Blast → wrangle", "lang": "python", "context": "Python Shell", "tested": "Houdini 21.0.671", "filename": "patch_born.py", "description": "แก้ rig ที่สร้างไปแล้ว: เปลี่ยน follow_born_only จาก Blast (group @born==0) เป็น wrangle ที่ลบพอยต์ตรงๆ แล้วต่อสายเดิมให้", "notes": "ใช้เมื่อขึ้นว่าหา attribute born ไม่เจอ (เดาว่า Blast ใน 20.5 อ่าน @born==0 เป็น prim group) · ตัว v2 ใช้ wrangle อยู่แล้ว ไม่ต้อง patch ซ้ำ", "code": "# ---- patch: replace follow_born_only (Blast) with a wrangle ----------------\nimport hou\nold = [n for n in hou.node(\"/obj\").allSubChildren() if n.name() == \"follow_born_only\"]\nif not old:\n    raise hou.Error(\"follow_born_only not found - run the rig script first\")\nfor b in old:\n    net = b.parent()\n    src = b.inputs()[0]\n    w = net.createNode(\"attribwrangle\", \"follow_born_only_w\")\n    w.setPosition(b.position())\n    w.setInput(0, src)\n    w.parm(\"snippet\").set('if (!i@born) removepoint(0, @ptnum);')\n    for con in b.outputConnections():\n        con.outputNode().setInput(con.inputIndex(), w)\n    b.destroy()\n    w.setName(\"follow_born_only\")\n    print(\"patched\", w.path())\n", "visual": "patch-swap"}]}, {"v": "v002", "date": "2026-09-25", "notes": "v002: สคริปต์ Python ทุกตัวติดตั้งลง network ที่ Network Editor เปิดอยู่ แบบเดียวกับ FX Template\n• rig builder: เปิด Geometry network แล้วรัน = สร้างตรงนั้น · เปิด /obj แล้วรัน = สร้าง geo \"follow_demo\" ใหม่ให้ · โหมด BUILD_DEMO = False หาชื่อ node ใน network ที่เปิดอยู่ก่อน (ใส่ path เต็มก็ได้) · ไม่ย้าย node เดิมของพี่\n• patch: หา Blast follow_born_only เฉพาะใน network ที่เปิดอยู่และข้างใน\n• ตั้ง TARGET เป็น path ได้ถ้าจะบังคับที่ติดตั้ง\n\nปัญหา: เอาเฟรมสุดท้ายของ POP sim มาเป็นพอยต์ชุดคงที่ แล้ว copy P จากซิมตาม id ตัวที่ยังไม่เกิดหา id ตัวเองไม่เจอ เลยลอยค้างอยู่กลางอากาศ\n\nวิธีแก้: ให้ตัวที่ยังไม่เกิดไปเอาตำแหน่งปัจจุบันของเพื่อนที่เกิดแล้วซึ่งอยู่ใกล้ในท่า rest (เฉลี่ยแบบ Gaussian + emitter เป็นตัวถ่วง) แล้ว blend เข้าซิมจริงตอนเกิด ใช้ขับ Point Deform ได้\n\nเริ่มจาก build_follow_live_v2.py (BUILD_DEMO = True ใช้กับ geo ว่างได้เลย)\nทดสอบกับ H21.0.671 · ยังไม่ได้ลองกับ 20.5", "previewImage": "", "previewVisual": "follow-concept", "files": [{"id": "follow-rig", "title": "Follow-live rig builder (unborn particles)", "lang": "python", "context": "Python Shell", "tested": "Houdini 21.0.671 · current-network tests", "filename": "build_follow_live_v3.py", "description": "สร้าง rig ทั้งชุดให้พอยต์ที่ยังไม่เกิด (ยังไม่มี id ในซิม) ไปเอาตำแหน่งปัจจุบันของพาร์ติเคิลที่มีชีวิตซึ่งอยู่ใกล้มันที่สุดในเลย์เอาต์ของเฟรม rest แล้วค่อยๆ blend เข้าตำแหน่งซิมจริงตอนเกิด ใช้ขับ Point Deform ได้โดยไม่กระตุก\n\nติดตั้งลง network ที่ Network Editor เปิดอยู่: ถ้าเปิด Geometry network จะสร้างตรงนั้น ถ้าเปิด /obj จะสร้าง geo ใหม่ชื่อ follow_demo\nBUILD_DEMO = True จะสร้าง grid → anim → POP sim เป็นตัวอย่าง ถ้าตั้งเป็น False จะ rig scene ของพี่เอง ใส่แค่ชื่อ node ใน network ที่เปิดอยู่ก็พอ หรือเลือก sim node ก่อนรัน", "notes": "รัน paste ทั้งก้อนใน Windows → Python Shell · ผลลัพธ์อยู่ที่ OUT_follow_live (lattice) และ OUT_follow_deform · Max Neighbours: 256 นิ่งกว่า, 64 = default, 32 เร็วกว่า (วัดที่ 200k พาร์ติเคิล: ~470 / ~145 / ~95 ms ต่อเฟรม) · ทดสอบกับ H21 เท่านั้น ยังไม่ได้ลองกับ 20.5", "code": "# ============================================================================\n# Unborn-particle \"follow live neighbours\" rig  (paste into Houdini Python Shell)\n#\n# Problem: you take the LAST frame of a POP sim as a fixed point set and copy P\n# from the live sim by id. Points whose id is not born yet have nothing to copy\n# and hang in space. This rig moves every not-yet-born point to a smooth\n# weighted average of the CURRENT positions of live particles that sit closest\n# to it in the rest layout, so the lattice is deform-safe (Point Deform).\n#\n# HOW TO USE\n#   1. Open the network you want in the Network Editor:\n#        - a Geometry (SOP) network -> the rig is built right there\n#        - /obj                     -> a new \"follow_demo\" geo is created for it\n#   2. Paste the whole thing into Windows > Python Shell and press Enter.\n#   It never edits your existing nodes.\n# ============================================================================\n\nimport hou\n\n# ----------------------------- CONFIG ---------------------------------------\n# BUILD_DEMO = True  -> builds a test scene (grid -> anim -> POP sim) in the\n#                       current network and rigs it.\n# BUILD_DEMO = False -> rigs YOUR scene. Node names below are looked up in the\n#                       current network first (full paths work too). If\n#                       SIM_NODE is \"\" the first SELECTED node is used.\nBUILD_DEMO   = True\nTARGET       = \"\"   # \"\" = the network the Network Editor is showing; or a path\n\nSIM_NODE     = \"\"   # live sim particles, every frame (needs i@id, f@age)\nEMITTER_NODE = \"\"   # emitter in the SAME space as SIM_NODE (\"\" = none)\nDEFORM_NODE  = \"\"   # geometry to deform, in REST pose (\"\" = auto scatter demo / skip)\nREST_FRAME   = 240  # frame whose particle layout is the rest shape\n# ----------------------------------------------------------------------------\n\n\ndef current_network():\n    \"\"\"TARGET if set, else the network shown in the Network Editor.\"\"\"\n    if TARGET:\n        n = hou.node(TARGET)\n        if n is None:\n            raise hou.Error(\"TARGET not found: %s\" % TARGET)\n        return n\n    ne = hou.ui.paneTabOfType(hou.paneTabType.NetworkEditor) if hou.isUIAvailable() else None\n    if ne is None:\n        raise hou.Error(\"No Network Editor found - open one, or set TARGET.\")\n    return ne.pwd()\n\n\ndef sop_network(net):\n    \"\"\"A SOP network to build in: net itself, or a new geo when net is /obj-level.\"\"\"\n    cat = net.childTypeCategory().name()\n    if cat == \"Sop\":\n        return net\n    if cat == \"Object\":\n        return net.createNode(\"geo\", \"follow_demo\")\n    raise hou.Error(\"Open a Geometry (SOP) network or /obj - %s holds %s nodes.\" % (net.path(), cat))\n\n\ndef find(name, net):\n    \"\"\"Look a node up relative to the current network first, then as a full path.\"\"\"\n    if not name:\n        return None\n    n = net.node(name) or hou.node(name)\n    if n is None:\n        raise hou.Error(\"Node not found: %r (looked in %s and as a full path)\" % (name, net.path()))\n    return n\n\n\ndef build_demo(geo):\n    \"\"\"grid -> anim (rises, tiny) -> popnet (source + wind) in SOP network geo. Returns (sim, emitter).\"\"\"\n    ys = [c.position()[1] for c in geo.children()]\n    top = (min(ys) - 2) if ys else 0          # start below whatever is already there\n    grid = geo.createNode(\"grid\", \"demo_grid\")\n    anim = geo.createNode(\"xform\", \"demo_anim\")\n    anim.setInput(0, grid)\n    anim.parm(\"scale\").set(0.03)\n    ty = anim.parm(\"ty\")\n    for fr, v in ((1, 0.0), (240, 3.3)):\n        k = hou.Keyframe(); k.setFrame(fr); k.setValue(v); k.setExpression(\"linear()\")\n        ty.setKeyframe(k)\n    dop = geo.createNode(\"dopnet\", \"demo_popnet\")\n    dop.setInput(0, anim)\n    dop.parm(\"objname1\").set(\"*\") if dop.parm(\"objname1\") else None\n    obj = dop.createNode(\"popobject\", \"popobject\")\n    src = dop.createNode(\"popsource\", \"source_first_input\")\n    src.parm(\"usecontextgeo\").set(2)          # first context geometry (the anim input)\n    src.parm(\"constantrate\").set(50)\n    wind = dop.createNode(\"popwind\", \"popwind1\")\n    wind.setInput(0, src)\n    wind.parm(\"windy\").set(1); wind.parm(\"amp\").set(1); wind.parm(\"swirlsize\").set(0.67)\n    merge = dop.createNode(\"merge\", \"wire_pops_into_here\")\n    merge.setInput(0, wind)\n    solver = dop.createNode(\"popsolver\", \"popsolver\")\n    solver.setInput(0, obj); solver.setInput(2, merge)\n    out = dop.createNode(\"output\", \"output\")\n    out.setInput(0, solver)\n    out.setDisplayFlag(True)\n    dop.layoutChildren()\n    grid.setPosition(hou.Vector2(0, top)); anim.setPosition(hou.Vector2(0, top - 1)); dop.setPosition(hou.Vector2(0, top - 2))\n    return dop, anim\n\n\nhere = current_network()\nif BUILD_DEMO:\n    sim, emitter = build_demo(sop_network(here))\n    deform_src = None          # a scatter of the rest shape is built below\nelse:\n    sim = find(SIM_NODE, here) if SIM_NODE else (hou.selectedNodes() or [None])[0]\n    if sim is None:\n        raise hou.Error(\"Set SIM_NODE or select the sim node first.\")\n    emitter = find(EMITTER_NODE, here)\n    deform_src = find(DEFORM_NODE, here)\nnet = sim.parent()\nbase = sim.position()\n\n\ndef mk(type_name, name, dx, dy):\n    n = net.createNode(type_name, name)\n    n.setPosition(base + hou.Vector2(dx, dy))\n    return n\n\n\ndef add_float(node, name, label, default, lo, hi):\n    ptg = node.parmTemplateGroup()\n    ptg.append(hou.FloatParmTemplate(name, label, 1, default_value=(default,), min=lo, max=hi))\n    node.setParmTemplateGroup(ptg)\n\n\ndef add_int(node, name, label, default, lo, hi):\n    ptg = node.parmTemplateGroup()\n    ptg.append(hou.IntParmTemplate(name, label, 1, default_value=(default,), min=lo, max=hi))\n    node.setParmTemplateGroup(ptg)\n\n\n# 1) rest layout = sim held at REST_FRAME ------------------------------------\nrest = mk(\"timeshift\", \"follow_rest\", 3, -1)\nrest.setInput(0, sim)\nrest.parm(\"frame\").deleteAllKeyframes()   # default is a $F expression; clear it\nrest.parm(\"frame\").set(REST_FRAME)\n\n# 2) per-frame info on the live sim: where the emitter is right now ----------\ninfo = mk(\"attribwrangle\", \"follow_sim_info\", 6, -1)\ninfo.setInput(0, sim)\nif emitter is not None:\n    info.setInput(1, emitter)\ninfo.parm(\"class\").set(0)  # detail\ninfo.parm(\"snippet\").set(r'''\n// anchor position: emitter centre if one is wired, else the live cloud centre\nv@emitpos = npoints(1) > 0 ? getbbox_center(1) : getbbox_center(0);\n''')\n\n# 3) mark which rest points exist in the live sim this frame -----------------\nmark = mk(\"attribwrangle\", \"follow_mark_born\", 3, -2.5)\nmark.setInput(0, rest)\nmark.setInput(1, sim)\nmark.parm(\"snippet\").set(r'''\nint src = idtopoint(1, i@id);\ni@born  = src >= 0;\ni@srcpt = src;\n''')\n\n# 4) live-only point cloud (rest-layout P) for fast neighbour search ---------\nborn = mk(\"attribwrangle\", \"follow_born_only\", 6, -3.5)\nborn.setInput(0, mark)\nborn.parm(\"snippet\").set('if (!i@born) removepoint(0, @ptnum);')   # no group parsing -> works in any version\n\n# 5) the follow itself --------------------------------------------------------\nfol = mk(\"attribwrangle\", \"follow_live\", 3, -5)\nfol.setInput(0, mark)\nfol.setInput(1, info)   # live sim P / age + detail emitpos\nfol.setInput(2, born)   # live-only cloud\nadd_float(fol, \"blend_time\", \"Blend Time (s)\", 0.5, 0, 5)\nadd_float(fol, \"radius\", \"Closest Radius\", 0.2, 0.001, 3)\nadd_float(fol, \"anchor_weight\", \"Emitter Anchor Weight\", 1.0, 0, 50)\nadd_int(fol, \"max_neighbours\", \"Max Neighbours\", 64, 8, 2048)   # 256 = smoother, 32 = faster\nadd_float(fol, \"rest_frame\", \"Rest Frame\", REST_FRAME, 1, 1000)\nfol.parm(\"rest_frame\").setExpression('ch(\"../%s/frame\")' % rest.name())\nfol.parm(\"snippet\").set(r'''\n// Weighted CURRENT position of live neighbours; closest in the rest layout wins.\n// Gaussian weight (radius = Closest Radius) is \u003c 1e-4 beyond 3*radius, so only\n// that radius is searched: cost ~ N * neighbours, not N * N.\n// A newborn's vote fades in over Blend Time, so nothing jumps.\nfunction vector neighbourPos(vector rest; int selfid; float radius; float fade;\n                             float wa; int maxn; vector anchor) {\n    float h = max(radius, 1e-4);\n    int near[] = pcfind(2, \"P\", rest, 3 * h, maxn);\n    vector sum = 0; float wsum = 0;\n    foreach (int n; near) {\n        if (point(2, \"id\", n) == selfid) continue;\n        int s = point(2, \"srcpt\", n);\n        vector nRest = point(2, \"P\", n);\n        vector nNow  = point(1, \"P\", s);\n        float d = distance(rest, nRest) / h;\n        float w = exp(-d * d);\n        if (fade > 0) w *= smooth(0, 1, point(1, \"age\", s) / fade);\n        sum += nNow * w; wsum += w;\n    }\n    // emitter = constant-vote anchor: dominates while few particles are alive,\n    // gets outvoted naturally as the sim fills up (keeps early frames steady)\n    sum += anchor * wa; wsum += wa;\n    return wsum > 0 ? sum / wsum : rest;\n}\n\nfloat blend   = chf(\"blend_time\");\nvector anchor = detail(1, \"emitpos\");\nvector rest   = v@P;\nvector taken  = neighbourPos(rest, i@id, chf(\"radius\"), blend,\n                             chf(\"anchor_weight\"), chi(\"max_neighbours\"), anchor);\n\nif (i@born) {\n    // ease from the borrowed pose into the real sim so birth never pops ...\n    vector real = point(1, \"P\", i@srcpt);\n    float age = point(1, \"age\", i@srcpt);\n    float t = blend > 0 ? smooth(0, 1, age / blend) : 1;\n    // ... and be fully on the sim by the rest frame, so the deform matches rest\n    float restT = (chf(\"rest_frame\") - 1) * @TimeInc;   // time = (frame-1)/fps\n    if (blend > 0) t = max(t, smooth(restT - blend, restT, @Time));\n    v@P = lerp(taken, real, t);\n} else {\n    v@P = taken;\n}\n''')\n\nout = mk(\"null\", \"OUT_follow_live\", 3, -6.2)\nout.setInput(0, fol)\ncreated = [rest, info, mark, born, fol, out]\n\nif BUILD_DEMO:\n    con = mk(\"connectadjacentpieces\", \"demo_connect\", -3, -2.5)\n    con.setInput(0, rest)\n    con.parm(\"connecttype\").set(2); con.parm(\"maxsearchpoints\").set(28)\n    sc = mk(\"scatter\", \"demo_scatter\", -3, -3.7)\n    sc.setInput(0, con)\n    sc.parm(\"npts\").set(100000)\n    deform_src = mk(\"null\", \"demo_rest_geo\", -3, -4.9)\n    deform_src.setInput(0, sc)\n    created += [con, sc, deform_src]\n\n# 6) optional: Point Deform the rest geometry with the lattice ----------------\nif deform_src is not None:\n    pd = mk(\"pointdeform\", \"follow_pointdeform\", 0, -7.4)\n    pd.setInput(0, deform_src)\n    pd.setInput(1, rest)\n    pd.setInput(2, out)\n    out_d = mk(\"null\", \"OUT_follow_deform\", 0, -8.6)\n    out_d.setInput(0, pd)\n    out_d.setDisplayFlag(True)\n    out_d.setRenderFlag(True)\n    created += [pd, out_d]\nelse:\n    out.setDisplayFlag(True)\n    out.setRenderFlag(True)\n\nprint(\"follow rig built in %s: %s\" % (net.path(), \", \".join(n.name() for n in created)))\n", "visual": "rig-graph"}, {"id": "follow-live-vex", "title": "follow_live — closest live position", "lang": "vex", "context": "Attribute Wrangle · Points", "tested": "Houdini 21.0.671", "filename": "follow_live.vfl", "description": "หัวใจของ rig: ตำแหน่งปัจจุบันเฉลี่ยแบบ Gaussian ของพาร์ติเคิลที่มีชีวิตใกล้ๆ ในเลย์เอาต์ rest + emitter เป็นตัวถ่วงช่วงต้นซีน + blend เข้าซิมจริงหลังเกิด และบังคับให้ blend ครบภายในเฟรม rest", "notes": "Inputs: 0 = rest points ที่มี i@born, i@srcpt · 1 = live sim ที่มี detail v@emitpos · 2 = live-only cloud\nSpare parms ที่ต้องสร้าง: blend_time, radius, anchor_weight, max_neighbours (int), rest_frame\nอย่าใช้ ch(\"../node/parm\") ใน VEX เพื่ออ่านค่าจาก node อื่น เพราะ path จะหาไม่เจอแล้วได้ 0 ให้ link ผ่าน spare parm แทน", "code": "// Weighted CURRENT position of live neighbours; closest in the rest layout wins.\n// Gaussian weight (radius = Closest Radius) is \u003c 1e-4 beyond 3*radius, so only\n// that radius is searched: cost ~ N * neighbours, not N * N.\n// A newborn's vote fades in over Blend Time, so nothing jumps.\nfunction vector neighbourPos(vector rest; int selfid; float radius; float fade;\n                             float wa; int maxn; vector anchor) {\n    float h = max(radius, 1e-4);\n    int near[] = pcfind(2, \"P\", rest, 3 * h, maxn);\n    vector sum = 0; float wsum = 0;\n    foreach (int n; near) {\n        if (point(2, \"id\", n) == selfid) continue;\n        int s = point(2, \"srcpt\", n);\n        vector nRest = point(2, \"P\", n);\n        vector nNow  = point(1, \"P\", s);\n        float d = distance(rest, nRest) / h;\n        float w = exp(-d * d);\n        if (fade > 0) w *= smooth(0, 1, point(1, \"age\", s) / fade);\n        sum += nNow * w; wsum += w;\n    }\n    // emitter = constant-vote anchor: dominates while few particles are alive,\n    // gets outvoted naturally as the sim fills up (keeps early frames steady)\n    sum += anchor * wa; wsum += wa;\n    return wsum > 0 ? sum / wsum : rest;\n}\n\nfloat blend   = chf(\"blend_time\");\nvector anchor = detail(1, \"emitpos\");\nvector rest   = v@P;\nvector taken  = neighbourPos(rest, i@id, chf(\"radius\"), blend,\n                             chf(\"anchor_weight\"), chi(\"max_neighbours\"), anchor);\n\nif (i@born) {\n    // ease from the borrowed pose into the real sim so birth never pops ...\n    vector real = point(1, \"P\", i@srcpt);\n    float age = point(1, \"age\", i@srcpt);\n    float t = blend > 0 ? smooth(0, 1, age / blend) : 1;\n    // ... and be fully on the sim by the rest frame, so the deform matches rest\n    float restT = (chf(\"rest_frame\") - 1) * @TimeInc;   // time = (frame-1)/fps\n    if (blend > 0) t = max(t, smooth(restT - blend, restT, @Time));\n    v@P = lerp(taken, real, t);\n} else {\n    v@P = taken;\n}\n", "visual": "follow-concept"}, {"id": "mark-born-vex", "title": "mark_born — does this id exist yet?", "lang": "vex", "context": "Attribute Wrangle · Points", "tested": "Houdini 21.0.671", "filename": "mark_born.vfl", "description": "ต่อ input 0 = ท่า rest (timeshift ไปที่เฟรมสุดท้าย) และ input 1 = live sim แล้วจะเขียน i@born กับ i@srcpt (index ของพอยต์นั้นในซิมตอนนี้ ถ้ายังไม่เกิดจะเป็น -1)", "notes": "idtopoint() ต้องใช้ i@id ที่ไม่ซ้ำกัน ซึ่ง POP สร้างให้อยู่แล้ว", "code": "int src = idtopoint(1, i@id);\ni@born  = src >= 0;\ni@srcpt = src;\n", "visual": "born-mask"}, {"id": "born-only-vex", "title": "born_only — keep live points only", "lang": "vex", "context": "Attribute Wrangle · Points", "tested": "Houdini 21.0.671", "filename": "born_only.vfl", "description": "ลบพอยต์ที่ยังไม่เกิดทิ้ง ใช้แทน Blast @born==0 เพราะไม่ต้องพึ่งการอ่าน group จึงใช้ได้ทุกเวอร์ชัน", "notes": "", "code": "if (!i@born) removepoint(0, @ptnum);\n", "visual": "born-only"}, {"id": "patch-born-only", "title": "Patch: follow_born_only Blast → wrangle", "lang": "python", "context": "Python Shell", "tested": "Houdini 21.0.671 · current-network tests", "filename": "patch_born_v2.py", "description": "แก้ rig ที่สร้างไปแล้ว: หา Blast ชื่อ follow_born_only ใน network ที่ Network Editor เปิดอยู่ (รวมข้างใน) แล้วเปลี่ยนเป็น wrangle ที่ลบพอยต์ตรงๆ พร้อมต่อสายเดิมให้", "notes": "ใช้เมื่อขึ้นว่าหา attribute born ไม่เจอ (เดาว่า Blast ใน 20.5 อ่าน @born==0 เป็น prim group) · ตัว v2 ใช้ wrangle อยู่แล้ว ไม่ต้อง patch ซ้ำ", "code": "# ---- patch: replace follow_born_only (Blast) with a wrangle ----------------\n# Works on the network the Network Editor is showing (and everything inside it).\n# Set TARGET to a path to patch somewhere else.\nimport hou\n\nTARGET = \"\"   # \"\" = the network the Network Editor is showing\n\nif TARGET:\n    here = hou.node(TARGET)\nelse:\n    ne = hou.ui.paneTabOfType(hou.paneTabType.NetworkEditor) if hou.isUIAvailable() else None\n    here = ne.pwd() if ne else None\nif here is None:\n    raise hou.Error(\"Open the network with the rig in the Network Editor, or set TARGET.\")\n\nold = [n for n in [here] + list(here.allSubChildren())\n       if n.name() == \"follow_born_only\" and n.type().name() == \"blast\"]\nif not old:\n    raise hou.Error(\"No Blast called follow_born_only in %s - nothing to patch.\" % here.path())\nfor b in old:\n    net = b.parent()\n    src = b.inputs()[0]\n    w = net.createNode(\"attribwrangle\", \"follow_born_only_w\")\n    w.setPosition(b.position())\n    w.setInput(0, src)\n    w.parm(\"snippet\").set('if (!i@born) removepoint(0, @ptnum);')\n    for con in b.outputConnections():\n        con.outputNode().setInput(con.inputIndex(), w)\n    b.destroy()\n    w.setName(\"follow_born_only\")\n    print(\"patched\", w.path())\n", "visual": "patch-swap"}]}, {"v": "v003", "date": "2026-09-25", "notes": "v003: ใช้ frame range ปัจจุบันของ scene\n• หลังสร้าง node สคริปต์อ่าน start / end frame จาก playbar แล้วตั้งให้ parm ที่เป็น start frame (solver, DOP network: startframe / start_frame …) และ frame range ของ ROP / file cache (f1, f2)\n• parm ที่มี expression อยู่แล้ว (เช่น $FSTART) ไม่ถูกแตะ\n• ตั้ง START_FRAME / END_FRAME เองได้ หรือ LINK_TO_PLAYBAR = True ให้เขียน $FSTART / $FEND ตาม playbar ตลอด\n• สคริปต์พิมพ์ออกมาว่าตั้ง parm ไหนไปบ้าง\n• rig builder: demo POP sim เริ่มที่ start frame · rest shape = end frame (REST_FRAME = None) · anim ของ emitter ขยับจาก start ถึง end\n\nv002: สคริปต์ Python ทุกตัวติดตั้งลง network ที่ Network Editor เปิดอยู่ แบบเดียวกับ FX Template\n• rig builder: เปิด Geometry network แล้วรัน = สร้างตรงนั้น · เปิด /obj แล้วรัน = สร้าง geo \"follow_demo\" ใหม่ให้ · โหมด BUILD_DEMO = False หาชื่อ node ใน network ที่เปิดอยู่ก่อน (ใส่ path เต็มก็ได้) · ไม่ย้าย node เดิมของพี่\n• patch: หา Blast follow_born_only เฉพาะใน network ที่เปิดอยู่และข้างใน\n• ตั้ง TARGET เป็น path ได้ถ้าจะบังคับที่ติดตั้ง\n\nปัญหา: เอาเฟรมสุดท้ายของ POP sim มาเป็นพอยต์ชุดคงที่ แล้ว copy P จากซิมตาม id ตัวที่ยังไม่เกิดหา id ตัวเองไม่เจอ เลยลอยค้างอยู่กลางอากาศ\n\nวิธีแก้: ให้ตัวที่ยังไม่เกิดไปเอาตำแหน่งปัจจุบันของเพื่อนที่เกิดแล้วซึ่งอยู่ใกล้ในท่า rest (เฉลี่ยแบบ Gaussian + emitter เป็นตัวถ่วง) แล้ว blend เข้าซิมจริงตอนเกิด ใช้ขับ Point Deform ได้\n\nเริ่มจาก build_follow_live_v2.py (BUILD_DEMO = True ใช้กับ geo ว่างได้เลย)\nทดสอบกับ H21.0.671 · ยังไม่ได้ลองกับ 20.5", "previewImage": "", "previewVisual": "follow-concept", "files": [{"id": "follow-rig", "title": "Follow-live rig builder (unborn particles)", "lang": "python", "context": "Python Shell", "tested": "Houdini 21.0.671 · playbar 1001-1100 test", "filename": "build_follow_live_v4.py", "description": "สร้าง rig ทั้งชุดให้พอยต์ที่ยังไม่เกิด (ยังไม่มี id ในซิม) ไปเอาตำแหน่งปัจจุบันของพาร์ติเคิลที่มีชีวิตซึ่งอยู่ใกล้มันที่สุดในเลย์เอาต์ของเฟรม rest แล้วค่อยๆ blend เข้าตำแหน่งซิมจริงตอนเกิด ใช้ขับ Point Deform ได้โดยไม่กระตุก\n\nติดตั้งลง network ที่ Network Editor เปิดอยู่: ถ้าเปิด Geometry network จะสร้างตรงนั้น ถ้าเปิด /obj จะสร้าง geo ใหม่ชื่อ follow_demo\nBUILD_DEMO = True จะสร้าง grid → anim → POP sim เป็นตัวอย่าง ถ้าตั้งเป็น False จะ rig scene ของพี่เอง ใส่แค่ชื่อ node ใน network ที่เปิดอยู่ก็พอ หรือเลือก sim node ก่อนรัน", "notes": "รัน paste ทั้งก้อนใน Windows → Python Shell · ผลลัพธ์อยู่ที่ OUT_follow_live (lattice) และ OUT_follow_deform · Max Neighbours: 256 นิ่งกว่า, 64 = default, 32 เร็วกว่า (วัดที่ 200k พาร์ติเคิล: ~470 / ~145 / ~95 ms ต่อเฟรม) · ทดสอบกับ H21 เท่านั้น ยังไม่ได้ลองกับ 20.5", "code": "# ============================================================================\n# Unborn-particle \"follow live neighbours\" rig  (paste into Houdini Python Shell)\n#\n# Problem: you take the LAST frame of a POP sim as a fixed point set and copy P\n# from the live sim by id. Points whose id is not born yet have nothing to copy\n# and hang in space. This rig moves every not-yet-born point to a smooth\n# weighted average of the CURRENT positions of live particles that sit closest\n# to it in the rest layout, so the lattice is deform-safe (Point Deform).\n#\n# HOW TO USE\n#   1. Open the network you want in the Network Editor:\n#        - a Geometry (SOP) network -> the rig is built right there\n#        - /obj                     -> a new \"follow_demo\" geo is created for it\n#   2. Paste the whole thing into Windows > Python Shell and press Enter.\n#   It never edits your existing nodes.\n#   Frames come from the playbar: the demo sim starts at the start frame and\n#   the rest shape is the end frame (override with START_FRAME / END_FRAME /\n#   REST_FRAME, or set LINK_TO_PLAYBAR = True to keep following the playbar).\n# ============================================================================\n\nimport hou\n\n# ----------------------------- CONFIG ---------------------------------------\n# BUILD_DEMO = True  -> builds a test scene (grid -> anim -> POP sim) in the\n#                       current network and rigs it.\n# BUILD_DEMO = False -> rigs YOUR scene. Node names below are looked up in the\n#                       current network first (full paths work too). If\n#                       SIM_NODE is \"\" the first SELECTED node is used.\nBUILD_DEMO   = True\nTARGET       = \"\"   # \"\" = the network the Network Editor is showing; or a path\n\nSIM_NODE     = \"\"   # live sim particles, every frame (needs i@id, f@age)\nEMITTER_NODE = \"\"   # emitter in the SAME space as SIM_NODE (\"\" = none)\nDEFORM_NODE  = \"\"   # geometry to deform, in REST pose (\"\" = auto scatter demo / skip)\nREST_FRAME   = None # frame whose particle layout is the rest shape (None = END frame below)\n# ----------------------------------------------------------------------------\n\n# ---- frame range: use the scene's current start / end frame -----------------\nSTART_FRAME     = None   # None = the playbar's start frame right now\nEND_FRAME       = None   # None = the playbar's end frame right now\nLINK_TO_PLAYBAR = False  # True = write $FSTART / $FEND expressions instead of numbers\n\nSTART_PARMS = (\"startframe\", \"start_frame\", \"startFrame\", \"sim_start\", \"simstart\")\n\n\ndef scene_frame_range():\n    fs, fe = hou.playbar.frameRange()\n    return (float(START_FRAME) if START_FRAME is not None else fs,\n            float(END_FRAME) if END_FRAME is not None else fe)\n\n\ndef _is_driven(p):\n    \"\"\"Leave parms that already follow something (expression / keys) alone.\"\"\"\n    return len(p.keyframes()) > 0\n\n\ndef _put(p, value, expr):\n    if LINK_TO_PLAYBAR:\n        p.setExpression(expr, hou.exprLanguage.Hscript)\n    else:\n        p.set(value)\n\n\ndef apply_frame_range(nodes):\n    \"\"\"Set start-frame parms (solvers, DOP networks ...) and ROP / file cache\n    ranges on `nodes` and everything inside them to the scene's frame range.\"\"\"\n    fs, fe = scene_frame_range()\n    changed, skipped = [], []\n    for top in nodes:\n        for n in [top] + list(top.allSubChildren()):\n            if n.isInsideLockedHDA():\n                continue\n            for name in START_PARMS:\n                p = n.parm(name)\n                if p is None:\n                    continue\n                if _is_driven(p):\n                    skipped.append(p.path()); continue\n                _put(p, fs, \"$FSTART\"); changed.append(p.path())\n            f1, f2 = n.parm(\"f1\"), n.parm(\"f2\")\n            if f1 is not None and f2 is not None and n.parm(\"trange\") is not None:\n                for p, v, e in ((f1, fs, \"$FSTART\"), (f2, fe, \"$FEND\")):\n                    if _is_driven(p):\n                        skipped.append(p.path())\n                    else:\n                        _put(p, v, e); changed.append(p.path())\n    print(\"frame range %g-%g%s: set %d parm(s)%s\" % (\n        fs, fe, \" (linked to playbar)\" if LINK_TO_PLAYBAR else \"\", len(changed),\n        (\", left %d that already follow an expression\" % len(skipped)) if skipped else \"\"))\n    for c in changed:\n        print(\"   set\", c)\n    return changed\n\n\ndef current_network():\n    \"\"\"TARGET if set, else the network shown in the Network Editor.\"\"\"\n    if TARGET:\n        n = hou.node(TARGET)\n        if n is None:\n            raise hou.Error(\"TARGET not found: %s\" % TARGET)\n        return n\n    ne = hou.ui.paneTabOfType(hou.paneTabType.NetworkEditor) if hou.isUIAvailable() else None\n    if ne is None:\n        raise hou.Error(\"No Network Editor found - open one, or set TARGET.\")\n    return ne.pwd()\n\n\ndef sop_network(net):\n    \"\"\"A SOP network to build in: net itself, or a new geo when net is /obj-level.\"\"\"\n    cat = net.childTypeCategory().name()\n    if cat == \"Sop\":\n        return net\n    if cat == \"Object\":\n        return net.createNode(\"geo\", \"follow_demo\")\n    raise hou.Error(\"Open a Geometry (SOP) network or /obj - %s holds %s nodes.\" % (net.path(), cat))\n\n\ndef find(name, net):\n    \"\"\"Look a node up relative to the current network first, then as a full path.\"\"\"\n    if not name:\n        return None\n    n = net.node(name) or hou.node(name)\n    if n is None:\n        raise hou.Error(\"Node not found: %r (looked in %s and as a full path)\" % (name, net.path()))\n    return n\n\n\ndef build_demo(geo):\n    \"\"\"grid -> anim (rises, tiny) -> popnet (source + wind) in SOP network geo. Returns (sim, emitter).\"\"\"\n    ys = [c.position()[1] for c in geo.children()]\n    top = (min(ys) - 2) if ys else 0          # start below whatever is already there\n    grid = geo.createNode(\"grid\", \"demo_grid\")\n    anim = geo.createNode(\"xform\", \"demo_anim\")\n    anim.setInput(0, grid)\n    anim.parm(\"scale\").set(0.03)\n    ty = anim.parm(\"ty\")\n    fs, fe = scene_frame_range()\n    for fr, v in ((fs, 0.0), (fe, 3.3)):\n        k = hou.Keyframe(); k.setFrame(fr); k.setValue(v); k.setExpression(\"linear()\")\n        ty.setKeyframe(k)\n    dop = geo.createNode(\"dopnet\", \"demo_popnet\")\n    dop.setInput(0, anim)\n    dop.parm(\"objname1\").set(\"*\") if dop.parm(\"objname1\") else None\n    obj = dop.createNode(\"popobject\", \"popobject\")\n    src = dop.createNode(\"popsource\", \"source_first_input\")\n    src.parm(\"usecontextgeo\").set(2)          # first context geometry (the anim input)\n    src.parm(\"constantrate\").set(50)\n    wind = dop.createNode(\"popwind\", \"popwind1\")\n    wind.setInput(0, src)\n    wind.parm(\"windy\").set(1); wind.parm(\"amp\").set(1); wind.parm(\"swirlsize\").set(0.67)\n    merge = dop.createNode(\"merge\", \"wire_pops_into_here\")\n    merge.setInput(0, wind)\n    solver = dop.createNode(\"popsolver\", \"popsolver\")\n    solver.setInput(0, obj); solver.setInput(2, merge)\n    out = dop.createNode(\"output\", \"output\")\n    out.setInput(0, solver)\n    out.setDisplayFlag(True)\n    dop.layoutChildren()\n    grid.setPosition(hou.Vector2(0, top)); anim.setPosition(hou.Vector2(0, top - 1)); dop.setPosition(hou.Vector2(0, top - 2))\n    return dop, anim\n\n\nhere = current_network()\nif BUILD_DEMO:\n    sim, emitter = build_demo(sop_network(here))\n    apply_frame_range([sim])   # demo POP network starts at the scene's start frame\n    deform_src = None          # a scatter of the rest shape is built below\nelse:\n    sim = find(SIM_NODE, here) if SIM_NODE else (hou.selectedNodes() or [None])[0]\n    if sim is None:\n        raise hou.Error(\"Set SIM_NODE or select the sim node first.\")\n    emitter = find(EMITTER_NODE, here)\n    deform_src = find(DEFORM_NODE, here)\nnet = sim.parent()\nbase = sim.position()\n\n\ndef mk(type_name, name, dx, dy):\n    n = net.createNode(type_name, name)\n    n.setPosition(base + hou.Vector2(dx, dy))\n    return n\n\n\ndef add_float(node, name, label, default, lo, hi):\n    ptg = node.parmTemplateGroup()\n    ptg.append(hou.FloatParmTemplate(name, label, 1, default_value=(default,), min=lo, max=hi))\n    node.setParmTemplateGroup(ptg)\n\n\ndef add_int(node, name, label, default, lo, hi):\n    ptg = node.parmTemplateGroup()\n    ptg.append(hou.IntParmTemplate(name, label, 1, default_value=(default,), min=lo, max=hi))\n    node.setParmTemplateGroup(ptg)\n\n\n# 1) rest layout = sim held at REST_FRAME ------------------------------------\nrest = mk(\"timeshift\", \"follow_rest\", 3, -1)\nrest.setInput(0, sim)\nrest.parm(\"frame\").deleteAllKeyframes()   # default is a $F expression; clear it\nif REST_FRAME is None and LINK_TO_PLAYBAR:\n    rest.parm(\"frame\").setExpression(\"$FEND\", hou.exprLanguage.Hscript)\nelse:\n    rest.parm(\"frame\").set(REST_FRAME if REST_FRAME is not None else scene_frame_range()[1])\n\n# 2) per-frame info on the live sim: where the emitter is right now ----------\ninfo = mk(\"attribwrangle\", \"follow_sim_info\", 6, -1)\ninfo.setInput(0, sim)\nif emitter is not None:\n    info.setInput(1, emitter)\ninfo.parm(\"class\").set(0)  # detail\ninfo.parm(\"snippet\").set(r'''\n// anchor position: emitter centre if one is wired, else the live cloud centre\nv@emitpos = npoints(1) > 0 ? getbbox_center(1) : getbbox_center(0);\n''')\n\n# 3) mark which rest points exist in the live sim this frame -----------------\nmark = mk(\"attribwrangle\", \"follow_mark_born\", 3, -2.5)\nmark.setInput(0, rest)\nmark.setInput(1, sim)\nmark.parm(\"snippet\").set(r'''\nint src = idtopoint(1, i@id);\ni@born  = src >= 0;\ni@srcpt = src;\n''')\n\n# 4) live-only point cloud (rest-layout P) for fast neighbour search ---------\nborn = mk(\"attribwrangle\", \"follow_born_only\", 6, -3.5)\nborn.setInput(0, mark)\nborn.parm(\"snippet\").set('if (!i@born) removepoint(0, @ptnum);')   # no group parsing -> works in any version\n\n# 5) the follow itself --------------------------------------------------------\nfol = mk(\"attribwrangle\", \"follow_live\", 3, -5)\nfol.setInput(0, mark)\nfol.setInput(1, info)   # live sim P / age + detail emitpos\nfol.setInput(2, born)   # live-only cloud\nadd_float(fol, \"blend_time\", \"Blend Time (s)\", 0.5, 0, 5)\nadd_float(fol, \"radius\", \"Closest Radius\", 0.2, 0.001, 3)\nadd_float(fol, \"anchor_weight\", \"Emitter Anchor Weight\", 1.0, 0, 50)\nadd_int(fol, \"max_neighbours\", \"Max Neighbours\", 64, 8, 2048)   # 256 = smoother, 32 = faster\nadd_float(fol, \"rest_frame\", \"Rest Frame\", 1, 1, 1000)\nfol.parm(\"rest_frame\").setExpression('ch(\"../%s/frame\")' % rest.name())\nfol.parm(\"snippet\").set(r'''\n// Weighted CURRENT position of live neighbours; closest in the rest layout wins.\n// Gaussian weight (radius = Closest Radius) is \u003c 1e-4 beyond 3*radius, so only\n// that radius is searched: cost ~ N * neighbours, not N * N.\n// A newborn's vote fades in over Blend Time, so nothing jumps.\nfunction vector neighbourPos(vector rest; int selfid; float radius; float fade;\n                             float wa; int maxn; vector anchor) {\n    float h = max(radius, 1e-4);\n    int near[] = pcfind(2, \"P\", rest, 3 * h, maxn);\n    vector sum = 0; float wsum = 0;\n    foreach (int n; near) {\n        if (point(2, \"id\", n) == selfid) continue;\n        int s = point(2, \"srcpt\", n);\n        vector nRest = point(2, \"P\", n);\n        vector nNow  = point(1, \"P\", s);\n        float d = distance(rest, nRest) / h;\n        float w = exp(-d * d);\n        if (fade > 0) w *= smooth(0, 1, point(1, \"age\", s) / fade);\n        sum += nNow * w; wsum += w;\n    }\n    // emitter = constant-vote anchor: dominates while few particles are alive,\n    // gets outvoted naturally as the sim fills up (keeps early frames steady)\n    sum += anchor * wa; wsum += wa;\n    return wsum > 0 ? sum / wsum : rest;\n}\n\nfloat blend   = chf(\"blend_time\");\nvector anchor = detail(1, \"emitpos\");\nvector rest   = v@P;\nvector taken  = neighbourPos(rest, i@id, chf(\"radius\"), blend,\n                             chf(\"anchor_weight\"), chi(\"max_neighbours\"), anchor);\n\nif (i@born) {\n    // ease from the borrowed pose into the real sim so birth never pops ...\n    vector real = point(1, \"P\", i@srcpt);\n    float age = point(1, \"age\", i@srcpt);\n    float t = blend > 0 ? smooth(0, 1, age / blend) : 1;\n    // ... and be fully on the sim by the rest frame, so the deform matches rest\n    float restT = (chf(\"rest_frame\") - 1) * @TimeInc;   // time = (frame-1)/fps\n    if (blend > 0) t = max(t, smooth(restT - blend, restT, @Time));\n    v@P = lerp(taken, real, t);\n} else {\n    v@P = taken;\n}\n''')\n\nout = mk(\"null\", \"OUT_follow_live\", 3, -6.2)\nout.setInput(0, fol)\ncreated = [rest, info, mark, born, fol, out]\n\nif BUILD_DEMO:\n    con = mk(\"connectadjacentpieces\", \"demo_connect\", -3, -2.5)\n    con.setInput(0, rest)\n    con.parm(\"connecttype\").set(2); con.parm(\"maxsearchpoints\").set(28)\n    sc = mk(\"scatter\", \"demo_scatter\", -3, -3.7)\n    sc.setInput(0, con)\n    sc.parm(\"npts\").set(100000)\n    deform_src = mk(\"null\", \"demo_rest_geo\", -3, -4.9)\n    deform_src.setInput(0, sc)\n    created += [con, sc, deform_src]\n\n# 6) optional: Point Deform the rest geometry with the lattice ----------------\nif deform_src is not None:\n    pd = mk(\"pointdeform\", \"follow_pointdeform\", 0, -7.4)\n    pd.setInput(0, deform_src)\n    pd.setInput(1, rest)\n    pd.setInput(2, out)\n    out_d = mk(\"null\", \"OUT_follow_deform\", 0, -8.6)\n    out_d.setInput(0, pd)\n    out_d.setDisplayFlag(True)\n    out_d.setRenderFlag(True)\n    created += [pd, out_d]\nelse:\n    out.setDisplayFlag(True)\n    out.setRenderFlag(True)\n\nprint(\"rest frame: %g\" % rest.parm(\"frame\").eval())\nprint(\"follow rig built in %s: %s\" % (net.path(), \", \".join(n.name() for n in created)))\n", "visual": "rig-graph"}, {"id": "follow-live-vex", "title": "follow_live — closest live position", "lang": "vex", "context": "Attribute Wrangle · Points", "tested": "Houdini 21.0.671", "filename": "follow_live.vfl", "description": "หัวใจของ rig: ตำแหน่งปัจจุบันเฉลี่ยแบบ Gaussian ของพาร์ติเคิลที่มีชีวิตใกล้ๆ ในเลย์เอาต์ rest + emitter เป็นตัวถ่วงช่วงต้นซีน + blend เข้าซิมจริงหลังเกิด และบังคับให้ blend ครบภายในเฟรม rest", "notes": "Inputs: 0 = rest points ที่มี i@born, i@srcpt · 1 = live sim ที่มี detail v@emitpos · 2 = live-only cloud\nSpare parms ที่ต้องสร้าง: blend_time, radius, anchor_weight, max_neighbours (int), rest_frame\nอย่าใช้ ch(\"../node/parm\") ใน VEX เพื่ออ่านค่าจาก node อื่น เพราะ path จะหาไม่เจอแล้วได้ 0 ให้ link ผ่าน spare parm แทน", "code": "// Weighted CURRENT position of live neighbours; closest in the rest layout wins.\n// Gaussian weight (radius = Closest Radius) is \u003c 1e-4 beyond 3*radius, so only\n// that radius is searched: cost ~ N * neighbours, not N * N.\n// A newborn's vote fades in over Blend Time, so nothing jumps.\nfunction vector neighbourPos(vector rest; int selfid; float radius; float fade;\n                             float wa; int maxn; vector anchor) {\n    float h = max(radius, 1e-4);\n    int near[] = pcfind(2, \"P\", rest, 3 * h, maxn);\n    vector sum = 0; float wsum = 0;\n    foreach (int n; near) {\n        if (point(2, \"id\", n) == selfid) continue;\n        int s = point(2, \"srcpt\", n);\n        vector nRest = point(2, \"P\", n);\n        vector nNow  = point(1, \"P\", s);\n        float d = distance(rest, nRest) / h;\n        float w = exp(-d * d);\n        if (fade > 0) w *= smooth(0, 1, point(1, \"age\", s) / fade);\n        sum += nNow * w; wsum += w;\n    }\n    // emitter = constant-vote anchor: dominates while few particles are alive,\n    // gets outvoted naturally as the sim fills up (keeps early frames steady)\n    sum += anchor * wa; wsum += wa;\n    return wsum > 0 ? sum / wsum : rest;\n}\n\nfloat blend   = chf(\"blend_time\");\nvector anchor = detail(1, \"emitpos\");\nvector rest   = v@P;\nvector taken  = neighbourPos(rest, i@id, chf(\"radius\"), blend,\n                             chf(\"anchor_weight\"), chi(\"max_neighbours\"), anchor);\n\nif (i@born) {\n    // ease from the borrowed pose into the real sim so birth never pops ...\n    vector real = point(1, \"P\", i@srcpt);\n    float age = point(1, \"age\", i@srcpt);\n    float t = blend > 0 ? smooth(0, 1, age / blend) : 1;\n    // ... and be fully on the sim by the rest frame, so the deform matches rest\n    float restT = (chf(\"rest_frame\") - 1) * @TimeInc;   // time = (frame-1)/fps\n    if (blend > 0) t = max(t, smooth(restT - blend, restT, @Time));\n    v@P = lerp(taken, real, t);\n} else {\n    v@P = taken;\n}\n", "visual": "follow-concept"}, {"id": "mark-born-vex", "title": "mark_born — does this id exist yet?", "lang": "vex", "context": "Attribute Wrangle · Points", "tested": "Houdini 21.0.671", "filename": "mark_born.vfl", "description": "ต่อ input 0 = ท่า rest (timeshift ไปที่เฟรมสุดท้าย) และ input 1 = live sim แล้วจะเขียน i@born กับ i@srcpt (index ของพอยต์นั้นในซิมตอนนี้ ถ้ายังไม่เกิดจะเป็น -1)", "notes": "idtopoint() ต้องใช้ i@id ที่ไม่ซ้ำกัน ซึ่ง POP สร้างให้อยู่แล้ว", "code": "int src = idtopoint(1, i@id);\ni@born  = src >= 0;\ni@srcpt = src;\n", "visual": "born-mask"}, {"id": "born-only-vex", "title": "born_only — keep live points only", "lang": "vex", "context": "Attribute Wrangle · Points", "tested": "Houdini 21.0.671", "filename": "born_only.vfl", "description": "ลบพอยต์ที่ยังไม่เกิดทิ้ง ใช้แทน Blast @born==0 เพราะไม่ต้องพึ่งการอ่าน group จึงใช้ได้ทุกเวอร์ชัน", "notes": "", "code": "if (!i@born) removepoint(0, @ptnum);\n", "visual": "born-only"}, {"id": "patch-born-only", "title": "Patch: follow_born_only Blast → wrangle", "lang": "python", "context": "Python Shell", "tested": "Houdini 21.0.671 · current-network tests", "filename": "patch_born_v2.py", "description": "แก้ rig ที่สร้างไปแล้ว: หา Blast ชื่อ follow_born_only ใน network ที่ Network Editor เปิดอยู่ (รวมข้างใน) แล้วเปลี่ยนเป็น wrangle ที่ลบพอยต์ตรงๆ พร้อมต่อสายเดิมให้", "notes": "ใช้เมื่อขึ้นว่าหา attribute born ไม่เจอ (เดาว่า Blast ใน 20.5 อ่าน @born==0 เป็น prim group) · ตัว v2 ใช้ wrangle อยู่แล้ว ไม่ต้อง patch ซ้ำ", "code": "# ---- patch: replace follow_born_only (Blast) with a wrangle ----------------\n# Works on the network the Network Editor is showing (and everything inside it).\n# Set TARGET to a path to patch somewhere else.\nimport hou\n\nTARGET = \"\"   # \"\" = the network the Network Editor is showing\n\nif TARGET:\n    here = hou.node(TARGET)\nelse:\n    ne = hou.ui.paneTabOfType(hou.paneTabType.NetworkEditor) if hou.isUIAvailable() else None\n    here = ne.pwd() if ne else None\nif here is None:\n    raise hou.Error(\"Open the network with the rig in the Network Editor, or set TARGET.\")\n\nold = [n for n in [here] + list(here.allSubChildren())\n       if n.name() == \"follow_born_only\" and n.type().name() == \"blast\"]\nif not old:\n    raise hou.Error(\"No Blast called follow_born_only in %s - nothing to patch.\" % here.path())\nfor b in old:\n    net = b.parent()\n    src = b.inputs()[0]\n    w = net.createNode(\"attribwrangle\", \"follow_born_only_w\")\n    w.setPosition(b.position())\n    w.setInput(0, src)\n    w.parm(\"snippet\").set('if (!i@born) removepoint(0, @ptnum);')\n    for con in b.outputConnections():\n        con.outputNode().setInput(con.inputIndex(), w)\n    b.destroy()\n    w.setName(\"follow_born_only\")\n    print(\"patched\", w.path())\n", "visual": "patch-swap"}]}]}, {"id": "fxt-vectors-orient", "name": "2 vectors → matrix / orient", "category": "Math & orientation", "type": "Sop", "author": "Plug", "versions": [{"v": "v001", "date": "Aug 30 2025", "notes": "จาก FX Template เดิม (Convert_2 Vectors_to_Mat_2_Vectors_to_Orient · Aug 30 2025 20:02:32)\nNote เดิม: Convert \n2 Vectors to Mat\n2 Vectors to Orient", "previewImage": "307d4716c2428011e4db44346a2c3c1e", "previewVisual": "", "files": [{"id": "fxt-vectors-orient-rebuild", "title": "Rebuild network (Sop)", "lang": "python", "context": "Python Shell · open a Sop network first", "tested": "Houdini 21.0.671 · reb Start-frame parms (solvers, DOP networks) and ROP / file-cache ranges are set\n# to the scene's current frame range; parms that already use an expression stay.\n# ============================================================================\nimport hou\n\nTARGET = \"\"   # e.g. \"/obj/geo1\" ; \"\" = the network the Network Editor is showing\n\nif TARGET:\n    hou_parent = hou.node(TARGET)\nelse:\n    _ne = hou.ui.paneTabOfType(hou.paneTabType.NetworkEditor)\n    hou_parent = _ne.pwd() if _ne else None\nif hou_parent is None:\n    raise hou.Error(\"Open a Sop network in the Network Editor, or set TARGET.\")\nif hou_parent.childTypeCategory().name() != \"Sop\":\n    raise hou.Error(\"This template needs a Sop network, but %s holds %s nodes.\"\n                    % (hou_parent.path(), hou_parent.childTypeCategory().name()))\n\n# ---- frame range: use the scene's current start / end frame -----------------\nSTART_FRAME     = None   # None = the playbar's start frame right now\nEND_FRAME       = None   # None = the playbar's end frame right now\nLINK_TO_PLAYBAR = False  # True = write $FSTART / $FEND expressions instead of numbers\n\nSTART_PARMS = (\"startframe\", \"start_frame\", \"startFrame\", \"sim_start\", \"simstart\")\n\n\ndef scene_frame_range():\n    fs, fe = hou.playbar.frameRange()\n    return (float(START_FRAME) if START_FRAME is not None else fs,\n            float(END_FRAME) if END_FRAME is not None else fe)\n\n\ndef _is_driven(p):\n    \"\"\"Leave parms that already follow something (expression / keys) alone.\"\"\"\n    return len(p.keyframes()) > 0\n\n\ndef _put(p, value, expr):\n    if LINK_TO_PLAYBAR:\n        p.setExpression(expr, hou.exprLanguage.Hscript)\n    else:\n        p.set(value)\n\n\ndef apply_frame_range(nodes):\n    \"\"\"Set start-frame parms (solvers, DOP networks ...) and ROP / file cache\n    ranges on `nodes` and everything inside them to the scene's frame range.\"\"\"\n    fs, fe = scene_frame_range()\n    changed, skipped = [], []\n
