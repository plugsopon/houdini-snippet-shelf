 { border:0; background:transparent; }\nQSplitter::handle { background:#22282E; }\n\"\"\"\n\n\ndef load_data(blob):\n    return json.loads(zlib.decompress(base64.b64decode(blob)).decode(\"utf8\"))\n\n\ndef pixmap_from_b64(b64):\n    pm = QtGui.QPixmap()\n    pm.loadFromData(base64.b64decode(b64))\n    return pm\n\n\ndef placeholder(tech, w, h):\n    \"\"\"Card art for a technique without a screenshot: its type colour + name.\"\"\"\n    pm = QtGui.QPixmap(w, h)\n    pm.fill(QtGui.QColor(\"#15191D\"))\n    p = QtGui.QPainter(pm)\n    p.setRenderHint(QtGui.QPainter.Antialiasing)\n    col = QtGui.QColor(TYPE_COLOR.get(tech.get(\"type\"), \"#7E8A96\"))\n    grad = QtGui.QLinearGradient(0, 0, w, h)\n    c1 = QtGui.QColor(col); c1.setAlpha(90)\n    c2 = QtGui.QColor(col); c2.setAlpha(10)\n    grad.setColorAt(0, c1); grad.setColorAt(1, c2)\n    p.fillRect(0, 0, w, h, grad)\n    dot = QtGui.QColor(\"#FFFFFF\"); dot.setAlpha(22)\n    for x in range(8, w, 14):\n        for y in range(8, h, 14):\n            p.fillRect(x, y, 1, 1, dot)\n    p.setPen(QtGui.QColor(\"#FFFFFF\"))\n    f = p.font(); f.setPointSize(max(9, int(h / 9))); f.setBold(True); p.setFont(f)\n    p.drawText(QtCore.QRect(0, 0, w, h), QtCore.Qt.AlignCenter, TYPE_TAG.get(tech.get(\"type\"), \"FX\"))\n    p.end()\n    return pm\n\n\ndef current_network():\n    ne = hou.ui.paneTabOfType(hou.paneTabType.NetworkEditor) if hou.isUIAvailable() else None\n    return ne.pwd() if ne else None\n\n\nclass ShelfPane(QtWidgets.QWidget):\n    CARD_W, CARD_H = 168, 150\n\n    def __init__(self, data, parent=None):\n        super(ShelfPane, self).__init__(parent)\n        self.setObjectName(\"shelfRoot\")\n        self.setStyleSheet(STYLE)\n        self.data = data\n        self.techs = data[\"techniques\"]\n        self.images = data.get(\"images\", {})\n        self.ver_choice = {}\n        self.cur = None\n\n        root = QtWidgets.QHBoxLayout(self); root.setContentsMargins(0, 0, 0, 0); root.setSpacing(0)\n        split = QtWidgets.QSplitter(QtCore.Qt.Horizontal); root.addWidget(split)\n\n        # column A - categories\n        self.cats = QtWidgets.QListWidget(); self.cats.setObjectName(\"cats\")\n        self.cats.setMinimumWidth(200); self.cats.setMaximumWidth(260)\n        self.cats.setHorizontalScrollBarPolicy(QtCore.Qt.ScrollBarAlwaysOff)\n        self.cats.setTextElideMode(QtCore.Qt.ElideRight)\n        split.addWidget(self.cats)\n\n        # column B - search + card grid\n        mid = QtWidgets.QWidget(); ml = QtWidgets.QVBoxLayout(mid); ml.setContentsMargins(12, 12, 12, 12); ml.setSpacing(10)\n        top = QtWidgets.QHBoxLayout()\n        self.search = QtWidgets.QLineEdit(); self.search.setPlaceholderText(\"Search name, notes, code...\")\n        self.count = QtWidgets.QLabel(); self.count.setObjectName(\"muted\")\n        top.addWidget(self.search, 1); top.addWidget(self.count)\n        ml.addLayout(top)\n        self.grid = QtWidgets.QListWidget(); self.grid.setObjectName(\"grid\")\n        self.grid.setViewMode(QtWidgets.QListView.IconMode)\n        self.grid.setIconSize(QtCore.QSize(self.CARD_W, self.CARD_H - 40))\n        self.grid.setGridSize(QtCore.QSize(self.CARD_W + 16, self.CARD_H + 16))\n        self.grid.setResizeMode(QtWidgets.QListView.Adjust)\n        self.grid.setMovement(QtWidgets.QListView.Static)\n        self.grid.setWordWrap(True); self.grid.setSpacing(6)\n        ml.addWidget(self.grid, 1)\n        split.addWidget(mid)\n\n        # column C - detail\n        det = QtWidgets.QWidget(); det.setObjectName(\"detail\")\n        scroll = QtWidgets.QScrollArea(); scroll.setWidgetResizable(True); scroll.setWidget(det)\n        scroll.setHorizontalScrollBarPolicy(QtCore.Qt.ScrollBarAlwaysOff)\n        self.scroll = scroll\n        scroll.setMinimumWidth(340)\n        dl = QtWidgets.QVBoxLayout(det); dl.setContentsMargins(16, 16, 16, 16); dl.setSpacing(10)\n        self.preview = QtWidgets.QLabel(); self.preview.setAlignment(QtCore.Qt.AlignCenter)\n        self.preview.setFixedHeight(200); self.preview.setMinimumWidth(1); self.preview.setStyleSheet(\"background:#05070A;border:1px solid #22282E;border-radius:10px;\")\n        self.title = QtWidgets.QLabel(); self.title.setObjectName(\"title\"); self.title.setWordWrap(True)\n        self.title.setSizePolicy(QtWidgets.QSizePolicy.Ignored, QtWidgets.QSizePolicy.Preferred)\n        row = QtWidgets.QHBoxLayout()\n        self.meta = QtWidgets.QLabel(); self.meta.setObjectName(\"meta\"); self.meta.setWordWrap(True)\n        self.meta.setSizePolicy(QtWidgets.QSizePolicy.Ignored, QtWidgets.QSizePolicy.Preferred)\n        self.ver = QtWidgets.QComboBox(); self.ver.setMinimumWidth(80)\n        row.addWidget(self.meta, 1); row.addWidget(self.ver)\n        self.notes = QtWidgets.QLabel(); self.notes.setObjectName(\"notes\"); self.notes.setWordWrap(True)\n        self.notes.setSizePolicy(QtWidgets.QSizePolicy.Ignored, QtWidgets.QSizePolicy.Preferred)\n        self.notes.setTextInteractionFlags(QtCore.Qt.TextSelectableByMouse)\n        flab = QtWidgets.QLabel(\"Files\"); flab.setObjectName(\"muted\")\n        self.files = QtWidgets.QListWidget(); self.files.setObjectName(\"files\"); self.files.setMaximumHeight(130)\n        self.fdesc = QtWidgets.QLabel(); self.fdesc.setObjectName(\"muted\"); self.fdesc.setWordWrap(True)\n        self.fdesc.setSizePolicy(QtWidgets.QSizePolicy.Ignored, QtWidgets.QSizePolicy.Preferred)\n        self.code = QtWidgets.QPlainTextEdit(); self.code.setReadOnly(True)\n        self.code.setLineWrapMode(QtWidgets.QPlainTextEdit.NoWrap); self.code.setMinimumHeight(200)\n        btns = QtWidgets.QHBoxLayout()\n        self.b_install = QtWidgets.QPushButton(\"Install\"); self.b_install.setObjectName(\"primary\")\n        self.b_copy = QtWidgets.QPushButton(\"Copy\")\n        btns.addWidget(self.b_install, 1); btns.addWidget(self.b_copy)\n        self.status = QtWidgets.QLabel(); self.status.setObjectName(\"muted\"); self.status.setWordWrap(True)\n        for w in (self.preview, self.title): dl.addWidget(w)\n        dl.addLayout(row)\n        for w in (self.notes, flab, self.files, self.fdesc, self.code): dl.addWidget(w)\n        dl.addLayout(btns); dl.addWidget(self.status); dl.addStretch(1)\n        split.addWidget(scroll)\n        split.setStretchFactor(0, 0); split.setStretchFactor(1, 1); split.setStretchFactor(2, 0)\n        split.setSizes([210, 520, 400])\n\n        self.cats.currentRowChanged.connect(self.fill_grid)\n        self.search.textChanged.connect(lambda _: self.fill_grid())\n        self.grid.currentItemChanged.connect(self.pick_card)\n        self.ver.currentIndexChanged.connect(self.pick_version)\n        self.files.currentRowChanged.connect(self.pick_file)\n        self.b_install.clicked.connect(self.install)\n        self.b_copy.clicked.connect(self.copy)\n\n        self.fill_cats()\n\n    # ---------- helpers ----------\n    def version(self, t):\n        want = self.ver_choice.get(t[\"id\"])\n        for v in t[\"versions\"]:\n            if v[\"v\"] == want:\n                return v\n        return t[\"versions\"][-1]\n\n    def matches(self, t):\n        q = self.search.text().strip().lower()\n        if not q:\n            return True\n        hay = [t[\"name\"], t.get(\"category\", \"\"), t.get(\"type\", \"\")]\n        for v in t[\"versions\"]:\n            hay.append(v.get(\"notes\", \"\"))\n            for f in v[\"files\"]:\n                hay += [f.get(\"title\", \"\"), f.get(\"description\", \"\"), f.get(\"code\", \"\")]\n        return q in \"\\n\".join(hay).lower()\n\n    def card_pixmap(self, t, w, h):\n        v = self.version(t)\n        img = v.get(\"previewImage\")\n        if img and img in self.images:\n            pm = pixmap_from_b64(self.images[img])\n            if not pm.isNull():\n                return pm.scaled(w, h, QtCore.Qt.KeepAspectRatioByExpanding, QtCore.Qt.SmoothTransformation).copy(0, 0, w, h)\n        return placeholder(t, w, h)\n\n    # ---------- columns ----------\n    def fill_cats(self):\n        cats = {}\n        for t in self.techs:\n            cats.setdefault(t.get(\"category\") or \"Uncategorised\", 0)\n            cats[t.get(\"category\") or \"Uncategorised\"] += 1\n        self.cats.clear()\n        self.cats.addItem(\"All  (%d)\" % len(self.techs))\n        self.cat_keys = [None]\n        for k in sorted(cats):\n            self.cats.addItem(\"%s  (%d)\" % (k, cats[k])); self.cat_keys.append(k)\n        self.cats.setCurrentRow(0)\n\n    def fill_grid(self, *_):\n        key = self.cat_keys[self.cats.currentRow()] if self.cats.currentRow() >= 0 else None\n        self.grid.blockSignals(True); self.grid.clear()\n        shown = [t for t in self.techs if (key is None or (t.get(\"category\") or \"Uncategorised\") == key) and self.matches(t)]\n        for t in shown:\n            it = QtWidgets.QListWidgetItem(QtGui.QIcon(self.card_pixmap(t, self.CARD_W, self.CARD_H - 40)),\n                                           \"%s\\n%s  %s\" % (t[\"name\"], t.get(\"type\", \"\"), self.version(t)[\"v\"]))\n            it.setData(QtCore.Qt.UserRole, t[\"id\"])\n            it.setToolTip(t[\"name\"])\n            self.grid.addItem(it)\n        self.grid.blockSignals(False)\n        self.count.setText(\"%d of %d\" % (len(shown), len(self.techs)))\n        if shown:\n            keep = [i for i in range(self.grid.count()) if self.grid.item(i).data(QtCore.Qt.UserRole) == (self.cur or {}).get(\"id\")]\n            self.grid.setCurrentRow(keep[0] if keep else 0)\n        else:\n            self.show_tech(None)\n\n    def pick_card(self, item, _prev=None):\n        if item is None:\n            return\n        tid = item.data(QtCore.Qt.UserRole)\n        self.show_tech(next(t for t in self.techs if t[\"id\"] == tid))\n\n    def show_tech(self, t):\n        self.cur = t\n        if t is None:\n            self.title.setText(\"Nothing matches\"); self.meta.setText(\"\"); self.notes.setText(\"\")\n            self.files.clear(); self.code.setPlainText(\"\"); self.preview.clear(); return\n        self.title.setText(t[\"name\"])\n        self.ver.blockSignals(True); self.ver.clear()\n        for v in t[\"versions\"]:\n            self.ver.addItem(v[\"v\"])\n        self.ver.setCurrentText(self.version(t)[\"v\"]); self.ver.blockSignals(False)\n        self.show_version()\n\n    def pick_version(self, _i):\n        if self.cur:\n            self.ver_choice[self.cur[\"id\"]] = self.ver.currentText()\n            self.show_version()\n\n    def show_version(self):\n        t = self.cur; v = self.version(t)\n        self.meta.setText(\"%s, %s, %s of %d%s\" % (t.get(\"category\", \"\"), t.get(\"type\", \"\"), v[\"v\"], len(t[\"versions\"]),\n                                                   (\", \" + v[\"date\"]) if v.get(\"date\") else \"\"))\n        self.notes.setText(v.get(\"notes\", \"\"))\n        self.fit_preview()\n        self.files.blockSignals(True); self.files.clear()\n        for f in v[\"files\"]:\n            self.files.addItem(\"%s    %s\" % (f.get(\"filename\") or f.get(\"title\"), \"Python\" if f[\"lang\"] == \"python\" else \"VEX\"))\n        self.files.blockSignals(False)\n        self.files.setCurrentRow(0 if v[\"files\"] else -1)\n        if not v[\"files\"]:\n            self.pick_file(-1)\n\n    def fit_preview(self):\n        \"\"\"Scale the preview to the detail column's width (never wider).\"\"\"\n        if not self.cur:\n            return\n        w = max(120, self.scroll.viewport().width() - 34)\n        h = self.preview.height() - 4\n        v = self.version(self.cur); img = v.get(\"previewImage\")\n        if img and img in self.images:\n            pm = pixmap_from_b64(self.images[img]).scaled(w, h, QtCore.Qt.KeepAspectRatio, QtCore.Qt.SmoothTransformation)\n        else:\n            pm = placeholder(self.cur, w, h)\n        self.preview.setPixmap(pm)\n\n    def resizeEvent(self, e):\n        super(ShelfPane, self).resizeEvent(e)\n        self.fit_preview()\n\n    def cur_file(self):\n        if not self.cur:\n            return None\n        v = self.version(self.cur); r = self.files.currentRow()\n        return v[\"files\"][r] if 0 \u003c= r \u003c len(v[\"files\"]) else None\n\n    def pick_file(self, _r):\n        f = self.cur_file()\n        self.code.setPlainText(f[\"code\"] if f else \"\")\n        self.fdesc.setText(((f.get(\"description\") or \"\") + (\"\\nPaste into: \" + f[\"context\"] if f and f.get(\"context\") else \"\")) if f else \"\")\n        self.b_install.setEnabled(bool(f)); self.b_copy.setEnabled(bool(f))\n        if f:\n            self.b_install.setText(\"Install\" if f[\"lang\"] == \"python\" else \"Create wrangle\")\n        self.status.setText(\"\")\n\n    # ---------- actions ----------\n    def copy(self):\n        f = self.cur_file()\n        if f:\n            QtWidgets.QApplication.clipboard().setText(f[\"code\"])\n            self.status.setText(\"Copied %s.\" % (f.get(\"filename\") or f.get(\"title\")))\n\n    def install(self):\n        f = self.cur_file()\n        if not f:\n            return\n        net = current_network()\n        try:\n            with hou.undos.group(\"Snippet Shelf: \" + (f.get(\"filename\") or f.get(\"title\"))):\n                if f[\"lang\"] == \"python\":\n                    exec(compile(f[\"code\"], f.get(\"filename\") or \"\u003cshelf>\", \"exec\"), {\"hou\": hou, \"__name__\": \"__main__\"})\n                    self.status.setText(\"Installed %s into %s.\" % (f.get(\"filename\"), net.path() if net else \"the scene\"))\n                else:\n                    if net is None or net.childTypeCategory().name() != \"Sop\":\n                        raise hou.Error(\"Open a Geometry (SOP) network in the Network Editor first.\")\n                    name = re.sub(r\"[^A-Za-z0-9_]\", \"_\", (f.get(\"filename\") or \"snippet\").rsplit(\".\", 1)[0]) or \"snippet\"\n                    w = net.createNode(\"attribwrangle\", name)\n                    w.parm(\"snippet\").set(f[\"code\"])\n                    w.moveToGoodPosition(); w.setSelected(True, clear_all_selected=True)\n                    self.status.setText(\"Created %s with the VEX in it.\" % w.path())\n        except Exception as e:\n            self.status.setText(\"Could not install: %s\" % str(e).splitlines()[0] if str(e) else repr(e))\n\n\ndef onCreateInterface():\n    return ShelfPane(load_data(__SHELF_DATA__))\n'''\n\n\ndef _panel_source():\n    return PANEL_CODE.replace(\"__SHELF_DATA__\", repr(SHELF_DATA))\n\n\ndef open_snippet_shelf():\n    xml = ('\u003c?xml version=\"1.0\" encoding=\"UTF-8\"?>\\n\u003cpythonPanelDocument>\\n'\n           '  \u003cinterface name=\"snippet_shelf\" label=\"Snippet Shelf\" icon=\"MISC_python\" showNetworkNavigationBar=\"false\" help_url=\"\">\\n'\n           '    \u003cscript>\u003c![CDATA[' + _panel_source() + ']]>\u003c/script>\\n'\n           '    \u003cincludeInPaneTabMenu menu_position=\"0\" create_separator=\"false\"/>\\n'\n           '    \u003cincludeInToolbarMenu menu_position=\"0\" create_separator=\"false\"/>\\n'\n           '  \u003c/interface>\\n\u003c/pythonPanelDocument>\\n')\n    try:\n        import os\n        folder = os.path.join(hou.homeHoudiniDirectory(), \"python_panels\")\n        if not os.path.isdir(folder):\n            os.makedirs(folder)\n        path = os.path.join(folder, \"snippet_shelf.pypanel\")\n        with open(path, \"w\", encoding=\"utf8\") as fh:\n            fh.write(xml)\n        hou.pypanel.installFile(path)\n        iface = hou.pypanel.interfaceByName(\"snippet_shelf\")\n        tab = hou.ui.curDesktop().createFloatingPaneTab(hou.paneTabType.PythonPanel, size=(1180, 720))\n        tab.setActiveInterface(iface)\n        print(\"Snippet Shelf pane opened (registered from %s).\" % path)\n        return tab\n    except Exception as e:\n        print(\"Python Panel not available (%s); opening a floating window instead.\" % e)\n        ns = {\"__name__\": \"snippet_shelf_panel\"}\n        exec(_panel_source(), ns)\n        from hutil.Qt import QtCore\n        w = ns[\"onCreateInterface\"]()\n        w.setParent(hou.qt.mainWindow(), QtCore.Qt.Window)\n        w.setWindowTitle(\"Snippet Shelf\")\n        w.resize(1180, 720); w.show()\n        hou.session.snippet_shelf_window = w  # keep a reference so it is not garbage collected\n        return w\n\n\nopen_snippet_shelf()\n", "visual": ""}]}]}]}</script>

  function network(nodes, wires, vw, vh){
    var W=170,H=40, byId={};
    nodes.forEach(function(n){ byId[n.id]=n; });
    function inPort(n,i){ var k=n.ins||1; return [n.x+W*(i+1)/(k+1), n.y]; }
    function outPort(n){ return [n.x+W/2, n.y+H]; }
    var g = wires.map(function(w){
      var a=outPort(byId[w[0]]), b=inPort(byId[w[1]], w[2]||0), dy=Math.max(30,(b[1]-a[1])*0.5);
      return '<path class="wire" d="M'+a[0]+' '+a[1]+' C'+a[0]+' '+(a[1]+dy)+' '+b[0]+' '+(b[1]-dy)+' '+b[0]+' '+b[1]+'"/>';
    }).join("");
    g += nodes.map(function(n){
      var ports='', k=n.ins||0;
      for (var i=0;i<k;i++){ var p=inPort(n,i); ports+='<circle class="port" cx="'+p[0]+'" cy="'+p[1]+'" r="3.5"/>'; }
      var o=outPort(n);
      return '<g class="node '+(n.cls||"")+'"><rect x="'+n.x+'" y="'+n.y+'" width="'+W+'" height="'+H+'" rx="5"/>'+
        '<rect class="flag" x="'+n.x+'" y="'+n.y+'" width="5" height="'+H+'" rx="2"/>'+
        '<text x="'+(n.x+14)+'" y="'+(n.y+17)+'" font-size="12.5" font-weight="500">'+esc(n.name)+'</text>'+
        '<text class="sub" x="'+(n.x+14)+'" y="'+(n.y+31)+'">'+esc(n.sub||"")+'</text>'+
        ports+'<circle class="port" cx="'+o[0]+'" cy="'+o[1]+'" r="3.5"/></g>';
    }).join("");
    return '<svg viewBox="0 0 '+vw+' '+vh+'" role="img" aria-label="Node network">'+g+'</svg>';
  }
  var VISUALS = {

      var nodes=[
        {id:"sim",  x:20,  y:14,  name:"SIM_NODE", sub:"live particles, every frame", cls:"io"},
        {id:"emit", x:300, y:14,  name:"EMITTER_NODE", sub:"optional, same space", cls:"io"},
        {id:"geo",  x:590, y:14,  name:"DEFORM_NODE", sub:"geometry in rest pose", cls:"io"},
        {id:"rest", x:20,  y:104, name:"follow_rest", sub:"timeshift → REST_FRAME", ins:1},

      ];
      var wires=[["sim","rest",0],["sim","info",0],["emit","info",1],["rest","mark",0],["sim","mark",1],
        ["mark","only",0],["mark","fol",0],["info","fol",1],["only","fol",2],["fol","out",0],
        ["geo","pd",0],["rest","pd",1],["out","pd",2],["pd","outd",0]];
      return fig(network(nodes,wires,780,570),
        'สิ่งที่สคริปต์สร้าง: node สีฟ้าคือของที่พี่ชี้ path ใน CONFIG ส่วน node สีส้มคือตัวที่ทำงานหลักและตัวที่ต้องดูผล, inputs อยู่ขอบบน output อยู่ขอบล่าง แบบ Houdini');

    if (!assetsApi) return;
    readForm();
    var st = $("edStatus"); st.className="status"; st.textContent="Uploading image…";
    assetsApi.upload(file).then(function(r){
      state.draft.ver.previewImage = r.id; renderEditor(); $("edStatus").textContent="Image attached — press Save to keep it.";
    }, function(err){
      var c = err && err.code;
      st.className="status err";
      st.textContent = c==="too_large" ? "Image is over 20 MB — use a smaller screenshot." : c==="unsupported_type" ? "Use a PNG, JPEG, WebP or GIF image." : "Upload failed ("+(c||"error")+").";
    });
  }
  function commitDraft(){
    readForm();
    var d = state.draft, st = $("edStatus");
    if (!d.tech.name){ st.className="status err"; st.textContent="Give the technique a name."; $("t-name").focus(); return; }
    d.ver.files = d.ver.files.map(function(f){ f.code = String(f.code||"").replace(/\s+$/,"") + "\n"; return f; });
    var next = clone(DB);
    var existing = next.techniques.find(function(x){return x.id===d.tech.id;});
    if (!existing){ d.tech.versions = [d.ver]; next.techniques.push(d.tech); }
    else {
      existing.name=d.tech.name; existing.category=d.tech.category; existing.type=d.tech.type; existing.author=d.tech.author;
      var i = existing.versions.findIndex(function(x){return x.v===d.ver.v;});
      if (i>=0) existing.versions[i]=d.ver; else existing.versions.push(d.ver);
    }
    save(next, d.tech.id, st, $("saveBtn"));
  }

  // ---------------- save (republish the whole page from data) ----------------
  function buildDoc(next){
    var json = JSON.stringify(next).replace(/</g,"\\u003c");
    var start = PRISTINE.indexOf('<script id="lib-data" type="application/json">');
    var open = PRISTINE.indexOf(">", start) + 1;
    var close = PRISTINE.indexOf("<\/script>", open);
    return PRISTINE.slice(0, open) + json + PRISTINE.slice(close);
  }
  function save(next, tid, statusEl, btn){
    if (!artifactApi) return;
    if (btn) btn.disabled = true;
    if (statusEl){ statusEl.className="status"; statusEl.textContent="Saving…"; }
    try { history.replaceState(null,"", tid ? "#"+tid : location.pathname); } catch(e){}
    artifactApi.publish(buildDoc(next)).then(function(){
      if (statusEl) statusEl.textContent = "Saved.";
    }, function(err){
      if (btn) btn.disabled = false;
      var code = err && err.code;
      var msg = code==="conflict" ? "A newer version was saved elsewhere — the page is reloading to it; redo this edit."
        : (code==="not_writer"||code==="not_granted") ? "You can view this shelf but not edit it."
        : "Could not save ("+(code||"error")+"). Try again.";
      if (statusEl){ statusEl.className="status err"; statusEl.textContent=msg; }
    });
  }



  function render(){
    var editing = state.mode==="edit" && state.draft;
    $("app").hidden = !!editing; $("main").hidden = !editing;
    $("q").disabled = !!editing;
    if (editing) renderEditor(); else { renderCats(); renderCards(); renderPanel(); }
  }

  // ---------------- events ----------------
  document.addEventListener("click", function(e){
    var b = e.target.closest("button"); if (!b) return;
    if (b.dataset.cat!=null && b.classList.contains("cat")){ state.cat=b.dataset.cat||null; render(); return; }
    if (b.id==="viewCards" || b.id==="viewGraph"){ state.view = b.id==="viewGraph" ? "graph" : "cards"; try{ localStorage.setItem("shelf.view", state.view); }catch(x){} renderCards(); return; }
    if (b.dataset.pick){ state.tid=b.dataset.pick; state.mode="view"; state.confirm=false; state.fid=null; try{history.replaceState(null,"","#"+state.tid);}catch(x){} render(); return; }
    if (b.dataset.ver && b.dataset.tid){ state.ver[b.dataset.tid]=b.dataset.ver; state.confirm=false; state.fid=null; render(); return; }
    if (b.dataset.file){ state.fid=b.dataset.file; renderPanel(); return; }
    if (b.dataset.rmfile!=null){ readForm(); state.draft.ver.files.splice(+b.dataset.rmfile,1); renderEditor(); return; }
    switch (b.id){
      case "copyBtn":
        var t=tech(state.tid), f=verOf(t).files.find(function(x){return x.id===state.fid;});
        var ok=function(){ b.textContent="Copied"; b.classList.add("done"); setTimeout(function(){ b.textContent="Copy code"; b.classList.remove("done"); },1600); };
        var fallback=function(){ var r=document.createRange(); r.selectNodeContents($("codeEl")); var s=getSelection(); s.removeAllRanges(); s.addRange(r); b.textContent="Selected, press Ctrl+C"; };
        try { navigator.clipboard.writeText(f.code).then(ok, fallback); } catch(x){ fallback(); }
        break;
      case "newTech": openEditor("new"); render(); break;
      case "editBtn": openEditor("edit"); render(); break;
      case "newVerBtn": openEditor("newver"); render(); break;
      case "addFile": readForm(); state.draft.ver.files.push(blankFile()); renderEditor(); break;
      case "rmImg": readForm(); state.draft.ver.previewImage=""; renderEditor(); break;
      case "cancelBtn": state.mode="view"; state.draft=null; render(); break;
      case "delBtn": state.confirm=true; renderPanel(); break;
      case "delNo": state.confirm=false; renderPanel(); break;
      case "delYes":
        var tt=tech(state.tid), vv=verOf(tt), next=clone(DB), nt=next.techniques.find(function(x){return x.id===tt.id;});
        if (nt.versions.length>1) nt.versions = nt.versions.filter(function(x){return x.v!==vv.v;});
        else next.techniques = next.techniques.filter(function(x){return x.id!==tt.id;});
        b.disabled=true; b.textContent="Deleting…";
        save(next, next.techniques.some(function(x){return x.id===tt.id;}) ? tt.id : "", null, b);
        break;
    }
  });
  document.addEventListener("paste", function(e){
    if (state.mode!=="edit" || !assetsApi) return;
    var items = (e.clipboardData && e.clipboardData.items) || [];
    for (var i=0;i<items.length;i++){ if (items[i].type.indexOf("image/")===0){ var file=items[i].getAsFile(); if (file){ e.preventDefault(); uploadPreview(file); return; } } }
  });
  $("q").addEventListener("input", function(e){ state.q=e.target.value; renderCards(); });

  render();

  if (window.claude && window.claude.use){
    window.claude.use("artifact").then(function(api){
      if (!api) return;
      artifactApi = api; $("newTech").hidden = false;
      if (state.mode==="view") renderPanel();
    }, function(){});
    window.claude.use("assets").then(function(api){ assetsApi = api || null; if (state.mode==="edit" && $("edForm")) { readForm(); renderEditor(); } }, function(){});
  }
})();
</script>
