  var TYPE_TAG = {Sop:"SOP", Dop:"DOP", Object:"OBJ", Lop:"LOP", Cop:"COP", Vop:"VOP", Top:"TOP", Shelf:"SHF", Other:"—"};
  var LANG_LABEL = {python:"Python", vex:"VEX"};
  var artifactApi = null, assetsApi = null;
  var $ = function(id){ return document.getElementById(id); };
  var esc = function(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];}); };
  var clone = function(o){ return JSON.parse(JSON.stringify(o)); };
  var today = function(){ var d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
  var uid = function(p){ return p + Date.now().toString(36) + Math.floor(Math.random()*1e4).toString(36); };

  var state = { q:"", tid:null, ver:{}, fid:null, mode:"view", draft:null, confirm:false, cat:null };
  try { var h=(location.hash||"").slice(1); if (h) state.tid=h; } catch(e){}
  if (!tech(state.tid)) state.tid = DB.techniques.length ? DB.techniques[0].id : null;

  function tech(id){ return DB.techniques.find(function(t){return t.id===id;}); }
  function lastVer(t){ return t.versions[t.versions.length-1]; }
  function verOf(t){ var v=state.ver[t.id]; return t.versions.find(function(x){return x.v===v;}) || lastVer(t); }
  function nextV(t){ var n=0; t.versions.forEach(function(x){ var k=parseInt(String(x.v).replace(/\D/g,""),10); if(k>n)n=k; }); return "v"+String(n+1).padStart(3,"0"); }
  function catOf(t){ return t.category || "Uncategorised"; }
  function matches(t){

  // =====================================================================
  // Pane layout: a binary tree (like Houdini / the Dremzo Operator).
  //   leaf  {id, t:"leaf", kind}
  //   split {id, t:"split", dir:"row"|"col", ratio, a, b}
  // Kept per viewer in localStorage; "Reset layout" restores the default.
  // =====================================================================
  var KINDS = [
    {kind:"categories", label:"Categories"}, {kind:"cards", label:"Techniques"}, {kind:"network", label:"Network View"},
    {kind:"parameters", label:"Parameters"}, {kind:"preview", label:"Preview"}, {kind:"notes", label:"Notes"}, {kind:"code", label:"Code"}
  ];
  var LAYOUT_KEY = "shelf.layout.v1";
  var nid = 0; function pid(){ return "p" + (++nid) + Math.floor(Math.random()*1e4).toString(36); }
  function leaf(kind){ return {id:pid(), t:"leaf", kind:kind}; }
  function split(dir, ratio, a, b){ return {id:pid(), t:"split", dir:dir, ratio:ratio, a:a, b:b}; }
  function defaultLayout(){
    return split("row", .17, leaf("categories"),
      split("row", .52, split("col", .6, leaf("cards"), leaf("network")),
        split("col", .36, leaf("preview"), split("col", .45, leaf("parameters"), leaf("code")))));
  }
  function validTree(n){ return n && (n.t==="leaf" ? KINDS.some(function(k){return k.kind===n.kind;}) : (n.t==="split" && validTree(n.a) && validTree(n.b))); }
  var tree = null;
  try { var saved = JSON.parse(localStorage.getItem(LAYOUT_KEY) || "null"); if (validTree(saved)) tree = saved; } catch(e){}
  if (!tree) tree = defaultLayout();
  var maximized = null, dragging = null;
  function saveLayout(){ try { localStorage.setItem(LAYOUT_KEY, JSON.stringify(tree)); } catch(e){} }
  function countLeaves(n){ return n.t==="leaf" ? 1 : countLeaves(n.a)+countLeaves(n.b); }
  function mapTree(n, fn){ var r=fn(n); if (r!==undefined) return r; return n.t==="split" ? Object.assign({}, n, {a:mapTree(n.a,fn), b:mapTree(n.b,fn)}) : n; }
  function findNode(n, id){ if (n.id===id) return n; if (n.t!=="split") return null; return findNode(n.a,id) || findNode(n.b,id); }
  function removeLeaf(n, id){           // returns the tree without leaf id (its parent collapses to the sibling)
    if (n.t!=="split") return n;
    if (n.a.id===id) return n.b; if (n.b.id===id) return n.a;
    return Object.assign({}, n, {a:removeLeaf(n.a,id), b:removeLeaf(n.b,id)});
  }
  function opSplit(id, dir){ tree = mapTree(tree, function(n){ if (n.id===id) return split(dir, .5, n, leaf(n.kind)); }); }
  function opClose(id){ if (countLeaves(tree)>1) { tree = removeLeaf(tree, id); if (maximized===id) maximized=null; } }
  function opKind(id, kind){ tree = mapTree(tree, function(n){ if (n.id===id) return Object.assign({}, n, {kind:kind}); }); }
  function opMove(src, target, zone){      // dock pane src on an edge of pane target (center = swap)
    if (src===target) return;
    var s = findNode(tree, src), tg = findNode(tree, target); if (!s || !tg) return;
    if (zone==="center"){ var k=s.kind; opKind(src, tg.kind); opKind(target, k); return; }
    var moved = {id:s.id, t:"leaf", kind:s.kind};
    tree = removeLeaf(tree, src);
    tree = mapTree(tree, function(n){
      if (n.id===target){
        var dir = (zone==="left"||zone==="right") ? "row" : "col", first = (zone==="left"||zone==="top");
        return split(dir, .5, first ? moved : n, first ? n : moved);
      }
    });
  }

  // ---------------- save (republish the whole page from data) ----------------
  function buildDoc(next){
    var json = JSON.stringify(next).replace(/</g,"\\u003c");
    var start = PRISTINE.indexOf('<script id="lib-data" type="application/json">');
    var open = PRISTINE.indexOf(">", start) + 1;
    var close = PRISTINE.indexOf("<\/script>", open);
    return PRISTINE.slice(0, open) + json + PRISTINE.slice(close);
  }
  function save(next, tid, statusEl, btn){
    if (!artifactApi) return;
    if (btn) btn.disabled = true;
    if (statusEl){ statusEl.className="status"; statusEl.textContent="Saving…"; }
    try { history.replaceState(null,"", tid ? "#"+tid : location.pathname); } catch(e){}
    artifactApi.publish(buildDoc(next)).then(function(){
      if (statusEl) statusEl.textContent = "Saved.";
    }, function(err){
      if (btn) btn.disabled = false;
      var code = err && err.code;
      var msg = code==="conflict" ? "A newer version was saved elsewhere — the page is reloading to it; redo this edit."
        : (code==="not_writer"||code==="not_granted") ? "You can view this shelf but not edit it."
        : "Could not save ("+(code||"error")+"). Try again.";
      if (statusEl){ statusEl.className="status err"; statusEl.textContent=msg; }
    });
  }

  // ---------------- pane drag & drop + dividers ----------------
  var guide = null, chip = null;
  function zoneFor(rect, x, y){
    var fx = (x-rect.left)/rect.width, fy = (y-rect.top)/rect.height;
    if (fx>.3 && fx<.7 && fy>.3 && fy<.7) return "center";
    var d = {left:fx, right:1-fx, top:fy, bottom:1-fy};
    return Object.keys(d).sort(function(a,b){ return d[a]-d[b]; })[0];
  }
  function guideRect(r, zone){
    if (zone==="left") return {left:r.left, top:r.top, width:r.width/2, height:r.height};
    if (zone==="right") return {left:r.left+r.width/2, top:r.top, width:r.width/2, height:r.height};
    if (zone==="top") return {left:r.left, top:r.top, width:r.width, height:r.height/2};
    if (zone==="bottom") return {left:r.left, top:r.top+r.height/2, width:r.width, height:r.height/2};
    return {left:r.left+6, top:r.top+6, width:r.width-12, height:r.height-12};
  }
  document.addEventListener("pointerdown", function(e){
    var g = e.target.closest("[data-grip]");
    if (g){
      e.preventDefault();
      var id = g.getAttribute("data-grip"), n = findNode(tree, id);
      dragging = {id:id, target:null, zone:null};
      var pane = document.querySelector('[data-pane="'+id+'"]'); if (pane) pane.classList.add("dragging");
      guide = document.createElement("div"); guide.className = "guide"; guide.hidden = true; document.body.appendChild(guide);
      chip = document.createElement("div"); chip.className = "chip"; chip.textContent = (KINDS.find(function(k){return k.kind===n.kind;})||{}).label || "Pane"; document.body.appendChild(chip);
      chip.style.left = e.clientX+"px"; chip.style.top = e.clientY+"px";
      return;
    }
    var dv = e.target.closest("[data-divider]");
    if (dv){
      e.preventDefault();
      var sid = dv.getAttribute("data-divider"), node = findNode(tree, sid), box = dv.parentElement, r = box.getBoundingClientRect();
      var a = box.children[0], b = box.children[2];
      dv.classList.add("drag");
      var move = function(ev){
        var ratio = node.dir==="row" ? (ev.clientX-r.left)/r.width : (ev.clientY-r.top)/r.height;
        ratio = Math.max(.08, Math.min(.92, ratio)); node.ratio = ratio;
        a.style.flex = ratio+" 1 0"; b.style.flex = (1-ratio)+" 1 0";
      };
      var up = function(){ dv.classList.remove("drag"); document.removeEventListener("pointermove", move); document.removeEventListener("pointerup", up); saveLayout(); };
      document.addEventListener("pointermove", move); document.addEventListener("pointerup", up);
    }
  });
  document.addEventListener("pointermove", function(e){
    if (!dragging) return;
    chip.style.left = Math.min(e.clientX, innerWidth - chip.offsetWidth - 24)+"px"; chip.style.top = Math.min(e.clientY, innerHeight - 40)+"px";
    var el = document.elementFromPoint(e.clientX, e.clientY), pane = el && el.closest("[data-pane]");
    var tid = pane && pane.getAttribute("data-pane");
    if (!pane || tid===dragging.id){ dragging.target=null; guide.hidden=true; return; }
    var r = pane.getBoundingClientRect(), z = zoneFor(r, e.clientX, e.clientY), gr = guideRect(r, z);
    dragging.target = tid; dragging.zone = z;
    guide.hidden = false; guide.style.left=gr.left+"px"; guide.style.top=gr.top+"px"; guide.style.width=gr.width+"px"; guide.style.height=gr.height+"px";
  });
  function endDrag(apply){
    if (!dragging) return;
    var d = dragging; dragging = null;
    if (guide) guide.remove(); if (chip) chip.remove(); guide = chip = null;
    if (apply && d.target){ opMove(d.id, d.target, d.zone); saveLayout(); }
    renderDesk();
  }
  document.addEventListener("pointerup", function(){ endDrag(true); });
  document.addEventListener("keydown", function(e){ if (e.key==="Escape" && dragging) endDrag(false); });

  // ---------------- clicks / changes ----------------
  document.addEventListener("click", function(e){
    var b = e.target.closest("button"); if (!b) return;
    var d = b.dataset;
    if (d.kindmenu){
      var node = findNode(tree, d.kindmenu);
      if (menu && menu.anchor === b) { closeMenu(); return; }
      openMenu(b, KINDS.map(function(k){ return {value:k.kind, label:k.label}; }), node.kind, function(k){
        opKind(d.kindmenu, k); saveLayout(); renderDesk();
        var nb = document.querySelector('[data-kindmenu="'+d.kindmenu+'"]'); if (nb) nb.focus();
      });
      return;
    }
    if (d.vermenu){
      var tt0 = tech(d.vermenu); if (!tt0) return;
      if (menu && menu.anchor === b) { closeMenu(); return; }
      openMenu(b, tt0.versions.map(function(x){ return {value:x.v, label:x.v+(x.date?"   "+x.date:"")}; }), verOf(tt0).v, function(v){
        state.ver[d.vermenu]=v; state.confirm=false; state.fid=null; renderBodies();
      });
      return;
    }
    if (d.split){ opSplit(d.id, d.split); saveLayout(); renderDesk(); return; }
    if (d.close){ opClose(d.close); saveLayout(); renderDesk(); return; }
    if (d.max){ maximized = maximized ? null : d.max; renderDesk(); return; }
    if (d.cat!=null && b.classList.contains("cat")){ state.cat = d.cat || null; renderBodies(); return; }
    if (d.pick){ state.tid=d.pick; state.confirm=false; state.fid=null; try{history.replaceState(null,"","#"+state.tid);}catch(x){} renderBodies(); return; }
    if (d.ver && d.tid){ state.ver[d.tid]=d.ver; state.confirm=false; state.fid=null; renderBodies(); return; }
    if (d.file){ state.fid=d.file; renderBodies(); return; }
    if (d.copy){
      var f = curFile(); if (!f) return;
      var ok=function(){ b.textContent="Copied"; b.classList.add("done"); setTimeout(function(){ b.textContent="Copy code"; b.classList.remove("done"); },1600); };
      var fallback=function(){ var c=b.closest(".codebox").querySelector("code"); var r=document.createRange(); r.selectNodeContents(c); var s=getSelection(); s.removeAllRanges(); s.addRange(r); b.textContent="Selected, press Ctrl+C"; };
      try { navigator.clipboard.writeText(f.code).then(ok, fallback); } catch(x){ fallback(); }
      return;
    }
    if (d.act==="edit"){ openEditor("edit"); render(); return; }
    if (d.act==="newver"){ openEditor("newver"); render(); return; }
    if (d.act==="del"){ state.confirm=true; renderBodies(); return; }
    if (d.act==="delno"){ state.confirm=false; renderBodies(); return; }
    if (d.act==="delyes"){
      var tt=tech(state.tid), vv=verOf(tt), next=clone(DB), nt=next.techniques.find(function(x){return x.id===tt.id;});
      if (nt.versions.length>1) nt.versions = nt.versions.filter(function(x){return x.v!==vv.v;});
      else next.techniques = next.techniques.filter(function(x){return x.id!==tt.id;});
      b.disabled=true; b.textContent="Deleting…";
      save(next, next.techniques.some(function(x){return x.id===tt.id;}) ? tt.id : "", null, b);
      return;
    }
    if (d.rmfile!=null){ readForm(); state.draft.ver.files.splice(+d.rmfile,1); renderEditor(); return; }
    switch (b.id){
      case "newTech": openEditor("new"); render(); break;
      case "resetLayout": tree = defaultLayout(); maximized = null; saveLayout(); renderDesk(); break;
      case "addFile": readForm(); state.draft.ver.files.push(blankFile()); renderEditor(); break;
      case "rmImg": readForm(); state.draft.ver.previewImage=""; renderEditor(); break;
      case "cancelBtn": state.mode="view"; state.draft=null; render(); break;
    }
  });
  document.addEventListener("change", function(e){
    var s = e.target;
  });
  document.addEventListener("paste", function(e){
    if (state.mode!=="edit" || !assetsApi) return;
    var items = (e.clipboardData && e.clipboardData.items) || [];
    for (var i=0;i<items.length;i++){ if (items[i].type.indexOf("image/")===0){ var file=items[i].getAsFile(); if (file){ e.preventDefault(); uploadPreview(file); return; } } }
  });
  $("q").addEventListener("input", function(e){ state.q=e.target.value; renderBodies(); });

  render();

  if (window.claude && window.claude.use){
    window.claude.use("artifact").then(function(api){
      if (!api) return;
      artifactApi = api; $("newTech").hidden = false;
      if (state.mode==="view") renderBodies();
    }, function(){});
    window.claude.use("assets").then(function(api){ assetsApi = api || null; if (state.mode==="edit" && $("edForm")) { readForm(); renderEditor(); } }, function(){});
  }
})();
</script>
