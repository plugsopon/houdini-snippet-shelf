 item_generator_script=\"\", item_generator_script_language=hou.scriptLanguage.Python, menu_type=hou.menuType.Normal, menu_use_token=False, is_button_strip=False, strip_uses_icons=False)\nhou_parm_template.addParmTemplate(hou_parm_template2)\nhou_parm_template_group.append(hou_parm_template)\nhou_node.setParmTemplateGroup(hou_parm_template_group)\n# Code for /obj/geo2/t parm tuple\nif locals().get(\"hou_node\") is None:\n    hou_node = hou.node(\"/obj/geo2\")\nhou_parm_tuple = hou_node.parmTuple(\"t\")\nhou_parm_tuple.setAutoscope((True, True, True))\n\n\n# Code for /obj/geo2/r parm tuple\nif locals().get(\"hou_node\") is None:\n    hou_node = hou.node(\"/obj/geo2\")\nhou_parm_tuple = hou_node.parmTuple(\"r\")\nhou_parm_tuple.setAutoscope((True, True, True))\n\n\n# Code for /obj/geo2/s parm tuple\nif locals().get(\"hou_node\") is None:\n    hou_node = hou.node(\"/obj/geo2\")\nhou_parm_tuple = hou_node.parmTuple(\"s\")\nhou_parm_tuple.setAutoscope((True, True, True))\n\n\nhou_node.setExpressionLanguage(hou.exprLanguage.Hscript)\n\nhou_node.setUserData(\"___Version___\", \"21.0.671\")\nif hasattr(hou_node, \"syncNodeVersionIfNeeded\"):\n    hou_node.syncNodeVersionIfNeeded(\"21.0.671\")\n# Update the parent node.\nhou_parent = hou_node\n\n\n# Restore the parent and current nodes.\nhou_parent = hou_parent.parent()\nhou_node = hou_node.parent()\n\n\n\n# ---- connections between the template's top nodes ----\nhou_parent.node(\"geo1\").setDisplayFlag(True)\nhou_parent.node(\"geo2\").setDisplayFlag(True)\napply_frame_range([n for n in hou_parent.children() if n not in _before])\nprint(\"FX template My First Shot v002 rebuilt in\", hou_parent.path())\n", "visual": ""}]}]}, {"id": "rbd-copy-from-root", "name": "RBD pieces → copy root geometry", "category": "RBD", "type": "Sop", "author": "Plug", "versions": [{"v": "v001", "date": "2026-09-26", "previewImage": "", "previewVisual": "", "notes": "ปัญหา: เอาชิ้นจาก RBD sim มา Copy to Points แล้วชิ้นหมุนเพี้ยนและเลื่อนผิดที่ เพราะชิ้นต้นแบบที่ใช้ copy ไม่ได้อยู่ในท่า rest (ใช้ชิ้นที่ซิมเสร็จแล้วที่เฟรมสุดท้าย) orient เลยหมุนซ้ำทับ และ pivot จากซิมเป็นตำแหน่ง world ตอน emit\n\nวิธีหลัก: copy ชิ้น ROOT (ต้นฉบับจาก assemble) ด้วย packedfulltransform ของแต่ละชิ้นในซิม ซึ่งรวมการหมุนตอน emit + pscale + การเคลื่อนที่ของซิมไว้หมดแล้ว เปลี่ยน geo ต้นฉบับ (hi-res / โมเดลอื่น) ได้โดยไม่ต้องซิมใหม่\n\nวัดผลกับ emittingRBD.hipnc: ตรงกับซิมจริง max_err 0.000000 ทุก point ที่เฟรม 3, 12, 20, 25, 38\nทดสอบกับ H21.0.671", "files": [{"id": "rbd-root-builder", "title": "Builder: copy the root pieces onto the sim", "lang": "python", "context": "Python Shell", "tested": "Houdini 21.0.671", "filename": "build_rbd_root_copy.py", "description": "สร้าง chain ทั้งชุดใน Geometry network ที่ Network Editor เปิดอยู่: ROOT_pieces (unpack ชิ้นต้นฉบับ) → ROOT_sim_pieces (DOP Import แบบ Fetch Packed) → ROOT_targets → ROOT_copy → OUT_root_copy\nตั้ง DOPNET กับ ROOT_PIECES เป็นชื่อ node ใน network นั้น (หรือ path เต็ม)", "notes": "ชิ้นต้นฉบับต้องมี name ตรงกับชื่อชิ้นในซิม ถ้าซิมตั้งชื่อ piece0_12 (เติมเฟรมตอน emit) STRIP_SUFFIX = True จะตัด _12 ออกให้เป็น piece0\nใช้ได้เพราะ packed prim ในซิมเก็บ geo ต้นฉบับตัวเดียวกันไว้ข้างใน ต่างกันแค่ transform", "code": "# ============================================================================\n# RBD pieces -> copy the ROOT geometry  (paste into Houdini Python Shell)\n#\n# Re-creates every simulated RBD piece by copying the ORIGINAL (root) piece with\n# that piece's full packed transform (emission rotation + pscale + sim motion).\n# Exact match with the sim, and you can swap the root geometry (hi-res, a\n# different model, extra attributes) without re-simulating.\n#\n# HOW TO USE\n#   1. Open the Geometry network that holds the dopnet in the Network Editor\n#      (or set TARGET).\n#   2. Set DOPNET and ROOT_PIECES below (names in that network or full paths).\n#   3. Paste the whole thing into Windows > Python Shell and press Enter.\n#   New nodes are created (all named ROOT_*); existing nodes are not changed.\n# ============================================================================\n\nimport hou\n\n# ----------------------------- CONFIG ---------------------------------------\nTARGET      = \"\"            # \"\" = the network the Network Editor is showing\nDOPNET      = \"dopnet1\"     # the RBD dopnet\nOBJ_PATTERN = \"*rbd*\"       # DOP objects to import\nROOT_PIECES = \"assemble3\"   # root pieces, each with a \"name\" (piece0, piece1, ...)\nSTRIP_SUFFIX = True         # sim names like piece0_12 -> piece0 (emit-frame suffix)\n# ----------------------------------------------------------------------------\n\n\ndef current_network():\n    if TARGET:\n        n = hou.node(TARGET)\n        if n is None:\n            raise hou.Error(\"TARGET not found: %s\" % TARGET)\n        return n\n    ne = hou.ui.paneTabOfType(hou.paneTabType.NetworkEditor) if hou.isUIAvailable() else None\n    if ne is None:\n        raise hou.Error(\"No Network Editor found - open one, or set TARGET.\")\n    return ne.pwd()\n\n\ndef find(name, net):\n    n = net.node(name) or hou.node(name)\n    if n is None:\n        raise hou.Error(\"Node not found: %r (looked in %s and as a full path)\" % (name, net.path()))\n    return n\n\n\nnet = current_network()\nif net.childTypeCategory().name() != \"Sop\":\n    raise hou.Error(\"Open the Geometry (SOP) network that holds the dopnet - %s is not one.\" % net.path())\ndop = find(DOPNET, net)\nroot = find(ROOT_PIECES, net)\nbase = root.position() + hou.Vector2(0, -2)\n\n\ndef mk(type_name, name, dx, dy):\n    n = net.createNode(type_name, name)\n    n.setPosition(base + hou.Vector2(dx, dy))\n    return n\n\n\n# source: the root pieces, unpacked into the space the sim's packed prims embed them in\nsrc = mk(\"unpack\", \"ROOT_pieces\", 0, 0)\nsrc.setInput(0, root)\nsrc.parm(\"transfer_attributes\").set(\"name\")\n\n# targets: the sim's packed pieces this frame, one point each with its full transform\nimp = mk(\"dopimport::2.0\", \"ROOT_sim_pieces\", 4, 0)\nimp.parm(\"doppath\").set(imp.relativePathTo(dop))\nimp.parm(\"objpattern\").set(OBJ_PATTERN)          # default style = fetch packed geometry\n\ntgt = mk(\"attribwrangle\", \"ROOT_targets\", 4, -1.2)\ntgt.setInput(0, imp)\ntgt.parm(\"snippet\").set(r'''\n// One target point per simulated piece, carrying that piece's WHOLE transform:\n// emission rotation + pscale + the sim's motion.\nint prim = pointprims(0, @ptnum)[0];\nmatrix M = primintrinsic(0, \"packedfulltransform\", prim);\n3@transform = matrix3(M);\nv@P = set(getcomp(M, 3, 0), getcomp(M, 3, 1), getcomp(M, 3, 2));\n''' + ('s@name = re_replace(\"_[0-9]+$\", \"\", s@name);   // piece0_12 -> piece0\\n' if STRIP_SUFFIX else \"\"))\n\nclean = mk(\"attribdelete\", \"ROOT_targets_clean\", 4, -2.4)\nclean.setInput(0, tgt)\nclean.parm(\"negate\").set(1)                      # keep only these point attributes\nclean.parm(\"ptdel\").set(\"name transform v\")\n\npts = mk(\"add\", \"ROOT_points_only\", 4, -3.6)     # drop the packed prims, keep the points\npts.setInput(0, clean)\npts.parm(\"remove\").set(1)\n\ncp = mk(\"copytopoints::2.0\", \"ROOT_copy\", 0, -4.8)\ncp.setInput(0, src)\ncp.setInput(1, pts)\ncp.parm(\"useidattrib\").set(1)                    # Piece Attribute = name\n\nout = mk(\"null\", \"OUT_root_copy\", 0, -6)\nout.setInput(0, cp)\nout.setDisplayFlag(True)\nout.setRenderFlag(True)\n\nprint(\"RBD root copy built in %s -> %s\" % (net.path(), out.name()))\n", "visual": ""}, {"id": "rbd-root-targets-vex", "title": "ROOT_targets: full transform per piece", "lang": "vex", "context": "Attribute Wrangle · Points", "tested": "Houdini 21.0.671", "filename": "rbd_root_targets.vfl", "description": "ต่อหลัง DOP Import แบบ Fetch Packed Geometry ได้ target หนึ่ง point ต่อชิ้น มี 3@transform กับ P ตรงกับชิ้นในซิม แล้ว Copy to Points ชิ้น root (Piece Attribute = name)", "notes": "ต่อจากนี้: Attribute Delete (Delete Non Selected: name transform v) → Add (Delete Geometry But Keep the Points)\nต้องลบ orient / pivot / pscale / N ทิ้ง ไม่งั้นจะไปแย่ง transform", "code": "// One target point per simulated piece, carrying that piece's WHOLE transform:\n// emission rotation + pscale + the sim's motion.\nint prim = pointprims(0, @ptnum)[0];\nmatrix M = primintrinsic(0, \"packedfulltransform\", prim);\n3@transform = matrix3(M);\nv@P = set(getcomp(M, 3, 0), getcomp(M, 3, 1), getcomp(M, 3, 2));\ns@name = re_replace(\"_[0-9]+$\", \"\", s@name);   // piece0_12 -> piece0 (drop if names already match)\n", "visual": ""}, {"id": "rbd-back-to-rest-vex", "title": "back_to_rest_pose: final-frame pieces → rest", "lang": "vex", "context": "Attribute Wrangle · Points", "tested": "Houdini 21.0.671", "filename": "back_to_rest_pose.vfl", "description": "อีกทางหนึ่ง ถ้าอยาก copy ชิ้นที่ fetch มาจากซิม (เช่นเฟรมสุดท้าย) แทนชิ้น root: ถอยการหมุนและการเลื่อนของซิมออก ให้ชิ้นกลับไปอยู่ตรงจุดที่ emit แล้วใช้ orient / pivot / P ของ RBD points ตามปกติ", "notes": "วัดแล้วตรงกับซิม max_err 0.00000 ที่เฟรม 5, 15, 25, 36 · Timeshift ของสอง input ต้องเป็นเฟรมเดียวกัน", "code": "// Alternative: put the FINAL-frame packed pieces back into their REST pose, then\n// Copy to Points re-applies the sim per frame:  world = (rest - pivot) * orient + P\n// input 0 = packed pieces fetched at the rest frame (Timeshift of a Fetch-Packed DOP Import)\n// input 1 = RBD points (DOP Import, Create Points) timeshifted to the SAME frame\nint pt = findattribval(1, \"point\", \"name\", s@name);\nif (pt \u003c 0) { removepoint(0, @ptnum); return; }\nvector4 qi = qinvert(point(1, \"orient\", pt));\nvector  P1 = point(1, \"P\", pt);\nvector  pv = point(1, \"pivot\", pt);\nint prim = pointprims(0, @ptnum)[0];\nmatrix3 T = primintrinsic(0, \"transform\", prim);\nsetprimintrinsic(0, \"transform\", prim, T * qconvert(qi));   // remove the sim's rotation\nv@P = qrotate(qi, v@P - P1) + pv;                           // move back to where it was emitted\n", "visual": ""}, {"id": "measure-orient-diff-vex", "title": "Measure orient difference between two copies", "lang": "vex", "context": "Attribute Wrangle · Detail", "tested": "Houdini 21.0.671", "filename": "measure_orient_diff.vfl", "description": "เช็คว่า geo สองชุด (ชิ้นเดียวกัน) หมุนต่างกันกี่องศา รอบแกนไหน เลื่อนไปเท่าไหร่ โดยวัดจากตำแหน่ง point จริง ไม่ต้องพึ่ง attribute orient", "notes": "อ่านผล: angle ≈ 0 แต่ offset ไม่ 0 = ปัญหา pivot · angle ≈ 180 = แกนกลับด้าน · fit_rms สูง = shape ต่างด้วย (scale หรือลำดับ point ไม่ตรง)\nทางไม่ต้องเขียนโค้ด: Extract Transform SOP (input 1 = ตัวถูก, input 2 = ตัวที่เช็ค)", "code": "// Measure how two copies of the SAME geometry differ (same point count + order).\n// Detail Wrangle: input 0 = the copy you are checking, input 1 = the reference.\nint n = npoints(0);\nif (n != npoints(1)) { warning(\"point count differs: %d vs %d\", n, npoints(1)); return; }\n\nvector c0 = 0, c1 = 0;\nfor (int i = 0; i \u003c n; i++) { c0 += point(0, \"P\", i); c1 += point(1, \"P\", i); }\nc0 /= n; c1 /= n;\n\nmatrix3 H = 0;\nfor (int i = 0; i \u003c n; i++)\n    H += outerproduct(point(1, \"P\", i) - c1, point(0, \"P\", i) - c0);\nmatrix3 M = polardecomp(H);                 // pure rotation part\nif (determinant(M) \u003c 0) warning(\"mirror, not a rotation: flipped or negative scale\");\n\nvector4 q = quaternion(M);\nfloat err = 0;\nfor (int i = 0; i \u003c n; i++)\n    err += length2((point(1, \"P\", i) - c1) * M - (point(0, \"P\", i) - c0));\n\np@diff_orient    = q;\nf@diff_angle_deg = degrees(2 * acos(clamp(abs(q.w), 0, 1)));\nv@diff_axis      = normalize(set(q.x, q.y, q.z));\nv@diff_offset    = c0 - c1;\nf@fit_rms        = sqrt(err / n);           // ~0 = only a rigid rotation apart\n", "visual": ""}]}, {"v": "v002", "date": "2026-09-26", "previewImage": "", "previewVisual": "", "notes": "v002: paste แล้วสร้างทั้งฉากใหม่หมด แบบเดียวกับ FX Template\n• BUILD_DEMO = True (default): สร้างชิ้น root 3 สี, emitter ที่ปล่อยชิ้นใหม่ทุกเฟรม (pscale + N สุ่ม), Bullet RBD dopnet และ chain copy-from-root ครบในตัว\n• เปิด /obj แล้วรัน = สร้าง geo ใหม่ชื่อ rbd_root_copy · เปิด Geometry network แล้วรัน = สร้างตรงนั้น ต่อลงไปใต้ node เดิม\n• Start frame ของ dopnet = start ของ playbar (START_FRAME / LINK_TO_PLAYBAR ปรับได้)\n• BUILD_DEMO = False: ต่อแค่ chain เข้าซิมของพี่ ตั้ง DOPNET กับ ROOT_PIECES\n• OBJ_PATTERN default เป็น *rbd* เพราะ * จะดึง ground plane มาด้วย\n\nวัดผลแล้ว: demo ที่สร้างจากศูนย์ในฉากว่าง และไฟล์ emittingRBD ตรงกับซิม max_err 0.000000 ทุก point ที่เฟรม 1, 12, 30, 48\nรันซ้ำใน network เดิมได้ ไม่ชนกัน\n\nปัญหา: เอาชิ้นจาก RBD sim มา Copy to Points แล้วชิ้นหมุนเพี้ยนและเลื่อนผิดที่ เพราะชิ้นต้นแบบที่ใช้ copy ไม่ได้อยู่ในท่า rest (ใช้ชิ้นที่ซิมเสร็จแล้วที่เฟรมสุดท้าย) orient เลยหมุนซ้ำทับ และ pivot จากซิมเป็นตำแหน่ง world ตอน emit\n\nวิธีหลัก: copy ชิ้น ROOT (ต้นฉบับจาก assemble) ด้วย packedfulltransform ของแต่ละชิ้นในซิม ซึ่งรวมการหมุนตอน emit + pscale + การเคลื่อนที่ของซิมไว้หมดแล้ว เปลี่ยน geo ต้นฉบับ (hi-res / โมเดลอื่น) ได้โดยไม่ต้องซิมใหม่\n\nวัดผลกับ emittingRBD.hipnc: ตรงกับซิมจริง max_err 0.000000 ทุก point ที่เฟรม 3, 12, 20, 25, 38\nทดสอบกับ H21.0.671", "files": [{"id": "rbd-root-builder", "title": "Builder: whole emitting-RBD setup + root copy", "lang": "python", "context": "Python Shell", "tested": "Houdini 21.0.671 · empty scene + emittingRBD", "filename": "build_rbd_root_copy_v2.py", "description": "paste ใน Python Shell แล้วสร้างทุกอย่างใหม่หมด: ชิ้น root → emitter → RBD dopnet → ROOT_copy → OUT_root_copy\nติดตั้งลง network ที่ Network Editor เปิดอยู่ (/obj = สร้าง geo ใหม่)", "notes": "ชิ้นที่ emit เป็น packed อยู่แล้วหลัง Copy to Points ห้าม Assemble ซ้ำ ไม่งั้นชิ้นจะซ้อน packed สองชั้น แล้ว packedfulltransform จะชี้ไปที่ชั้นนอก\nชิ้นต้นฉบับต้องมี name ตรงกับชื่อชิ้นในซิม ถ้าซิมตั้งชื่อ piece0_12 (เติมเฟรมตอน emit) STRIP_SUFFIX = True จะตัด _12 ออกให้เป็น piece0\nใช้ได้เพราะ packed prim ในซิมเก็บ geo ต้นฉบับตัวเดียวกันไว้ข้างใน ต่างกันแค่ transform", "code": "# ============================================================================\n# RBD pieces -> copy the ROOT geometry   v002   (paste into Houdini Python Shell)\n#\n# Re-creates every simulated RBD piece by copying the ORIGINAL (root) piece with\n# that piece's full packed transform (emission rotation + pscale + sim motion).\n# Exact match with the sim, and the root geometry can be swapped (hi-res, a\n# different model, extra attributes) without re-simulating.\n#\n# HOW TO USE\n#   1. Open a network in the Network Editor:\n#        - a Geometry (SOP) network -> everything is built right there\n#        - /obj                     -> a new \"rbd_root_copy\" geo is created for it\n#   2. Paste the whole thing into Windows > Python Shell and press Enter.\n#\n#   BUILD_DEMO = True  -> builds the WHOLE setup: 3 coloured root pieces, a\n#                         scatter emitter that births pieces every frame, the\n#                         Bullet RBD dopnet, and the root-copy chain on top.\n#   BUILD_DEMO = False -> only adds the root-copy chain to YOUR sim: set DOPNET\n#                         and ROOT_PIECES (names in the open network or full paths).\n#   Existing nodes are never changed.\n# ============================================================================\n\nimport hou\n\n# ----------------------------- CONFIG ---------------------------------------\nBUILD_DEMO   = True\nTARGET       = \"\"            # \"\" = the network the Network Editor is showing; or a path\n\nDOPNET       = \"dopnet1\"     # BUILD_DEMO = False: your RBD dopnet\nROOT_PIECES  = \"assemble3\"   # BUILD_DEMO = False: root pieces with a \"name\" (piece0, piece1, ...)\nOBJ_PATTERN  = \"*rbd*\"       # DOP objects to import (\"*\" would also pull in the ground plane)\nSTRIP_SUFFIX = True          # sim names like piece0_12 -> piece0 (emission-frame suffix)\n\nSTART_FRAME  = None          # None = playbar start (sim start frame)\nLINK_TO_PLAYBAR = False      # True = expression to $RFSTART instead of a fixed number\n# ----------------------------------------------------------------------------\n\n\ndef current_network():\n    if TARGET:\n        n = hou.node(TARGET)\n        if n is None:\n            raise hou.Error(\"TARGET not found: %s\" % TARGET)\n        return n\n    ne = hou.ui.paneTabOfType(hou.paneTabType.NetworkEditor) if hou.isUIAvailable() else None\n    if ne is None:\n        raise hou.Error(\"No Network Editor found - open one, or set TARGET.\")\n    return ne.pwd()\n\n\ndef sop_network(net):\n    cat = net.childTypeCategory().name()\n    if cat == \"Sop\":\n        return net\n    if cat == \"Object\":\n        return net.createNode(\"geo\", \"rbd_root_copy\")\n    raise hou.Error(\"Open a Geometry (SOP) network or /obj - %s holds %s nodes.\" % (net.path(), cat))\n\n\ndef find(name, net):\n    n = net.node(name) or hou.node(name)\n    if n is None:\n        raise hou.Error(\"Node not found: %r (looked in %s and as a full path)\" % (name, net.path()))\n    return n\n\n\ndef set_start_frame(node):\n    \"\"\"Point a sim's start frame at the playbar start (or START_FRAME).\"\"\"\n    p = node.parm(\"startframe\")\n    if p is None:\n        return\n    if START_FRAME is None and LINK_TO_PLAYBAR:\n        p.setExpression(\"$RFSTART\")\n    else:\n        p.set(START_FRAME if START_FRAME is not None else hou.playbar.frameRange()[0])\n\n\nnet = sop_network(current_network())\nys = [c.position()[1] for c in net.children()]\ntop = (min(ys) - 2) if ys else 0          # build below whatever is already there\ncreated = []\n\n\ndef mk(parent, type_name, name, x, y):\n    n = parent.createNode(type_name, name)\n    n.setPosition(hou.Vector2(x, top + y))\n    created.append(n)\n    return n\n\n\ndef mk_dop(parent, type_name, name, x, y):\n    n = parent.createNode(type_name, name)\n    n.setPosition(hou.Vector2(x, y))\n    return n\n\n\nif BUILD_DEMO:\n    # --- root pieces: one box, three colours, packed and named piece0/1/2 -----\n    box = mk(net, \"box\", \"demo_box\", 0, 0)\n    box.parm(\"type\").set(1)                            # polygon mesh\n    for p in (\"divrate1\", \"divrate2\", \"divrate3\"):\n        box.parm(p).set(2)\n    cols = []\n    for i, rgb in enumerate(((0, 0, 1), (1, 0, 0), (0, 1, 0))):\n        c = mk(net, \"color\", \"demo_color%d\" % (i + 1), -3 + 3 * i, -1.2)\n        c.setInput(0, box)\n        c.parmTuple(\"color\").set(rgb)\n        cols.append(c)\n    mrg = mk(net, \"merge\", \"demo_merge\", 0, -2.4)\n    for i, c in enumerate(cols):\n        mrg.setInput(i, c)\n    root = mk(net, \"assemble\", \"ROOT_assemble\", 0, -3.6)\n    root.setInput(0, mrg)\n    root.parm(\"pack_geo\").set(1)                       # packed pieces named piece0, piece1, piece2\n\n    # --- emitter: 3 new points every frame, random pscale + N, named piece0..2 ---\n    grid = mk(net, \"grid\", \"demo_grid\", 7, 0)\n    sc = mk(net, \"scatter::2.0\", \"demo_scatter\", 7, -1.2)\n    sc.setInput(0, grid)\n    sc.parm(\"npts\").set(3)\n    sc.parm(\"seed\").setExpression(\"$FF\")               # new positions every frame\n    lift = mk(net, \"xform\", \"demo_lift\", 7, -2.4)\n    lift.setInput(0, sc)\n    lift.parm(\"ty\").set(4.8)\n    rs = mk(net, \"attribrandomize\", \"demo_rand_pscale\", 7, -3.6)\n    rs.setInput(0, lift)\n    rs.parm(\"name\").set(\"pscale\")\n    rs.parm(\"minx\").set(0.2)\n    rs.parm(\"seed\").setExpression(\"$F\")\n    rn = mk(net, \"attribrandomize\", \"demo_rand_N\", 7, -4.8)\n    rn.setInput(0, rs)\n    rn.parm(\"name\").set(\"N\")\n    rn.parm(\"seed\").setExpression(\"$F\")\n    nm = mk(net, \"attribwrangle\", \"demo_piece_name\", 7, -6)\n    nm.setInput(0, rn)\n    nm.parm(\"snippet\").set(\"s@name = 'piece' + itoa(@ptnum % 3);\")\n\n    cp_emit = mk(net, \"copytopoints::2.0\", \"demo_emit_copy\", 3.5, -7.2)\n    cp_emit.setInput(0, root)\n    cp_emit.setInput(1, nm)\n    cp_emit.parm(\"useidattrib\").set(1)                 # piece0 -> root piece0, ...\n    cp_emit.parm(\"targetattribs\").set(1)               # copy name (etc.) from the emit points\n    cp_emit.parm(\"applyattribs1\").set(\"*,^v,^Alpha,^N,^up,^pscale,^scale,^orient,^rot,^pivot,^trans,^transform\")\n    # the copies are already packed pieces; packing them again would nest them\n    fr = mk(net, \"attribwrangle\", \"demo_emit_frame_name\", 3.5, -9.6)\n    fr.setInput(0, cp_emit)\n    fr.parm(\"snippet\").set(\"s@name += '_' + itoa(@Frame);\")   # unique name per emitted piece\n\n    # --- Bullet RBD sim that adds the new pieces every frame -------------------\n    dop = mk(net, \"dopnet\", \"demo_rbd_dopnet\", 3.5, -10.8)\n    dop.setInput(0, fr)\n    set_start_frame(dop)\n    obj = mk_dop(dop, \"rbdpackedobject\", \"rbdpackedobject1\", 0, 0)\n    obj.parm(\"geosource\").set(1)                       # first context geometry\n    obj.parm(\"createframe\").setExpression(\"$F\")        # re-create -> adds this frame's pieces\n    sol = mk_dop(dop, \"bulletrbdsolver\", \"bulletrbdsolver1\", 0, -1)\n    sol.setInput(0, obj)\n    grav = mk_dop(dop, \"gravity\", \"gravity1\", 0, -2)\n    grav.setInput(0, sol)\n    ground = mk_dop(dop, \"groundplane\", \"groundplane1\", -3, -2)\n    dm = mk_dop(dop, \"merge\", \"merge1\", -1.5, -3)\n    dm.setInput(0, ground)\n    dm.setInput(1, grav)\n    dout = mk_dop(dop, \"output\", \"output\", -1.5, -4)\n    dout.setInput(0, dm)\n    dout.setDisplayFlag(True)\n    x0, y0 = 0, -12.5\nelse:\n    dop = find(DOPNET, net)\n    root = find(ROOT_PIECES, net)\n    x0, y0 = root.position()[0] - 0, root.position()[1] - top - 2\n\n# --- the root copy -----------------------------------------------------------\nsrc = mk(net, \"unpack\", \"ROOT_pieces\", x0, y0)\nsrc.setInput(0, root)\nsrc.parm(\"transfer_attributes\").set(\"name\")\n\nimp = mk(net, \"dopimport::2.0\", \"ROOT_sim_pieces\", x0 + 4, y0)\nimp.parm(\"doppath\").set(imp.relativePathTo(dop))\nimp.parm(\"objpattern\").set(OBJ_PATTERN)              # default style = fetch packed geometry\n\ntgt = mk(net, \"attribwrangle\", \"ROOT_targets\", x0 + 4, y0 - 1.2)\ntgt.setInput(0, imp)\ntgt.parm(\"snippet\").set(r'''\n// One target point per simulated piece, carrying that piece's WHOLE transform:\n// emission rotation + pscale + the sim's motion.\nint prim = pointprims(0, @ptnum)[0];\nmatrix M = primintrinsic(0, \"packedfulltransform\", prim);\n3@transform = matrix3(M);\nv@P = set(getcomp(M, 3, 0), getcomp(M, 3, 1), getcomp(M, 3, 2));\n''' + ('s@name = re_replace(\"_[0-9]+$\", \"\", s@name);   // piece0_12 -> piece0\\n' if STRIP_SUFFIX else \"\"))\n\nclean = mk(net, \"attribdelete\", \"ROOT_targets_clean\", x0 + 4, y0 - 2.4)\nclean.setInput(0, tgt)\nclean.parm(\"negate\").set(1)                          # keep only these point attributes\nclean.parm(\"ptdel\").set(\"name transform v\")\n\npts = mk(net, \"add\", \"ROOT_points_only\", x0 + 4, y0 - 3.6)\npts.setInput(0, clean)\npts.parm(\"remove\").set(1)                            # drop the packed prims, keep the points\n\ncp = mk(net, \"copytopoints::2.0\", \"ROOT_copy\", x0, y0 - 4.8)\ncp.setInput(0, src)\ncp.setInput(1, pts)\ncp.parm(\"useidattrib\").set(1)                        # Piece Attribute = name\n\nout = mk(net, \"null\", \"OUT_root_copy\", x0, y0 - 6)\nout.setInput(0, cp)\nout.setDisplayFlag(True)\nout.setRenderFlag(True)\n\nprint(\"RBD root copy built in %s (%d nodes) -> %s\" % (net.path(), len(created), out.path()))\n", "visual": ""}, {"id": "rbd-root-targets-vex", "title": "ROOT_targets: full transform per piece", "lang": "vex", "context": "Attribute Wrangle · Points", "tested": "Houdini 21.0.671", "filename": "rbd_root_targets.vfl", "description": "ต่อหลัง DOP Import แบบ Fetch Packed Geometry ได้ target หนึ่ง point ต่อชิ้น มี 3@transform กับ P ตรงกับชิ้นในซิม แล้ว Copy to Points ชิ้น root (Piece Attribute = name)", "notes": "ต่อจากนี้: Attribute Delete (Delete Non Selected: name transform v) → Add (Delete Geometry But Keep the Points)\nต้องลบ orient / pivot / pscale / N ทิ้ง ไม่งั้นจะไปแย่ง transform", "code": "// One target point per simulated piece, carrying that piece's WHOLE transform:\n// emission rotation + pscale + the sim's motion.\nint prim = pointprims(0, @ptnum)[0];\nmatrix M = primintrinsic(0, \"packedfulltransform\", prim);\n3@transform = matrix3(M);\nv@P = set(getcomp(M, 3, 0), getcomp(M, 3, 1), getcomp(M, 3, 2));\ns@name = re_replace(\"_[0-9]+$\", \"\", s@name);   // piece0_12 -> piece0 (drop if names already match)\n", "visual": ""}, {"id": "rbd-back-to-rest-vex", "title": "back_to_rest_pose: final-frame pieces → rest", "lang": "vex", "context": "Attribute Wrangle · Points", "tested": "Houdini 21.0.671", "filename": "back_to_rest_pose.vfl", "description": "อีกทางหนึ่ง ถ้าอยาก copy ชิ้นที่ fetch มาจากซิม (เช่นเฟรมสุดท้าย) แทนชิ้น root: ถอยการหมุนและการเลื่อนของซิมออก ให้ชิ้นกลับไปอยู่ตรงจุดที่ emit แล้วใช้ orient / pivot / P ของ RBD points ตามปกติ", "notes": "วัดแล้วตรงกับซิม max_err 0.00000 ที่เฟรม 5, 15, 25, 36 · Timeshift ของสอง input ต้องเป็นเฟรมเดียวกัน", "code": "// Alternative: put the FINAL-frame packed pieces back into their REST pose, then\n// Copy to Points re-applies the sim per frame:  world = (rest - pivot) * orient + P\n// input 0 = packed pieces fetched at the rest frame (Timeshift of a Fetch-Packed DOP Import)\n// input 1 = RBD points (DOP Import, Create Points) timeshifted to the SAME frame\nint pt = findattribval(1, \"point\", \"name\", s@name);\nif (pt \u003c 0) { removepoint(0, @ptnum); return; }\nvector4 qi = qinvert(point(1, \"orient\", pt));\nvector  P1 = point(1, \"P\", pt);\nvector  pv = point(1, \"pivot\", pt);\nint prim = pointprims(0, @ptnum)[0];\nmatrix3 T = primintrinsic(0, \"transform\", prim);\nsetprimintrinsic(0, \"transform\", prim, T * qconvert(qi));   // remove the sim's rotation\nv@P = qrotate(qi, v@P - P1) + pv;                           // move back to where it was emitted\n", "visual": ""}, {"id": "measure-orient-diff-vex", "title": "Measure orient difference between two copies", "lang": "vex", "context": "Attribute Wrangle · Detail", "tested": "Houdini 21.0.671", "filename": "measure_orient_diff.vfl", "description": "เช็คว่า geo สองชุด (ชิ้นเดียวกัน) หมุนต่างกันกี่องศา รอบแกนไหน เลื่อนไปเท่าไหร่ โดยวัดจากตำแหน่ง point จริง ไม่ต้องพึ่ง attribute orient", "notes": "อ่านผล: angle ≈ 0 แต่ offset ไม่ 0 = ปัญหา pivot · angle ≈ 180 = แกนกลับด้าน · fit_rms สูง = shape ต่างด้วย (scale หรือลำดับ point ไม่ตรง)\nทางไม่ต้องเขียนโค้ด: Extract Transform SOP (input 1 = ตัวถูก, input 2 = ตัวที่เช็ค)", "code": "// Measure how two copies of the SAME geometry differ (same point count + order).\n// Detail Wrangle: input 0 = the copy you are checking, input 1 = the reference.\nint n = npoints(0);\nif (n != npoints(1)) { warning(\"point count differs: %d vs %d\", n, npoints(1)); return; }\n\nvector c0 = 0, c1 = 0;\nfor (int i = 0; i \u003c n; i++) { c0 += point(0, \"P\", i); c1 += point(1, \"P\", i); }\nc0 /= n; c1 /= n;\n\nmatrix3 H = 0;\nfor (int i = 0; i \u003c n; i++)\n    H += outerproduct(point(1, \"P\", i) - c1, point(0, \"P\", i) - c0);\nmatrix3 M = polardecomp(H);                 // pure rotation part\nif (determinant(M) \u003c 0) warning(\"mirror, not a rotation: flipped or negative scale\");\n\nvector4 q = quaternion(M);\nfloat err = 0;\nfor (int i = 0; i \u003c n; i++)\n    err += length2((point(1, \"P\", i) - c1) * M - (point(0, \"P\", i) - c0));\n\np@diff_orient    = q;\nf@diff_angle_deg = degrees(2 * acos(clamp(abs(q.w), 0, 1)));\nv@diff_axis      = normalize(set(q.x, q.y, q.z));\nv@diff_offset    = c0 - c1;\nf@fit_rms        = sqrt(err / n);           // ~0 = only a rigid rotation apart\n", "visual": ""}]}, {"v": "v003", "date": "2026-09-26", "previewImage": "", "previewVisual": "", "notes": "v003: เพิ่มวิธีที่สอง import มาแค่ point (DOP Import → Create Points to Represent Objects)\n• ไม่ต้องดึง geometry ออกจากซิมเลย เบากว่า ใช้แค่ point ละชิ้น\n• ใช้ restxform ที่ Bullet เก็บไว้บน point (การหมุน + pscale ตอน emit และตำแหน่ง rest) + pivot + orient + P สร้าง transform เต็มกลับมา: world = (rest - pivot) × orient + P\n• ต้องใส่ restxform ใน Transfer Attributes ของ DOP Import (สคริปต์ใส่ให้แล้ว: orient pivot restxform name v)\n• METHOD = \"both\" (default) สร้างทั้งสองวิธีคู่กัน · \"points\" หรือ \"packed\" เลือกอันเดียว\n\nวัดผลแล้ว: ทั้งสองวิธีตรงกับซิม max_err ≤ 0.000001 ทุก point ที่เฟรม 1, 12, 30, 48 ทั้ง demo ในฉากว่างและไฟล์ emittingRBD\n\nv002: paste แล้วสร้างทั้งฉากใหม่หมด แบบเดียวกับ FX Template\n• BUILD_DEMO = True (default): สร้างชิ้น root 3 สี, emitter ที่ปล่อยชิ้นใหม่ทุกเฟรม (pscale + N สุ่ม), Bullet RBD dopnet และ chain copy-from-root ครบในตัว\n• เปิด /obj แล้วรัน = สร้าง geo ใหม่ชื่อ rbd_root_copy · เปิด Geometry network แล้วรัน = สร้างตรงนั้น ต่อลงไปใต้ node เดิม\n• Start frame ของ dopnet = start ของ playbar (START_FRAME / LINK_TO_PLAYBAR ปรับได้)\n• BUILD_DEMO = False: ต่อแค่ chain เข้าซิมของพี่ ตั้ง DOPNET กับ ROOT_PIECES\n• OBJ_PATTERN default เป็น *rbd* เพราะ * จะดึง ground plane มาด้วย\n\nวัดผลแล้ว: demo ที่สร้างจากศูนย์ในฉากว่าง และไฟล์ emittingRBD ตรงกับซิม max_err 0.000000 ทุก point ที่เฟรม 1, 12, 30, 48\nรันซ้ำใน network เดิมได้ ไม่ชนกัน\n\nปัญหา: เอาชิ้นจาก RBD sim มา Copy to Points แล้วชิ้นหมุนเพี้ยนและเลื่อนผิดที่ เพราะชิ้นต้นแบบที่ใช้ copy ไม่ได้อยู่ในท่า rest (ใช้ชิ้นที่ซิมเสร็จแล้วที่เฟรมสุดท้าย) orient เลยหมุนซ้ำทับ และ pivot จากซิมเป็นตำแหน่ง world ตอน emit\n\nวิธีหลัก: copy ชิ้น ROOT (ต้นฉบับจาก assemble) ด้วย packedfulltransform ของแต่ละชิ้นในซิม ซึ่งรวมการหมุนตอน emit + pscale + การเคลื่อนที่ของซิมไว้หมดแล้ว เปลี่ยน geo ต้นฉบับ (hi-res / โมเดลอื่น) ได้โดยไม่ต้องซิมใหม่\n\nวัดผลกับ emittingRBD.hipnc: ตรงกับซิมจริง max_err 0.000000 ทุก point ที่เฟรม 3, 12, 20, 25, 38\nทดสอบกับ H21.0.671", "files": [{"id": "rbd-root-builder", "title": "Builder: whole setup + root copy (packed and/or points)", "lang": "python", "context": "Python Shell", "tested": "Houdini 21.0.671 · empty scene + emittingRBD", "filename": "build_rbd_root_copy_v3.py", "description": "paste ใน Python Shell แล้วสร้างทุกอย่างใหม่หมด: ชิ้น root → emitter → RBD dopnet → chain copy-from-root\nMETHOD เลือกได้ว่าอ่านซิมแบบ packed (OUT_root_copy), แบบ points (OUT_root_copy_points) หรือทั้งสองแบบ", "notes": "ชิ้นที่ emit เป็น packed อยู่แล้วหลัง Copy to Points ห้าม Assemble ซ้ำ ไม่งั้นชิ้นจะซ้อน packed สองชั้น แล้ว packedfulltransform จะชี้ไปที่ชั้นนอก\nชิ้นต้นฉบับต้องมี name ตรงกับชื่อชิ้นในซิม ถ้าซิมตั้งชื่อ piece0_12 (เติมเฟรมตอน emit) STRIP_SUFFIX = True จะตัด _12 ออกให้เป็น piece0\nใช้ได้เพราะ packed prim ในซิมเก็บ geo ต้นฉบับตัวเดียวกันไว้ข้างใน ต่างกันแค่ transform", "code": "# ============================================================================\n# RBD pieces -> copy the ROOT geometry   v003   (paste into Houdini Python Shell)\n#\n# Re-creates every simulated RBD piece by copying the ORIGINAL (root) piece with\n# that piece's full transform (emission rotation + pscale + sim motion).\n# Exact match with the sim, and the root geometry can be swapped (hi-res, a\n# different model, extra attributes) without re-simulating.\n#\n# Two ways to read the sim (METHOD):\n#   \"packed\" -> DOP Import \"Fetch Geometry\": packedfulltransform of each piece\n#   \"points\" -> DOP Import \"Create Points to Represent Objects\": one point per\n#               piece, rebuilt from restxform (emission transform) + pivot +\n#               orient + P. Lighter: no geometry comes out of the sim.\n#   \"both\"   -> builds both side by side (display flag on the points one).\n#\n# HOW TO USE\n#   1. Open a network in the Network Editor:\n#        - a Geometry (SOP) network -> everything is built right there\n#        - /obj                     -> a new \"rbd_root_copy\" geo is created for it\n#   2. Paste the whole thing into Windows > Python Shell and press Enter.\n#\n#   BUILD_DEMO = True  -> builds the WHOLE setup: 3 coloured root pieces, a\n#                         scatter emitter that births pieces every frame, the\n#                         Bullet RBD dopnet, and the root-copy chain on top.\n#   BUILD_DEMO = False -> only adds the root-copy chain to YOUR sim: set DOPNET\n#                         and ROOT_PIECES (names in the open network or full paths).\n#   Existing nodes are never changed.\n# ============================================================================\n\nimport hou\n\n# ----------------------------- CONFIG ---------------------------------------\nBUILD_DEMO   = True\nTARGET       = \"\"            # \"\" = the network the Network Editor is showing; or a path\nMETHOD       = \"both\"        # \"packed\" | \"points\" | \"both\"\n\nDOPNET       = \"dopnet1\"     # BUILD_DEMO = False: your RBD dopnet\nROOT_PIECES  = \"assemble3\"   # BUILD_DEMO = False: root pieces with a \"name\" (piece0, piece1, ...)\nOBJ_PATTERN  = \"*rbd*\"       # DOP objects to import (\"*\" would also pull in the ground plane)\nSTRIP_SUFFIX = True          # sim names like piece0_12 -> piece0 (emission-frame suffix)\n\nSTART_FRAME  = None          # None = playbar start (sim start frame)\nLINK_TO_PLAYBAR = False      # True = expression to $RFSTART instead of a fixed number\n# ----------------------------------------------------------------------------\n\n\ndef current_network():\n    if TARGET:\n        n = hou.node(TARGET)\n        if n is None:\n            raise hou.Error(\"TARGET not found: %s\" % TARGET)\n        return n\n    ne = hou.ui.paneTabOfType(hou.paneTabType.NetworkEditor) if hou.isUIAvailable() else None\n    if ne is None:\n        raise hou.Error(\"No Network Editor found - open one, or set TARGET.\")\n    return ne.pwd()\n\n\ndef sop_network(net):\n    cat = net.childTypeCategory().name()\n    if cat == \"Sop\":\n        return net\n    if cat == \"Object\":\n        return net.createNode(\"geo\", \"rbd_root_copy\")\n    raise hou.Error(\"Open a Geometry (SOP) network or /obj - %s holds %s nodes.\" % (net.path(), cat))\n\n\ndef find(name, net):\n    n = net.node(name) or hou.node(name)\n    if n is None:\n        raise hou.Error(\"Node not found: %r (looked in %s and as a full path)\" % (name, net.path()))\n    return n\n\n\ndef set_start_frame(node):\n    \"\"\"Point a sim's start frame at the playbar start (or START_FRAME).\"\"\"\n    p = node.parm(\"startframe\")\n    if p is None:\n        return\n    if START_FRAME is None and LINK_TO_PLAYBAR:\n        p.setExpression(\"$RFSTART\")\n    else:\n        p.set(START_FRAME if START_FRAME is not None else hou.playbar.frameRange()[0])\n\n\nnet = sop_network(current_network())\nys = [c.position()[1] for c in net.children()]\ntop = (min(ys) - 2) if ys else 0          # build below whatever is already there\ncreated = []\n\n\ndef mk(parent, type_name, name, x, y):\n    n = parent.createNode(type_name, name)\n    n.setPosition(hou.Vector2(x, top + y))\n    created.append(n)\n    return n\n\n\ndef mk_dop(parent, type_name, name, x, y):\n    n = parent.createNode(type_name, name)\n    n.setPosition(hou.Vector2(x, y))\n    return n\n\n\nif BUILD_DEMO:\n    # --- root pieces: one box, three colours, packed and named piece0/1/2 -----\n    box = mk(net, \"box\", \"demo_box\", 0, 0)\n    box.parm(\"type\").set(1)                            # polygon mesh\n    for p in (\"divrate1\", \"divrate2\", \"divrate3\"):\n        box.parm(p).set(2)\n    cols = []\n    for i, rgb in enumerate(((0, 0, 1), (1, 0, 0), (0, 1, 0))):\n        c = mk(net, \"color\", \"demo_color%d\" % (i + 1), -3 + 3 * i, -1.2)\n        c.setInput(0, box)\n        c.parmTuple(\"color\").set(rgb)\n        cols.append(c)\n    mrg = mk(net, \"merge\", \"demo_merge\", 0, -2.4)\n    for i, c in enumerate(cols):\n        mrg.setInput(i, c)\n    root = mk(net, \"assemble\", \"ROOT_assemble\", 0, -3.6)\n    root.setInput(0, mrg)\n    root.parm(\"pack_geo\").set(1)                       # packed pieces named piece0, piece1, piece2\n\n    # --- emitter: 3 new points every frame, random pscale + N, named piece0..2 ---\n    grid = mk(net, \"grid\", \"demo_grid\", 7, 0)\n    sc = mk(net, \"scatter::2.0\", \"demo_scatter\", 7, -1.2)\n    sc.setInput(0, grid)\n    sc.parm(\"npts\").set(3)\n    sc.parm(\"seed\").setExpression(\"$FF\")               # new positions every frame\n    lift = mk(net, \"xform\", \"demo_lift\", 7, -2.4)\n    lift.setInput(0, sc)\n    lift.parm(\"ty\").set(4.8)\n    rs = mk(net, \"attribrandomize\", \"demo_rand_pscale\", 7, -3.6)\n    rs.setInput(0, lift)\n    rs.parm(\"name\").set(\"pscale\")\n    rs.parm(\"minx\").set(0.2)\n    rs.parm(\"seed\").setExpression(\"$F\")\n    rn = mk(net, \"attribrandomize\", \"demo_rand_N\", 7, -4.8)\n    rn.setInput(0, rs)\n    rn.parm(\"name\").set(\"N\")\n    rn.parm(\"seed\").setExpression(\"$F\")\n    nm = mk(net, \"attribwrangle\", \"demo_piece_name\", 7, -6)\n    nm.setInput(0, rn)\n    nm.parm(\"snippet\").set(\"s@name = 'piece' + itoa(@ptnum % 3);\")\n\n    cp_emit = mk(net, \"copytopoints::2.0\", \"demo_emit_copy\", 3.5, -7.2)\n    cp_emit.setInput(0, root)\n    cp_emit.setInput(1, nm)\n    cp_emit.parm(\"useidattrib\").set(1)                 # piece0 -> root piece0, ...\n    cp_emit.parm(\"targetattribs\").set(1)               # copy name (etc.) from the emit points\n    cp_emit.parm(\"applyattribs1\").set(\"*,^v,^Alpha,^N,^up,^pscale,^scale,^orient,^rot,^pivot,^trans,^transform\")\n    # the copies are already packed pieces; packing them again would nest them\n    fr = mk(net, \"attribwrangle\", \"demo_emit_frame_name\", 3.5, -9.6)\n    fr.setInput(0, cp_emit)\n    fr.parm(\"snippet\").set(\"s@name += '_' + itoa(@Frame);\")   # unique name per emitted piece\n\n    # --- Bullet RBD sim that adds the new pieces every frame -------------------\n    dop = mk(net, \"dopnet\", \"demo_rbd_dopnet\", 3.5, -10.8)\n    dop.setInput(0, fr)\n    set_start_frame(dop)\n    obj = mk_dop(dop, \"rbdpackedobject\", \"rbdpackedobject1\", 0, 0)\n    obj.parm(\"geosource\").set(1)                       # first context geometry\n    obj.parm(\"createframe\").setExpression(\"$F\")        # re-create -> adds this frame's pieces\n    sol = mk_dop(dop, \"bulletrbdsolver\", \"bulletrbdsolver1\", 0, -1)\n    sol.setInput(0, obj)\n    grav = mk_dop(dop, \"gravity\", \"gravity1\", 0, -2)\n    grav.setInput(0, sol)\n    ground = mk_dop(dop, \"groundplane\", \"groundplane1\", -3, -2)\n    dm = mk_dop(dop, \"merge\", \"merge1\", -1.5, -3)\n    dm.setInput(0, ground)\n    dm.setInput(1, grav)\n    dout = mk_dop(dop, \"output\", \"output\", -1.5, -4)\n    dout.setInput(0, dm)\n    dout.setDisplayFlag(True)\n    x0, y0 = 0, -12.5\nelse:\n    dop = find(DOPNET, net)\n    root = find(ROOT_PIECES, net)\n    x0, y0 = root.position()[0] - 0, root.position()[1] - top - 2\n\n# --- the root copy -----------------------------------------------------------\nif METHOD not in (\"packed\", \"points\", \"both\"):\n    raise hou.Error('METHOD must be \"packed\", \"points\" or \"both\" - got %r' % METHOD)\nSTRIP = ('s@name = re_replace(\"_[0-9]+$\", \"\", s@name);   // piece0_12 -> piece0\\n' if STRIP_SUFFIX else \"\")\n\nsrc = mk(net, \"unpack\", \"ROOT_pieces\", x0, y0)\nsrc.setInput(0, root)\nsrc.parm(\"transfer_attributes\").set(\"name\")\nouts = []\n\nif METHOD in (\"packed\", \"both\"):\n    # A) packed: read each simulated piece's full transform off its packed prim\n    imp = mk(net, \"dopimport::2.0\", \"ROOT_sim_pieces\", x0 + 4, y0)\n    imp.parm(\"doppath\").set(imp.relativePathTo(dop))\n    imp.parm(\"objpattern\").set(OBJ_PATTERN)          # default style = fetch packed geometry\n\n    tgt = mk(net, \"attribwrangle\", \"ROOT_targets\", x0 + 4, y0 - 1.2)\n    tgt.setInput(0, imp)\n    tgt.parm(\"snippet\").set(r'''\n// One target point per simulated piece, carrying that piece's WHOLE transform:\n// emission rotation + pscale + the sim's motion.\nint prim = pointprims(0, @ptnum)[0];\nmatrix M = primintrinsic(0, \"packedfulltransform\", prim);\n3@transform = matrix3(M);\nv@P = set(getcomp(M, 3, 0), getcomp(M, 3, 1), getcomp(M, 3, 2));\n''' + STRIP)\n\n    clean = mk(net, \"attribdelete\", \"ROOT_targets_clean\", x0 + 4, y0 - 2.4)\n    clean.setInput(0, tgt)\n    clean.parm(\"negate\").set(1)                      # keep only these point attributes\n    clean.parm(\"ptdel\").set(\"name transform v\")\n\n    pts = mk(net, \"add\", \"ROOT_points_only\", x0 + 4, y0 - 3.6)\n    pts.setInput(0, clean)\n    pts.parm(\"remove\").set(1)                        # drop the packed prims, keep the points\n\n    cp = mk(net, \"copytopoints::2.0\", \"ROOT_copy\", x0 + 2, y0 - 4.8)\n    cp.setInput(0, src)\n    cp.setInput(1, pts)\n    cp.parm(\"useidattrib\").set(1)                    # Piece Attribute = name\n    out = mk(net, \"null\", \"OUT_root_copy\", x0 + 2, y0 - 6)\n    out.setInput(0, cp)\n    outs.append(out)\n\nif METHOD in (\"points\", \"both\"):\n    # B) points: one point per piece straight from the sim, no geometry imported\n    pimp = mk(net, \"dopimport::2.0\", \"ROOT_sim_points\", x0 - 4, y0)\n    pimp.parm(\"doppath\").set(pimp.relativePathTo(dop))\n    pimp.parm(\"objpattern\").set(OBJ_PATTERN)\n    pimp.parm(\"importstyle\").set(1)                  # Create Points to Represent Objects\n    pimp.parm(\"transferattributes\").set(\"orient pivot restxform name v\")\n\n    ptgt = mk(net, \"attribwrangle\", \"ROOT_point_targets\", x0 - 4, y0 - 1.2)\n    ptgt.setInput(0, pimp)\n    ptgt.parm(\"snippet\").set(r'''\n// Rebuild each piece's full transform from the sim point alone:\n//   restxform = emission rotation + pscale (3x3) and the rest position (row 3)\n//   world     = (rest - pivot) * orient + P\nmatrix  X  = 4@restxform;\nmatrix3 A  = matrix3(X);\nvector  rp = set(getcomp(X, 3, 0), getcomp(X, 3, 1), getcomp(X, 3, 2));\nmatrix3 R  = qconvert(p@orient);\n3@transform = A * R;\nv@P = (rp - v@pivot) * R + v@P;\n''' + STRIP)\n\n    pclean = mk(net, \"attribdelete\", \"ROOT_point_targets_clean\", x0 - 4, y0 - 2.4)\n    pclean.setInput(0, ptgt)\n    pclean.parm(\"negate\").set(1)                     # orient/pivot must go, transform wins\n    pclean.parm(\"ptdel\").set(\"name transform v\")\n\n    pcp = mk(net, \"copytopoints::2.0\", \"ROOT_copy_points\", x0 - 2, y0 - 4.8)\n    pcp.setInput(0, src)\n    pcp.setInput(1, pclean)\n    pcp.parm(\"useidattrib\").set(1)\n    pout = mk(net, \"null\", \"OUT_root_copy_points\", x0 - 2, y0 - 6)\n    pout.setInput(0, pcp)\n    outs.append(pout)\n\nouts[-1].setDisplayFlag(True)\nouts[-1].setRenderFlag(True)\nprint(\"RBD root copy (%s) built in %s (%d nodes) -> %s\" % (METHOD, net.path(), len(created), \", \".join(o.name() for o in outs)))\n", "visual": ""}, {"id": "rbd-root-targets-vex", "title": "ROOT_targets: full transform per piece", "lang": "vex", "context": "Attribute Wrangle · Points", "tested": "Houdini 21.0.671", "filename": "rbd_root_targets.vfl", "description": "ต่อหลัง DOP Import แบบ Fetch Packed Geometry ได้ target หนึ่ง point ต่อชิ้น มี 3@transform กับ P ตรงกับชิ้นในซิม แล้ว Copy to Points ชิ้น root (Piece Attribute = name)", "notes": "ต่อจากนี้: Attribute Delete (Delete Non Selected: name transform v) → Add (Delete Geometry But Keep the Points)\nต้องลบ orient / pivot / pscale / N ทิ้ง ไม่งั้นจะไปแย่ง transform", "code": "// One target point per simulated piece, carrying that piece's WHOLE transform:\n// emission rotation + pscale + the sim's motion.\nint prim = pointprims(0, @ptnum)[0];\nmatrix M = primintrinsic(0, \"packedfulltransform\", prim);\n3@transform = matrix3(M);\nv@P = set(getcomp(M, 3, 0), getcomp(M, 3, 1), getcomp(M, 3, 2));\ns@name = re_replace(\"_[0-9]+$\", \"\", s@name);   // piece0_12 -> piece0 (drop if names already match)\n", "visual": ""}, {"id": "rbd-point-targets-vex", "title": "ROOT_point_targets: points-only import", "lang": "vex", "context": "Attribute Wrangle · Points", "tested": "Houdini 21.0.671", "filename": "rbd_point_targets.vfl", "description": "วิธีที่สอง: ต่อหลัง DOP Import แบบ Create Points to Represent Objects ได้ 3@transform กับ P ของแต่ละชิ้นจาก point ของซิมอย่างเดียว ไม่ต้อง import geometry", "notes": "DOP Import ต้องใส่ Transfer Attributes = orient pivot restxform name v (restxform สำคัญที่สุด ถ้าไม่มีจะได้ชิ้นที่ไม่หมุนตอน emit และไม่มี pscale)\nต่อจากนี้: Attribute Delete (Delete Non Selected: name transform v) แล้วเข้า Copy to Points ได้เลย ไม่ต้องใช้ Add SOP เพราะไม่มี prim ติดมา", "code": "// Points-only method: DOP Import set to \"Create Points to Represent Objects\",\n// Transfer Attributes = orient pivot restxform name v\n// One point per piece -> rebuild that piece's WHOLE transform from the sim point:\n//   restxform = emission rotation + pscale (3x3) and the rest position (row 3)\n//   world     = (rest - pivot) * orient + P\nmatrix  X  = 4@restxform;\nmatrix3 A  = matrix3(X);\nvector  rp = set(getcomp(X, 3, 0), getcomp(X, 3, 1), getcomp(X, 3, 2));\nmatrix3 R  = qconvert(p@orient);\n3@transform = A * R;\nv@P = (rp - v@pivot) * R + v@P;\ns@name = re_replace(\"_[0-9]+$\", \"\", s@name);   // piece0_12 -> piece0 (drop if names already match)\n", "visual": ""}, {"id": "rbd-back-to-rest-vex", "title": "back_to_rest_pose: final-frame pieces → rest", "lang": "vex", "context": "Attribute Wrangle · Points", "tested": "Houdini 21.0.671", "filename": "back_to_rest_pose.vfl", "description": "อีกทางหนึ่ง ถ้าอยาก copy ชิ้นที่ fetch มาจากซิม (เช่นเฟรมสุดท้าย) แทนชิ้น root: ถอยการหมุนและการเลื่อนของซิมออก ให้ชิ้นกลับไปอยู่ตรงจุดที่ emit แล้วใช้ orient / pivot / P ของ RBD points ตามปกติ", "notes": "วัดแล้วตรงกับซิม max_err 0.00000 ที่เฟรม 5, 15, 25, 36 · Timeshift ของสอง input ต้องเป็นเฟรมเดียวกัน", "code": "// Alternative: put the FINAL-frame packed pieces back into their REST pose, then\n// Copy to Points re-applies the sim per frame:  world = (rest - pivot) * orient + P\n// input 0 = packed pieces fetched at the rest frame (Timeshift of a Fetch-Packed DOP Import)\n// input 1 = RBD points (DOP Import, Create Points) timeshifted to the SAME frame\nint pt = findattribval(1, \"point\", \"name\", s@name);\nif (pt \u003c 0) { removepoint(0, @ptnum); return; }\nvector4 qi = qinvert(point(1, \"orient\", pt));\nvector  P1 = point(1, \"P\", pt);\nvector  pv = point(1, \"pivot\", pt);\nint prim = pointprims(0, @ptnum)[0];\nmatrix3 T = primintrinsic(0, \"transform\", prim);\nsetprimintrinsic(0, \"transform\", prim, T * qconvert(qi));   // remove the sim's rotation\nv@P = qrotate(qi, v@P - P1) + pv;                           // move back to where it was emitted\n", "visual": ""}, {"id": "measure-orient-diff-vex", "title": "Measure orient difference between two copies", "lang": "vex", "context": "Attribute Wrangle · Detail", "tested": "Houdini 21.0.671", "filename": "measure_orient_diff.vfl", "description": "เช็คว่า geo สองชุด (ชิ้นเดียวกัน) หมุนต่างกันกี่องศา รอบแกนไหน เลื่อนไปเท่าไหร่ โดยวัดจากตำแหน่ง point จริง ไม่ต้องพึ่ง attribute orient", "notes": "อ่านผล: angle ≈ 0 แต่ offset ไม่ 0 = ปัญหา pivot · angle ≈ 180 = แกนกลับด้าน · fit_rms สูง = shape ต่างด้วย (scale หรือลำดับ point ไม่ตรง)\nทางไม่ต้องเขียนโค้ด: Extract Transform SOP (input 1 = ตัวถูก, input 2 = ตัวที่เช็ค)", "code": "// Measure how two copies of the SAME geometry differ (same point count + order).\n// Detail Wrangle: input 0 = the copy you are checking, input 1 = the reference.\nint n = npoints(0);\nif (n != npoints(1)) { warning(\"point count differs: %d vs %d\", n, npoints(1)); return; }\n\nvector c0 = 0, c1 = 0;\nfor (int i = 0; i \u003c n; i++) { c0 += point(0, \"P\", i); c1 += point(1, \"P\", i); }\nc0 /= n; c1 /= n;\n\nmatrix3 H = 0;\nfor (int i = 0; i \u003c n; i++)\n    H += outerproduct(point(1, \"P\", i) - c1, point(0, \"P\", i) - c0);\nmatrix3 M = polardecomp(H);                 // pure rotation part\nif (determinant(M) \u003c 0) warning(\"mirror, not a rotation: flipped or negative scale\");\n\nvector4 q = quaternion(M);\nfloat err = 0;\nfor (int i = 0; i \u003c n; i++)\n    err += length2((point(1, \"P\", i) - c1) * M - (point(0, \"P\", i) - c0));\n\np@diff_orient    = q;\nf@diff_angle_deg = degrees(2 * acos(clamp(abs(q.w), 0, 1)));\nv@diff_axis      = normalize(set(q.x, q.y, q.z));\nv@diff_offset    = c0 - c1;\nf@fit_rms        = sqrt(err / n);           // ~0 = only a rigid rotation apart\n", "visual": ""}]}, {"v": "v004", "date": "2026-09-26", "previewImage": "", "previewVisual": "", "notes": "v004: เพิ่มเวอร์ชัน LOP / Solaris (USD PointInstancer)\n• builder มี ADD_LOP = True (default) สร้าง LOP_instancing ต่อจาก target points ให้เลย\n• มีสคริปต์แยก add_lop_instancer.py สำหรับต่อ LOP เข้ากับ setup ที่มีอยู่แล้ว (ตั้ง TARGETS_NODE กับ ROOT_NODE)\n\nสองจุดที่ทำให้ instance ผิดถ้าปล่อยค่า default:\n1) Prototype Primitives = ทั้ง sopimport (เช่น /sopimport1) → ทุก instance ได้ทุกชิ้นซ้อนกัน ต้องเป็น /\u003csopimport>/* ให้แต่ละชิ้นเป็น prototype ของตัวเอง และ Prototype Index = Name Attribute (name) ให้ point ชื่อ piece3 ได้ prototype piece3\n2) LOP Import ที่ใช้ %type:Boundable & %visible จะดึง prototype mesh ที่ซ่อนอยู่มาด้วย ให้ import แค่ /instancer1\nและ Unpack USD ต้องตั้ง Iterations = 2 (instancer → instances → mesh) ไม่งั้นได้ point เดียวต่อ instance\n\nInstancer อ่าน 3@transform เองได้ แปลงเป็น orientation + scale ให้ ไม่ต้องแปลงก่อน\nวัดผลแล้ว: LOP ตรงกับ Copy to Points ≤ 0.0007 ทุกเฟรมที่เช็ค (ส่วนต่างนี้มาจาก USD เก็บ orientations เป็น half precision) ทั้ง demo ในฉากว่าง และไฟล์ emittingRBD_root ที่ใช้ชิ้น fracture 25 ชิ้นเป็น root\n\nv003: เพิ่มวิธีที่สอง import มาแค่ point (DOP Import → Create Points to Represent Objects)\n• ไม่ต้องดึง geometry ออกจากซิมเลย เบากว่า ใช้แค่ point ละชิ้น\n• ใช้ restxform ที่ Bullet เก็บไว้บน point (การหมุน + pscale ตอน emit และตำแหน่ง rest) + pivot + orient + P สร้าง transform เต็มกลับมา: world = (rest - pivot) × orient + P\n• ต้องใส่ restxform ใน Transfer Attributes ของ DOP Import (สคริปต์ใส่ให้แล้ว: orient pivot restxform name v)\n• METHOD = \"both\" (default) สร้างทั้งสองวิธีคู่กัน · \"points\" หรือ \"packed\" เลือกอันเดียว\n\nวัดผลแล้ว: ทั้งสองวิธีตรงกับซิม max_err ≤ 0.000001 ทุก point ที่เฟรม 1, 12, 30, 48 ทั้ง demo ในฉากว่างและไฟล์ emittingRBD\n\nv002: paste แล้วสร้างทั้งฉากใหม่หมด แบบเดียวกับ FX Template\n• BUILD_DEMO = True (default): สร้างชิ้น root 3 สี, emitter ที่ปล่อยชิ้นใหม่ทุกเฟรม (pscale + N สุ่ม), Bullet RBD dopnet และ chain copy-from-root ครบในตัว\n• เปิด /obj แล้วรัน = สร้าง geo ใหม่ชื่อ rbd_root_copy · เปิด Geometry network แล้วรัน = สร้างตรงนั้น ต่อลงไปใต้ node เดิม\n• Start frame ของ dopnet = start ของ playbar (START_FRAME / LINK_TO_PLAYBAR ปรับได้)\n• BUILD_DEMO = False: ต่อแค่ chain เข้าซิมของพี่ ตั้ง DOPNET กับ ROOT_PIECES\n• OBJ_PATTERN default เป็น *rbd* เพราะ * จะดึง ground plane มาด้วย\n\nวัดผลแล้ว: demo ที่สร้างจากศูนย์ในฉากว่าง และไฟล์ emittingRBD ตรงกับซิม max_err 0.000000 ทุก point ที่เฟรม 1, 12, 30, 48\nรันซ้ำใน network เดิมได้ ไม่ชนกัน\n\nปัญหา: เอาชิ้นจาก RBD sim มา Copy to Points แล้วชิ้นหมุนเพี้ยนและเลื่อนผิดที่ เพราะชิ้นต้นแบบที่ใช้ copy ไม่ได้อยู่ในท่า rest (ใช้ชิ้นที่ซิมเสร็จแล้วที่เฟรมสุดท้าย) orient เลยหมุนซ้ำทับ และ pivot จากซิมเป็นตำแหน่ง world ตอน emit\n\nวิธีหลัก: copy ชิ้น ROOT (ต้นฉบับจาก assemble) ด้วย packedfulltransform ของแต่ละชิ้นในซิม ซึ่งรวมการหมุนตอน emit + pscale + การเคลื่อนที่ของซิมไว้หมดแล้ว เปลี่ยน geo ต้นฉบับ (hi-res / โมเดลอื่น) ได้โดยไม่ต้องซิมใหม่\n\nวัดผลกับ emittingRBD.hipnc: ตรงกับซิมจริง max_err 0.000000 ทุก point ที่เฟรม 3, 12, 20, 25, 38\nทดสอบกับ H21.0.671", "files": [{"id": "rbd-root-builder", "title": "Builder: whole setup + root copy + LOP instancer", "lang": "python", "context": "Python Shell", "tested": "Houdini 21.0.671 · empty scene + emittingRBD_root", "filename": "build_rbd_root_copy_v4.py", "description": "paste ใน Python Shell แล้วสร้างทุกอย่างใหม่หมด: ชิ้น root → emitter → RBD dopnet → Copy to Points (packed / points) → LOP_instancing (USD PointInstancer) พร้อม LOP_check_unpackusd ไว้เทียบผล", "notes": "ชิ้นที่ emit เป็น packed อยู่แล้วหลัง Copy to Points ห้าม Assemble ซ้ำ ไม่งั้นชิ้นจะซ้อน packed สองชั้น แล้ว packedfulltransform จะชี้ไปที่ชั้นนอก\nชิ้นต้นฉบับต้องมี name ตรงกับชื่อชิ้นในซิม ถ้าซิมตั้งชื่อ piece0_12 (เติมเฟรมตอน emit) STRIP_SUFFIX = True จะตัด _12 ออกให้เป็น piece0\nใช้ได้เพราะ packed prim ในซิมเก็บ geo ต้นฉบับตัวเดียวกันไว้ข้างใน ต่างกันแค่ transform", "code": "# ============================================================================\n# RBD pieces -> copy the ROOT geometry   v004   (paste into Houdini Python Shell)\n#\n# Re-creates every simulated RBD piece by copying the ORIGINAL (root) piece with\n# that piece's full transform (emission rotation + pscale + sim motion).\n# Exact match with the sim, and the root geometry can be swapped (hi-res, a\n# different model, extra attributes) without re-simulating.\n#\n# Two ways to read the sim (METHOD):\n#   \"packed\" -> DOP Import \"Fetch Geometry\": packedfulltransform of each piece\n#   \"points\" -> DOP Import \"Create Points to Represent Objects\": one point per\n#               piece, rebuilt from restxform (emission transform) + pivot +\n#               orient + P. Lighter: no geometry comes out of the sim.\n#   \"both\"   -> builds both side by side (display flag on the points one).\n#\n# ADD_LOP = True also builds the Solaris version: a LOP network with the root\n# pieces as prototypes (one prototype per piece, picked by the point's name) and\n# a USD PointInstancer driven by the same target points.\n#\n# HOW TO USE\n#   1. Open a network in the Network Editor:\n#        - a Geometry (SOP) network -> everything is built right there\n#        - /obj                     -> a new \"rbd_root_copy\" geo is created for it\n#   2. Paste the whole thing into Windows > Python Shell and press Enter.\n#\n#   BUILD_DEMO = True  -> builds the WHOLE setup: 3 coloured root pieces, a\n#                         scatter emitter that births pieces every frame, the\n#                         Bullet RBD dopnet, and the root-copy chain on top.\n#   BUILD_DEMO = False -> only adds the root-copy chain to YOUR sim: set DOPNET\n#                         and ROOT_PIECES (names in the open network or full paths).\n#   Existing nodes are never changed.\n# ============================================================================\n\nimport hou\n\n# ----------------------------- CONFIG ---------------------------------------\nBUILD_DEMO   = True\nTARGET       = \"\"            # \"\" = the network the Network Editor is showing; or a path\nMETHOD       = \"both\"        # \"packed\" | \"points\" | \"both\"\nADD_LOP      = True          # also build the Solaris / USD PointInstancer version\n\nDOPNET       = \"dopnet1\"     # BUILD_DEMO = False: your RBD dopnet\nROOT_PIECES  = \"assemble3\"   # BUILD_DEMO = False: root pieces with a \"name\" (piece0, piece1, ...)\nOBJ_PATTERN  = \"*rbd*\"       # DOP objects to import (\"*\" would also pull in the ground plane)\nSTRIP_SUFFIX = True          # sim names like piece0_12 -> piece0 (emission-frame suffix)\n\nSTART_FRAME  = None          # None = playbar start (sim start frame)\nLINK_TO_PLAYBAR = False      # True = expression to $RFSTART instead of a fixed number\n# ----------------------------------------------------------------------------\n\n\ndef current_network():\n    if TARGET:\n        n = hou.node(TARGET)\n        if n is None:\n            raise hou.Error(\"TARGET not found: %s\" % TARGET)\n        return n\n    ne = hou.ui.paneTabOfType(hou.paneTabType.NetworkEditor) if hou.isUIAvailable() else None\n    if ne is None:\n        raise hou.Error(\"No Network Editor found - open one, or set TARGET.\")\n    return ne.pwd()\n\n\ndef sop_network(net):\n    cat = net.childTypeCategory().name()\n    if cat == \"Sop\":\n        return net\n    if cat == \"Object\":\n        return net.createNode(\"geo\", \"rbd_root_copy\")\n    raise hou.Error(\"Open a Geometry (SOP) network or /obj - %s holds %s nodes.\" % (net.path(), cat))\n\n\ndef find(name, net):\n    n = net.node(name) or hou.node(name)\n    if n is None:\n        raise hou.Error(\"Node not found: %r (looked in %s and as a full path)\" % (name, net.path()))\n    return n\n\n\ndef set_start_frame(node):\n    \"\"\"Point a sim's start frame at the playbar start (or START_FRAME).\"\"\"\n    p = node.parm(\"startframe\")\n    if p is None:\n        return\n    if START_FRAME is None and LINK_TO_PLAYBAR:\n        p.setExpression(\"$RFSTART\")\n    else:\n        p.set(START_FRAME if START_FRAME is not None else hou.playbar.frameRange()[0])\n\n\nnet = sop_network(current_network())\nys = [c.position()[1] for c in net.children()]\ntop = (min(ys) - 2) if ys else 0          # build below whatever is already there\ncreated = []\n\n\ndef mk(parent, type_name, name, x, y):\n    n = parent.createNode(type_name, name)\n    n.setPosition(hou.Vector2(x, top + y))\n    created.append(n)\n    return n\n\n\ndef mk_dop(parent, type_name, name, x, y):\n    n = parent.createNode(type_name, name)\n    n.setPosition(hou.Vector2(x, y))\n    return n\n\n\nif BUILD_DEMO:\n    # --- root pieces: one box, three colours, packed and named piece0/1/2 -----\n    box = mk(net, \"box\", \"demo_box\", 0, 0)\n    box.parm(\"type\").set(1)                            # polygon mesh\n    for p in (\"divrate1\", \"divrate2\", \"divrate3\"):\n        box.parm(p).set(2)\n    cols = []\n    for i, rgb in enumerate(((0, 0, 1), (1, 0, 0), (0, 1, 0))):\n        c = mk(net, \"color\", \"demo_color%d\" % (i + 1), -3 + 3 * i, -1.2)\n        c.setInput(0, box)\n        c.parmTuple(\"color\").set(rgb)\n        cols.append(c)\n    mrg = mk(net, \"merge\", \"demo_merge\", 0, -2.4)\n    for i, c in enumerate(cols):\n        mrg.setInput(i, c)\n    root = mk(net, \"assemble\", \"ROOT_assemble\", 0, -3.6)\n    root.setInput(0, mrg)\n    root.parm(\"pack_geo\").set(1)                       # packed pieces named piece0, piece1, piece2\n\n    # --- emitter: 3 new points every frame, random pscale + N, named piece0..2 ---\n    grid = mk(net, \"grid\", \"demo_grid\", 7, 0)\n    sc = mk(net, \"scatter::2.0\", \"demo_scatter\", 7, -1.2)\n    sc.setInput(0, grid)\n    sc.parm(\"npts\").set(3)\n    sc.parm(\"seed\").setExpression(\"$FF\")               # new positions every frame\n    lift = mk(net, \"xform\", \"demo_lift\", 7, -2.4)\n    lift.setInput(0, sc)\n    lift.parm(\"ty\").set(4.8)\n    rs = mk(net, \"attribrandomize\", \"demo_rand_pscale\", 7, -3.6)\n    rs.setInput(0, lift)\n    rs.parm(\"name\").set(\"pscale\")\n    rs.parm(\"minx\").set(0.2)\n    rs.parm(\"seed\").setExpression(\"$F\")\n    rn = mk(net, \"attribrandomize\", \"demo_rand_N\", 7, -4.8)\n    rn.setInput(0, rs)\n    rn.parm(\"name\").set(\"N\")\n    rn.parm(\"seed\").setExpression(\"$F\")\n    nm = mk(net, \"attribwrangle\", \"demo_piece_name\", 7, -6)\n    nm.setInput(0, rn)\n    nm.parm(\"snippet\").set(\"s@name = 'piece' + itoa(@ptnum % 3);\")\n\n    cp_emit = mk(net, \"copytopoints::2.0\", \"demo_emit_copy\", 3.5, -7.2)\n    cp_emit.setInput(0, root)\n    cp_emit.setInput(1, nm)\n    cp_emit.parm(\"useidattrib\").set(1)                 # piece0 -> root piece0, ...\n    cp_emit.parm(\"targetattribs\").set(1)               # copy name (etc.) from the emit points\n    cp_emit.parm(\"applyattribs1\").set(\"*,^v,^Alpha,^N,^up,^pscale,^scale,^orient,^rot,^pivot,^trans,^transform\")\n    # the copies are already packed pieces; packing them again would nest them\n    fr = mk(net, \"attribwrangle\", \"demo_emit_frame_name\", 3.5, -9.6)\n    fr.setInput(0, cp_emit)\n    fr.parm(\"snippet\").set(\"s@name += '_' + itoa(@Frame);\")   # unique name per emitted piece\n\n    # --- Bullet RBD sim that adds the new pieces every frame -------------------\n    dop = mk(net, \"dopnet\", \"demo_rbd_dopnet\", 3.5, -10.8)\n    dop.setInput(0, fr)\n    set_start_frame(dop)\n    obj = mk_dop(dop, \"rbdpackedobject\", \"rbdpackedobject1\", 0, 0)\n    obj.parm(\"geosource\").set(1)                       # first context geometry\n    obj.parm(\"createframe\").setExpression(\"$F\")        # re-create -> adds this frame's pieces\n    sol = mk_dop(dop, \"bulletrbdsolver\", \"bulletrbdsolver1\", 0, -1)\n    sol.setInput(0, obj)\n    grav = mk_dop(dop, \"gravity\", \"gravity1\", 0, -2)\n    grav.setInput(0, sol)\n    ground = mk_dop(dop, \"groundplane\", \"groundplane1\", -3, -2)\n    dm = mk_dop(dop, \"merge\", \"merge1\", -1.5, -3)\n    dm.setInput(0, ground)\n    dm.setInput(1, grav)\n    dout = mk_dop(dop, \"output\", \"output\", -1.5, -4)\n    dout.setInput(0, dm)\n    dout.setDisplayFlag(True)\n    x0, y0 = 0, -12.5\nelse:\n    dop = find(DOPNET, net)\n    root = find(ROOT_PIECES, net)\n    x0, y0 = root.position()[0] - 0, root.position()[1] - top - 2\n\n# --- LOP / Solaris: the same copy as a USD PointInstancer ---------------------\ndef build_lop(net, targets, root, x, y, tag=\"\"):\n    \"\"\"targets: SOP points with name + transform (or orient/pscale).\n    root: SOP root pieces, each with a name. Returns the SOP node that unpacks\n    the instancer back to geometry (for checking against the Copy to Points).\"\"\"\n    t_out = net.createNode(\"null\", \"LOP_targets\" + tag)\n    t_out.setInput(0, targets)\n    t_out.setPosition(hou.Vector2(x, y))\n    p_out = net.createNode(\"null\", \"LOP_prototypes\" + tag)\n    p_out.setInput(0, root)\n    p_out.setPosition(hou.Vector2(x + 3, y))\n\n    lop = net.createNode(\"lopnet\", \"LOP_instancing\" + tag)\n    lop.setPosition(hou.Vector2(x + 1.5, y - 1.2))\n    si = lop.createNode(\"sopimport\", \"root_pieces\")          # prims: /root_pieces/piece0, ...\n    si.parm(\"soppath\").set(si.relativePathTo(p_out))\n    si.setPosition(hou.Vector2(3, 0))\n    inst = lop.createNode(\"instancer\", \"instancer1\")         # prim: /instancer1\n    inst.setInput(1, si)                                     # prototypes come in the 2nd input\n    inst.setPosition(hou.Vector2(0, -1.5))\n    inst.parm(\"method\").set(\"pointinstancer\")\n    inst.parm(\"transformsourcemode\").set(\"extsop\")           # target points from a SOP\n    inst.parm(\"pointsoppath\").set(inst.relativePathTo(t_out))\n    inst.parm(\"protosourcemode\").set(\"second\")\n    inst.parm(\"protopattern\").set(\"/root_pieces/*\")          # EVERY piece is its own prototype\n    inst.parm(\"protoindexsrc\").set(\"nameattr\")               # point name picks the prototype\n    inst.parm(\"nameattr\").set(\"name\")\n    out = lop.createNode(\"null\", \"OUT_instances\")\n    out.setInput(0, inst)\n    out.setPosition(hou.Vector2(0, -3))\n    out.setDisplayFlag(True)\n\n    # back to SOPs, only to check the result (import the instancer prim ONLY -\n    # a Boundable pattern would also pull in the hidden prototype meshes)\n    li = net.createNode(\"lopimport::2.0\", \"LOP_check_import\" + tag)\n    li.parm(\"loppath\").set(li.relativePathTo(out))\n    li.parm(\"primpattern\").set(\"/instancer1\")\n    li.setPosition(hou.Vector2(x + 1.5, y - 2.4))\n    uu = net.createNode(\"unpackusd::2.0\", \"LOP_check_unpackusd\" + tag)\n    uu.setInput(0, li)\n    uu.parm(\"output\").set(\"polygons\")\n    uu.parm(\"iterations\").set(2)                             # instancer -> instances -> meshes\n    uu.setPosition(hou.Vector2(x + 1.5, y - 3.6))\n    return [t_out, p_out, lop, li, uu], uu\n\n\n# --- the root copy -----------------------------------------------------------\nif METHOD not in (\"packed\", \"points\", \"both\"):\n    raise hou.Error('METHOD must be \"packed\", \"points\" or \"both\" - got %r' % METHOD)\nSTRIP = ('s@name = re_replace(\"_[0-9]+$\", \"\", s@name);   // piece0_12 -> piece0\\n' if STRIP_SUFFIX else \"\")\n\nsrc = mk(net, \"unpack\", \"ROOT_pieces\", x0, y0)\nsrc.setInput(0, root)\nsrc.parm(\"transfer_attributes\").set(\"name\")\nouts = []\n\nif METHOD in (\"packed\", \"both\"):\n    # A) packed: read each simulated piece's full transform off its packed prim\n    imp = mk(net, \"dopimport::2.0\", \"ROOT_sim_pieces\", x0 + 4, y0)\n    imp.parm(\"doppath\").set(imp.relativePathTo(dop))\n    imp.parm(\"objpattern\").set(OBJ_PATTERN)          # default style = fetch packed geometry\n\n    tgt = mk(net, \"attribwrangle\", \"ROOT_targets\", x0 + 4, y0 - 1.2)\n    tgt.setInput(0, imp)\n    tgt.parm(\"snippet\").set(r'''\n// One target point per simulated piece, carrying that piece's WHOLE transform:\n// emission rotation + pscale + the sim's motion.\nint prim = pointprims(0, @ptnum)[0];\nmatrix M = primintrinsic(0, \"packedfulltransform\", prim);\n3@transform = matrix3(M);\nv@P = set(getcomp(M, 3, 0), getcomp(M, 3, 1), getcomp(M, 3, 2));\n''' + STRIP)\n\n    clean = mk(net, \"attribdelete\", \"ROOT_targets_clean\", x0 + 4, y0 - 2.4)\n    clean.setInput(0, tgt)\n    clean.parm(\"negate\").set(1)                      # keep only these point attributes\n    clean.parm(\"ptdel\").set(\"name transform v\")\n\n    pts = mk(net, \"add\", \"ROOT_points_only\", x0 + 4, y0 - 3.6)\n    pts.setInput(0, clean)\n    pts.parm(\"remove\").set(1)                        # drop the packed prims, keep the points\n\n    cp = mk(net, \"copytopoints::2.0\", \"ROOT_copy\", x0 + 2, y0 - 4.8)\n    cp.setInput(0, src)\n    cp.setInput(1, pts)\n    cp.parm(\"useidattrib\").set(1)                    # Piece Attribute = name\n    out = mk(net, \"null\", \"OUT_root_copy\", x0 + 2, y0 - 6)\n    out.setInput(0, cp)\n    outs.append(out)\n\nif METHOD in (\"points\", \"both\"):\n    # B) points: one point per piece straight from the sim, no geometry imported\n    pimp = mk(net, \"dopimport::2.0\", \"ROOT_sim_points\", x0 - 4, y0)\n    pimp.parm(\"doppath\").set(pimp.relativePathTo(dop))\n    pimp.parm(\"objpattern\").set(OBJ_PATTERN)\n    pimp.parm(\"importstyle\").set(1)                  # Create Points to Represent Objects\n    pimp.parm(\"transferattributes\").set(\"orient pivot restxform name v\")\n\n    ptgt = mk(net, \"attribwrangle\", \"ROOT_point_targets\", x0 - 4, y0 - 1.2)\n    ptgt.setInput(0, pimp)\n    ptgt.parm(\"snippet\").set(r'''\n// Rebuild each piece's full transform from the sim point alone:\n//   restxform = emission rotation + pscale (3x3) and the rest position (row 3)\n//   world     = (rest - pivot) * orient + P\nmatrix  X  = 4@restxform;\nmatrix3 A  = matrix3(X);\nvector  rp = set(getcomp(X, 3, 0), getcomp(X, 3, 1), getcomp(X, 3, 2));\nmatrix3 R  = qconvert(p@orient);\n3@transform = A * R;\nv@P = (rp - v@pivot) * R + v@P;\n''' + STRIP)\n\n    pclean = mk(net, \"attribdelete\", \"ROOT_point_targets_clean\", x0 - 4, y0 - 2.4)\n    pclean.setInput(0, ptgt)\n    pclean.parm(\"negate\").set(1)                     # orient/pivot must go, transform wins\n    pclean.parm(\"ptdel\").set(\"name transform v\")\n\n    pcp = mk(net, \"copytopoints::2.0\", \"ROOT_copy_points\", x0 - 2, y0 - 4.8)\n    pcp.setInput(0, src)\n    pcp.setInput(1, pclean)\n    pcp.parm(\"useidattrib\").set(1)\n    pout = mk(net, \"null\", \"OUT_root_copy_points\", x0 - 2, y0 - 6)\n    pout.setInput(0, pcp)\n    outs.append(pout)\n\nouts[-1].setDisplayFlag(True)\nouts[-1].setRenderFlag(True)\nprint(\"RBD root copy (%s) built in %s (%d nodes) -> %s\" % (METHOD, net.path(), len(created), \", \".join(o.name() for o in outs)))\n\nif ADD_LOP:\n    lop_targets = pclean if METHOD in (\"points\", \"both\") else pts\n    nodes, lop_check = build_lop(net, lop_targets, src, x0 - 10, y0)\n    created += nodes\n    print(\"LOP instancing built -> %s (unpacked check: %s)\" % (nodes[2].path(), lop_check.name()))\n", "visual": ""}, {"id": "add-lop-instancer", "title": "Add the LOP PointInstancer to an existing setup", "lang": "python", "context": "Python Shell", "tested": "Houdini 21.0.671 · emittingRBD_root", "filename": "add_lop_instancer.py", "description": "ต่อเวอร์ชัน LOP เข้ากับ SOP ที่มีอยู่แล้ว: ต้องมี target points (name + transform หรือ orient/pscale) กับชิ้น root ที่มี name ตั้ง TARGETS_NODE / ROOT_NODE แล้วรัน", "notes": "สร้าง LOP_targets, LOP_prototypes (null), LOP_instancing (sopimport root_pieces → instancer1 → OUT_instances) และ LOP_check_import → LOP_check_unpackusd กลับมาใน SOP ไว้เช็ค\nใช้ได้กับ Copy to Points ทั่วไปด้วย ไม่จำกัดแค่ RBD", "code": "# ============================================================================\n# Copy pieces as a USD PointInstancer in LOPs   (paste into Houdini Python Shell)\n#\n# Takes the target points of a Copy to Points (each point: name + transform, or\n# orient/pscale) and the root pieces (each with a name) and builds the Solaris\n# version: a LOP network with ONE prototype per piece, picked by the point's\n# name, plus a LOP Import -> Unpack USD back in SOPs to check the result.\n#\n# The two things that make it wrong if left at their defaults:\n#   - Prototype Primitives = the whole SOP import  -> every instance gets ALL\n#     pieces. It must be /\u003csopimport>/* so each piece is its own prototype,\n#     and Prototype Index = Name Attribute so a point named piece3 gets piece3.\n#   - LOP Import pattern %type:Boundable also matches the hidden prototype\n#     meshes. Import the instancer prim only.\n#\n# HOW TO USE\n#   1. Open the Geometry network that holds the two SOP nodes (or set TARGET).\n#   2. Set TARGETS_NODE and ROOT_NODE below, paste into Windows > Python Shell.\n#   New nodes are created (LOP_*); existing nodes are not changed.\n# ============================================================================\n\nimport hou\n\n# ----------------------------- CONFIG ---------------------------------------\nTARGET       = \"\"                           # \"\" = the network the Network Editor is showing\nTARGETS_NODE = \"ROOT_point_targets_clean\"   # points: name + transform (e.g. from the RBD root copy)\nROOT_NODE    = \"ROOT_pieces\"                # root pieces, each with a name\n# ----------------------------------------------------------------------------\n\n\ndef current_network():\n    if TARGET:\n        n = hou.node(TARGET)\n        if n is None:\n            raise hou.Error(\"TARGET not found: %s\" % TARGET)\n        return n\n    ne = hou.ui.paneTabOfType(hou.paneTabType.NetworkEditor) if hou.isUIAvailable() else None\n    if ne is None:\n        raise hou.Error(\"No Network Editor found - open one, or set TARGET.\")\n    return ne.pwd()\n\n\ndef find(name, net):\n    n = net.node(name) or hou.node(name)\n    if n is None:\n        raise hou.Error(\"Node not found: %r (looked in %s and as a full path)\" % (name, net.path()))\n    return n\n# --- LOP / Solaris: the same copy as a USD PointInstancer ---------------------\ndef build_lop(net, targets, root, x, y, tag=\"\"):\n    \"\"\"targets: SOP points with name + transform (or orient/pscale).\n    root: SOP root pieces, each with a name. Returns the SOP node that unpacks\n    the instancer back to geometry (for checking against the Copy to Points).\"\"\"\n    t_out = net.createNode(\"null\", \"LOP_targets\" + tag)\n    t_out.setInput(0, targets)\n    t_out.setPosition(hou.Vector2(x, y))\n    p_out = net.createNode(\"null\", \"LOP_prototypes\" + tag)\n    p_out.setInput(0, root)\n    p_out.setPosition(hou.Vector2(x + 3, y))\n\n    lop = net.createNode(\"lopnet\", \"LOP_instancing\" + tag)\n    lop.setPosition(hou.Vector2(x + 1.5, y - 1.2))\n    si = lop.createNode(\"sopimport\", \"root_pieces\")          # prims: /root_pieces/piece0, ...\n    si.parm(\"soppath\").set(si.relativePathTo(p_out))\n    si.setPosition(hou.Vector2(3, 0))\n    inst = lop.createNode(\"instancer\", \"instancer1\")         # prim: /instancer1\n    inst.setInput(1, si)                                     # prototypes come in the 2nd input\n    inst.setPosition(hou.Vector2(0, -1.5))\n    inst.parm(\"method\").set(\"pointinstancer\")\n    inst.parm(\"transformsourcemode\").set(\"extsop\")           # target points from a SOP\n    inst.parm(\"pointsoppath\").set(inst.relativePathTo(t_out))\n    inst.parm(\"protosourcemode\").set(\"second\")\n    inst.parm(\"protopattern\").set(\"/root_pieces/*\")          # EVERY piece is its own prototype\n    inst.parm(\"protoindexsrc\").set(\"nameattr\")               # point name picks the prototype\n    inst.parm(\"nameattr\").set(\"name\")\n    out = lop.createNode(\"null\", \"OUT_instances\")\n    out.setInput(0, inst)\n    out.setPosition(hou.Vector2(0, -3))\n    out.setDisplayFlag(True)\n\n    # back to SOPs, only to check the result (import the instancer prim ONLY -\n    # a Boundable pattern would also pull in the hidden prototype meshes)\n    li = net.createNode(\"lopimport::2.0\", \"LOP_check_import\" + tag)\n    li.parm(\"loppath\").set(li.relativePathTo(out))\n    li.parm(\"primpattern\").set(\"/instancer1\")\n    li.setPosition(hou.Vector2(x + 1.5, y - 2.4))\n    uu = net.createNode(\"unpackusd::2.0\", \"LOP_check_unpackusd\" + tag)\n    uu.setInput(0, li)\n    uu.parm(\"output\").set(\"polygons\")\n    uu.parm(\"iterations\").set(2)                             # instancer -> instances -> meshes\n    uu.setPosition(hou.Vector2(x + 1.5, y - 3.6))\n    return [t_out, p_out, lop, li, uu], uu\n\n\nnet = current_network()\nif net.childTypeCategory().name() != \"Sop\":\n    raise hou.Error(\"Open the Geometry (SOP) network that holds %s - %s is not one.\" % (TARGETS_NODE, net.path()))\ntargets = find(TARGETS_NODE, net)\nroot = find(ROOT_NODE, net)\npos = targets.position()\nnodes, check = build_lop(net, targets, root, pos[0] - 8, pos[1] - 2)\nprint(\"LOP instancing built in %s -> %s (unpacked check: %s)\" % (net.path(), nodes[2].path(), check.name()))\n", "visual": ""}, {"id": "rbd-root-targets-vex", "title": "ROOT_targets: full transform per piece", "lang": "vex", "context": "Attribute Wrangle · Points", "tested": "Houdini 21.0.671", "filename": "rbd_root_targets.vfl", "description": "ต่อหลัง DOP Import แบบ Fetch Packed Geometry ได้ target หนึ่ง point ต่อชิ้น มี 3@transform กับ P ตรงกับชิ้นในซิม แล้ว Copy to Points ชิ้น root (Piece Attribute = name)", "notes": "ต่อจากนี้: Attribute Delete (Delete Non Selected: name transform v) → Add (Delete Geometry But Keep the Points)\nต้องลบ orient / pivot / pscale / N ทิ้ง ไม่งั้นจะไปแย่ง transform", "code": "// One target point per simulated piece, carrying that piece's WHOLE transform:\n// emission rotation + pscale + the sim's motion.\nint prim = pointprims(0, @ptnum)[0];\nmatrix M = primintrinsic(0, \"packedfulltransform\", prim);\n3@transform = matrix3(M);\nv@P = set(getcomp(M, 3, 0), getcomp(M, 3, 1), getcomp(M, 3, 2));\ns@name = re_replace(\"_[0-9]+$\", \"\", s@name);   // piece0_12 -> piece0 (drop if names already match)\n", "visual": ""}, {"id": "rbd-point-targets-vex", "title": "ROOT_point_targets: points-only import", "lang": "vex", "context": "Attribute Wrangle · Points", "tested": "Houdini 21.0.671", "filename": "rbd_point_targets.vfl", "description": "วิธีที่สอง: ต่อหลัง DOP Import แบบ Create Points to Represent Objects ได้ 3@transform กับ P ของแต่ละชิ้นจาก point ของซิมอย่างเดียว ไม่ต้อง import geometry", "notes": "DOP Import ต้องใส่ Transfer Attributes = orient pivot restxform name v (restxform สำคัญที่สุด ถ้าไม่มีจะได้ชิ้นที่ไม่หมุนตอน emit และไม่มี pscale)\nต่อจากนี้: Attribute Delete (Delete Non Selected: name transform v) แล้วเข้า Copy to Points ได้เลย ไม่ต้องใช้ Add SOP เพราะไม่มี prim ติดมา", "code": "// Points-only method: DOP Import set to \"Create Points to Represent Objects\",\n// Transfer Attributes = orient pivot restxform name v\n// One point per piece -> rebuild that piece's WHOLE transform from the sim point:\n//   restxform = emission rotation + pscale (3x3) and the rest position (row 3)\n//   world     = (rest - pivot) * orient + P\nmatrix  X  = 4@restxform;\nmatrix3 A  = matrix3(X);\nvector  rp = set(getcomp(X, 3, 0), getcomp(X, 3, 1), getcomp(X, 3, 2));\nmatrix3 R  = qconvert(p@orient);\n3@transform = A * R;\nv@P = (rp - v@pivot) * R + v@P;\ns@name = re_replace(\"_[0-9]+$\", \"\", s@name);   // piece0_12 -> piece0 (drop if names already match)\n", "visual": ""}, {"id": "rbd-back-to-rest-vex", "title": "back_to_rest_pose: final-frame pieces → rest", "lang": "vex", "context": "Attribute Wrangle · Points", "tested": "Houdini 21.0.671", "filename": "back_to_rest_pose.vfl", "description": "อีกทางหนึ่ง ถ้าอยาก copy ชิ้นที่ fetch มาจากซิม (เช่นเฟรมสุดท้าย) แทนชิ้น root: ถอยการหมุนและการเลื่อนของซิมออก ให้ชิ้นกลับไปอยู่ตรงจุดที่ emit แล้วใช้ orient / pivot / P ของ RBD points ตามปกติ", "notes": "วัดแล้วตรงกับซิม max_err 0.00000 ที่เฟรม 5, 15, 25, 36 · Timeshift ของสอง input ต้องเป็นเฟรมเดียวกัน", "code": "// Alternative: put the FINAL-frame packed pieces back into their REST pose, then\n// Copy to Points re-applies the sim per frame:  world = (rest - pivot) * orient + P\n// input 0 = packed pieces fetched at the rest frame (Timeshift of a Fetch-Packed DOP Import)\n// input 1 = RBD points (DOP Import, Create Points) timeshifted to the SAME frame\nint pt = findattribval(1, \"point\", \"name\", s@name);\nif (pt \u003c 0) { removepoint(0, @ptnum); return; }\nvector4 qi = qinvert(point(1, \"orient\", pt));\nvector  P1 = point(1, \"P\", pt);\nvector  pv = point(1, \"pivot\", pt);\nint prim = pointprims(0, @ptnum)[0];\nmatrix3 T = primintrinsic(0, \"transform\", prim);\nsetprimintrinsic(0, \"transform\", prim, T * qconvert(qi));   // remove the sim's rotation\nv@P = qrotate(qi, v@P - P1) + pv;                           // move back to where it was emitted\n", "visual": ""}, {"id": "measure-orient-diff-vex", "title": "Measure orient difference between two copies", "lang": "vex", "context": "Attribute Wrangle · Detail", "tested": "Houdini 21.0.671", "filename": "measure_orient_diff.vfl", "description": "เช็คว่า geo สองชุด (ชิ้นเดียวกัน) หมุนต่างกันกี่องศา รอบแกนไหน เลื่อนไปเท่าไหร่ โดยวัดจากตำแหน่ง point จริง ไม่ต้องพึ่ง attribute orient", "notes": "อ่านผล: angle ≈ 0 แต่ offset ไม่ 0 = ปัญหา pivot · angle ≈ 180 = แกนกลับด้าน · fit_rms สูง = shape ต่างด้วย (scale หรือลำดับ point ไม่ตรง)\nทางไม่ต้องเขียนโค้ด: Extract Transform SOP (input 1 = ตัวถูก, input 2 = ตัวที่เช็ค)", "code": "// Measure how two copies of the SAME geometry differ (same point count + order).\n// Detail Wrangle: input 0 = the copy you are checking, input 1 = the reference.\nint n = npoints(0);\nif (n != npoints(1)) { warning(\"point count differs: %d vs %d\", n, npoints(1)); return; }\n\nvector c0 = 0, c1 = 0;\nfor (int i = 0; i \u003c n; i++) { c0 += point(0, \"P\", i); c1 += point(1, \"P\", i); }\nc0 /= n; c1 /= n;\n\nmatrix3 H = 0;\nfor (int i = 0; i \u003c n; i++)\n    H += outerproduct(point(1, \"P\", i) - c1, point(0, \"P\", i) - c0);\nmatrix3 M = polardecomp(H);                 // pure rotation part\nif (determinant(M) \u003c 0) warning(\"mirror, not a rotation: flipped or negative scale\");\n\nvector4 q = quaternion(M);\nfloat err = 0;\nfor (int i = 0; i \u003c n; i++)\n    err += length2((point(1, \"P\", i) - c1) * M - (point(0, \"P\", i) - c0));\n\np@diff_orient    = q;\nf@diff_angle_deg = degrees(2 * acos(clamp(abs(q.w), 0, 1)));\nv@diff_axis      = normalize(set(q.x, q.y, q.z));\nv@diff_offset    = c0 - c1;\nf@fit_rms        = sqrt(err / n);           // ~0 = only a rigid rotation apart\n", "visual": ""}]}]}]}</script>

<script id="app-js">
(function(){

  var DB = { techniques: [] };
  try { DB = JSON.parse(document.getElementById("lib-data").textContent); } catch(e) {}
  if (!DB.techniques) DB.techniques = [];

  var TYPES = ["Sop","Dop","Object","Lop","Cop","Vop","Top","Shelf","Other"];
